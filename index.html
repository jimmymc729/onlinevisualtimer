// ── Procedural backgrounds ────────────────────────────────────────────────────
// Drawn in-page rather than streamed. No network, no load wait, no file size —
// and they loop forever by construction, so there is no seam to hide, no title
// card and no camera move. Each generator exposes:
//   res(W,H) → internal canvas size (lava renders small and scales up)
//   css      → CSS filter applied to the canvas element (GPU side)
//   init     → per-instance state
//   draw(ctx, W, H, t, opts, state)   t = seconds
const PROC_GENS = {
  // Lava lamp. Flat circles merged by a CSS blur — no gradients, and the
  // softness is the point, so a quarter-res canvas is plenty.
  lava: {
    res: (W, H) => [Math.max(120, Math.round(W * 0.30)), Math.max(120, Math.round(H * 0.30))],
    css: 'blur(34px)',
    init: (o) => Array.from({ length: o.count || 12 }, () => ({
      x:     Math.random(),
      r:     0.056 + Math.random() * 0.058,
      phase: Math.random() * Math.PI * 2,
      speed: 0.055 + Math.random() * 0.075,
      sway:  0.03 + Math.random() * 0.05,
    })),
    draw(ctx, W, H, t, o, blobs) {
      ctx.fillStyle = o.bg;
      ctx.fillRect(0, 0, W, H);
      const R = Math.min(W, H);
      for (const b of blobs) {
        // Rise and sink on a slow sine, with a lazy horizontal sway
        const y = 0.5 + 0.44 * Math.sin(t * b.speed + b.phase);
        const x = b.x + b.sway * Math.sin(t * b.speed * 0.55 + b.phase * 1.7);
        ctx.fillStyle = o.blob;
        ctx.beginPath();
        ctx.arc(x * W, y * H, b.r * R, 0, Math.PI * 2);
        ctx.fill();
      }
    },
  },

  // Starfield. Cheap enough to run at full size; stars twinkle on their own
  // phase and the whole field drifts slowly so it never looks frozen.
  stars: {
    res: (W, H) => [W, H],
    css: 'none',
    init: (o, W, H) => ({
      stars: Array.from({ length: Math.round((W * H) / 1500 * (o.density || 1)) }, () => ({
        x: Math.random(), y: Math.random(),
        r: Math.random() * Math.random() * 2.1 + 0.45,
        tw: Math.random() * Math.PI * 2,
        sp: 0.25 + Math.random() * 1.5,
        accent: Math.random() < 0.16,
      })),
      haze: Array.from({ length: 7 }, () => ({
        x: Math.random(), y: Math.random(),
        r: 0.34 + Math.random() * 0.40,
        a: 0.012 + Math.random() * 0.022,
      })),
    }),
    draw(ctx, W, H, t, o, st) {
      ctx.fillStyle = o.bg;
      ctx.fillRect(0, 0, W, H);
      if (o.haze) {
        // Very faint galactic wash — flat fills, low alpha
        for (const h of st.haze) {
          ctx.globalAlpha = h.a;
          ctx.fillStyle = o.haze;
          ctx.beginPath();
          ctx.arc(h.x * W, h.y * H, h.r * Math.max(W, H), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      const dy = t * (o.drift || 0.004);
      for (const s of st.stars) {
        const y = (((s.y + dy) % 1) + 1) % 1;
        ctx.globalAlpha = 0.30 + 0.70 * (0.5 + 0.5 * Math.sin(t * s.sp + s.tw));
        ctx.fillStyle = s.accent ? o.accent : o.star;
        ctx.beginPath();
        ctx.arc(s.x * W, y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    },
  },
};

  gradientBg('gradient-tidepool', 'Tidepool', ['water', 'calm'], 'radial-gradient(circle at 28% 24%, rgba(255,255,255,0.2), transparent 18%), radial-gradient(circle at 72% 70%, rgba(34,197,94,0.25), transparent 24%), linear-gradient(155deg, #0f172a 0%, #0f766e 48%, #67e8f9 100%)'),

  gradientBg('gradient-blueprint', 'Blueprint', ['engineering', 'architecture'], 'linear-gradient(90deg, rgba(255,255,255,0.16) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.16) 1px, transparent 1px), linear-gradient(145deg, #0f172a 0%, #1d4ed8 100%)'),

  gradientBg('gradient-sunset', 'Sunset', ['warm', 'weather'], 'radial-gradient(circle at 50% 16%, rgba(255,255,255,0.22), transparent 16%), linear-gradient(180deg, #7c3aed 0%, #db2777 36%, #fb7185 60%, #fdba74 100%)'),

const ANIMATED_BACKGROUNDS = [
  animatedBg('animated-aurora-glacier', 'Aurora Glacier', ['animated', 'space', 'weather', 'calm'], 'Glacier Bay Entrance Night Sky with Aurora and Moon.webm', 'linear-gradient(180deg, #061120 0%, #112948 54%, #26415a 100%)'),

  animatedBg('animated-jellyfish', 'Drifting Jellyfish', ['animated', 'animals', 'water', 'science', 'calm'], 'Cephea cephea.webm', 'linear-gradient(180deg, #a4c7d7 0%, #7797a9 52%, #688496 100%)'),
  // Dark set — measured mean luminance 22–49 vs 90–160 for the clips above
  animatedBg('animated-milky-way', 'Milky Way', ['animated', 'space', 'nature', 'calm'], 'Milky Way over a Joshua tree (30865856965).webm', 'linear-gradient(180deg, #181a1c 0%, #151718 52%, #121416 100%)'),
  animatedBg('animated-skull-rock', 'Desert Stars', ['animated', 'space', 'nature', 'calm'], 'Stars over Skull Rock (30233587084).webm', 'linear-gradient(180deg, #050608 0%, #1a140f 52%, #0f0b07 100%)'),
  // Fades up from black over its first ~2s, so the loop starts after that
  animatedBg('animated-moon-clouds', 'Moonlit Clouds', ['animated', 'weather', 'space', 'calm'], 'Clouds over full moon at night (Free HD stock video).webm', 'linear-gradient(180deg, #303031 0%, #525253 52%, #2b2b2b 100%)', 2.0),
];

const BACKGROUNDS = [...ANIMATED_BACKGROUNDS, ...PROCEDURAL_BACKGROUNDS, ...CURATED_PHOTO_BACKGROUNDS, ...ACCENT_BACKGROUNDS];
const BACKGROUND_MAP = new Map(BACKGROUNDS.map(bg => [bg.id, bg]));

function backgroundMatchesCategory(bg, cat) {
  if (cat === 'all') return true;
  const cats = Array.isArray(bg.cats) ? bg.cats : [bg.cat].filter(Boolean);
  return cats.includes(cat);
}

let currentBgId = null;

function unsplashUrl(id, w, h) {
  return `https://images.unsplash.com/${id}?w=${w}&h=${h}&fit=crop&q=80`;
}

function cssUrl(url) {
  return `url("${url.replace(/"/g, '%22')}")`;
}

function backgroundUrl(bg, w, h) {
  if (bg.kind === 'animated') return bg.fallback;
  if (bg.kind === 'gradient') return bg.value;
  return unsplashUrl(bg.id, w, h);
}

let bgLoopRaf = null;

function clearBackgroundMedia() {
  // Stop the crossfade driver too — otherwise switching to a photo or None
  // leaves it running every frame against detached video elements.
  if (bgLoopRaf) { cancelAnimationFrame(bgLoopRaf); bgLoopRaf = null; }
  bgMediaLayer.querySelectorAll('video').forEach(v => { try { v.pause(); v.src = ''; } catch (e) {} });
  bgMediaLayer.replaceChildren();
}

function tryPlayVideo(video) {
  const maybePromise = video.play();
  if (maybePromise && typeof maybePromise.catch === 'function') {
    maybePromise.catch(() => {});
  }
}

// Crossfade looping.
//
// `video.loop = true` hard-cuts from the last frame back to the first, which is
// jarring on footage that wasn't authored as a loop. Instead we run two copies
// of the clip: shortly before the playing one ends, the other starts from zero
// and we fade between them. Motion always runs forward and the seam disappears.
// ── Procedural renderer ───────────────────────────────────────────────────────
// Runs at ~30fps (ambient motion needs no more) and honours reduced-motion by
// drawing a single still frame instead of animating.
const PROC_FPS = 30;
const reduceMotion = window.matchMedia
  ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

function drawProcFrame(gen, opts, ctx, W, H, t, state) {
  ctx.clearRect(0, 0, W, H);
  gen.draw(ctx, W, H, t, opts, state);
}

function mountProceduralBackground(bg) {
  clearBackgroundMedia();
  const gen = PROC_GENS[bg.gen];
  if (!gen) return;

  const cv = document.createElement('canvas');
  cv.className = 'bg-media-canvas';
  cv.style.filter = gen.css || 'none';
  cv.setAttribute('aria-hidden', 'true');
  bgMediaLayer.appendChild(cv);
  const ctx = cv.getContext('2d');

  let state = null, cw = 0, ch = 0;
  const resize = () => {
    const bw = Math.max(2, bgMediaLayer.clientWidth);
    const bh = Math.max(2, bgMediaLayer.clientHeight);
    const [w, h] = gen.res(bw, bh);
    if (w === cw && h === ch) return;
    cw = cv.width = w; ch = cv.height = h;
    state = gen.init(bg.opts, w, h);
  };
  resize();

  if (reduceMotion.matches) {
    drawProcFrame(gen, bg.opts, ctx, cw, ch, 8, state);   // one still frame
    return;
  }

  const t0 = performance.now();
  let last = 0;
  const step = (now) => {
    bgLoopRaf = requestAnimationFrame(step);
    if (now - last < 1000 / PROC_FPS) return;
    last = now;
    resize();
    drawProcFrame(gen, bg.opts, ctx, cw, ch, (now - t0) / 1000, state);
  };
  bgLoopRaf = requestAnimationFrame(step);
}

// Small still frame for the picker tile, rendered once.
function proceduralPoster(bg, w = 200, h = 120) {
  const gen = PROC_GENS[bg.gen];
  if (!gen) return null;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  gen.draw(x, w, h, 7.5, bg.opts, gen.init(bg.opts, w, h));
  return c.toDataURL('image/png');
}

const XFADE_S = 1.2;               // overlap length, seconds

function mountAnimatedBackground(bg) {
  clearBackgroundMedia();
  if (bgLoopRaf) { cancelAnimationFrame(bgLoopRaf); bgLoopRaf = null; }

  const make = () => {
    const v = document.createElement('video');
    v.className = 'bg-media-video';
    v.src = bg.src;
    v.muted = true;
    v.loop = false;                // we handle the wrap ourselves
    v.playsInline = true;
    v.preload = 'auto';
    v.setAttribute('aria-hidden', 'true');
    v.style.opacity = '0';
    v.style.transition = 'none';   // opacity is driven per-frame below
    bgMediaLayer.appendChild(v);
    return v;
  };

  // `b` sits on top of `a` in stacking order. Only `b`'s opacity is ever
  // animated — `a` stays fully opaque underneath. Fading both at once would
  // let the board show through by ~25% at the midpoint and visibly dim.
  const START = bg.startAt || 0;
  const a = make(), b = make();
  a.style.opacity = '1';
  b.style.opacity = '0';
  let front = a, back = b, handedOff = false;
  if (START) {
    front.addEventListener('loadedmetadata',
      () => { try { front.currentTime = START; } catch (e) {} }, { once: true });
  }
  tryPlayVideo(front);

  const step = () => {
    bgLoopRaf = requestAnimationFrame(step);
    const d = front.duration;
    if (!d || !isFinite(d)) return;

    const usable = Math.max(0.5, d - START);          // the part we actually loop
    const fade = Math.min(XFADE_S, usable / 3);       // short clips get a shorter overlap
    const left = d - front.currentTime;

    if (!handedOff && left <= fade) {
      handedOff = true;
      try { back.currentTime = START; } catch (e) {}
      tryPlayVideo(back);
    }
    if (handedOff) {
      const t = Math.min(1, Math.max(0, 1 - left / fade));
      b.style.opacity = String(back === b ? t : 1 - t);
      if (left <= 0.03) {
        // Hand over: the finished clip rewinds and waits its turn underneath
        front.pause();
        try { front.currentTime = START; } catch (e) {}
        b.style.opacity = (back === b) ? '1' : '0';
        const tmp = front; front = back; back = tmp;
        handedOff = false;
      }
    }
  };
  bgLoopRaf = requestAnimationFrame(step);
}

function setBackground(id) {
  const bg = id ? BACKGROUND_MAP.get(id) : null;
  currentBgId = bg ? id : null;
  if (!bg) {
    clearBackgroundMedia();
    board.style.backgroundImage = '';
    board.style.backgroundSize  = '';
    board.style.backgroundPosition = '';
    board.style.backgroundRepeat = '';
    document.body.classList.remove('has-bg');
    document.getElementById('bg-btn').classList.remove('active');
    localStorage.removeItem('bg');
  } else {
    if (bg.kind === 'animated') {
      board.style.backgroundImage = bg.fallback;
      mountAnimatedBackground(bg);
    } else if (bg.kind === 'procedural') {
      board.style.backgroundImage = `linear-gradient(${bg.opts.bg}, ${bg.opts.bg})`;
      mountProceduralBackground(bg);
    } else {
      clearBackgroundMedia();
      board.style.backgroundImage = bg.kind === 'gradient'
        ? bg.value
        : cssUrl(backgroundUrl(bg, 1920, 1080));
    }
    board.style.backgroundSize     = 'cover';
    board.style.backgroundPosition = 'center';
    board.style.backgroundRepeat   = 'no-repeat';
    document.body.classList.add('has-bg');
    document.getElementById('bg-btn').classList.add('active');
    localStorage.setItem('bg', bg.id);
  }
  // Update active thumbnail. Done in place rather than re-rendering the grid so
  // the panel keeps its scroll position when you try backgrounds one after another.
  document.querySelectorAll('.bg-thumb').forEach(t => {
    const on = t.dataset.id === (currentBgId || 'none');
    t.classList.toggle('active', on);
    const tick = t.querySelector('.bg-check');
    if (on && !tick) {
      const el = document.createElement('span');
      el.className = 'bg-check'; el.textContent = '✓';
      t.appendChild(el);
    } else if (!on && tick) {
      tick.remove();
    }
  });
}

let bgCat = 'all';
let bgQuery = '';

function renderBgGrid(cat = bgCat) {
  bgCat = cat;
  const grid = document.getElementById('bg-grid');
  grid.innerHTML = '';

  // None tile
  const none = document.createElement('div');
  none.className = 'bg-thumb none-tile' + (currentBgId === null ? ' active' : '');
  none.dataset.id = 'none';
  none.textContent = '✕ None';
  none.addEventListener('click', () => setBackground(null));
  grid.appendChild(none);

  const q = bgQuery.trim().toLowerCase();
  const list = BACKGROUNDS.filter(bg =>
    backgroundMatchesCategory(bg, cat) &&
    (!q || bg.name.toLowerCase().includes(q) ||
     (Array.isArray(bg.cats) ? bg.cats : []).some(c => c.includes(q)))
  );

  list.forEach(bg => {
    const tile = document.createElement('div');
    tile.className = 'bg-thumb' + (bg.kind === 'animated' ? ' animated-thumb' : '') + (currentBgId === bg.id ? ' active' : '');
    tile.dataset.id = bg.id;
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', bg.name);

    if (bg.kind === 'gradient') {
      tile.style.backgroundImage = bg.value;
      tile.style.backgroundSize = 'cover';
      tile.style.backgroundPosition = 'center';
    } else if (bg.kind === 'procedural') {
      const poster = proceduralPoster(bg);
      if (poster) tile.style.backgroundImage = `url("${poster}")`;
      tile.style.backgroundSize = 'cover';
      tile.style.backgroundPosition = 'center';
    } else if (bg.kind === 'animated') {
      // Gradient stands in until the video is hovered
      tile.style.backgroundImage = bg.fallback;
      tile.style.backgroundSize = 'cover';
      tile.style.backgroundPosition = 'center';
      const preview = document.createElement('video');
      preview.className = 'bg-thumb-video';
      preview.src = bg.src;
      preview.muted = true;
      preview.loop = true;
      preview.playsInline = true;
      preview.preload = 'none';           // only fetched on hover
      preview.setAttribute('aria-hidden', 'true');
      tile.appendChild(preview);
      tile.addEventListener('mouseenter', () => { preview.preload = 'metadata'; tryPlayVideo(preview); });
      tile.addEventListener('mouseleave', () => {
        preview.pause();
        try { preview.currentTime = 0; } catch (e) {}
      });
    } else {
      // A real <img> rather than a CSS background, so we get load/error events:
      // lazy-loading and self-removal on failure both depend on them.
      const img = document.createElement('img');
      img.className = 'bg-thumb-img';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = '';
      img.src = backgroundUrl(bg, 400, 240);
      img.addEventListener('load',  () => tile.classList.add('loaded'));
      img.addEventListener('error', () => tile.remove());   // never leave a hole
      tile.appendChild(img);
    }

    const label = document.createElement('span');
    label.className = 'bg-thumb-label';
    label.textContent = bg.name;
    tile.appendChild(label);
    if (currentBgId === bg.id) {
      const tick = document.createElement('span');
      tick.className = 'bg-check'; tick.textContent = '✓';
      tile.appendChild(tick);
    }
    tile.addEventListener('click', () => setBackground(bg.id));
    grid.appendChild(tile);
  });

  const empty = document.createElement('p');
  empty.className = 'bg-empty';
  empty.textContent = q ? `No backgrounds match “${bgQuery.trim()}”` : 'Nothing here yet';
  empty.style.display = list.length ? 'none' : 'block';
  grid.appendChild(empty);
}

// Hide category chips that have nothing in them, so the row doesn't advertise
// empty tabs as the library changes.
function pruneEmptyBgTabs() {
  document.querySelectorAll('.bg-tab').forEach(tab => {
    const c = tab.dataset.cat;
    const n = c === 'all' ? BACKGROUNDS.length
                          : BACKGROUNDS.filter(bg => backgroundMatchesCategory(bg, c)).length;
    tab.style.display = n ? '' : 'none';
  });
}

// Tabs
document.querySelectorAll('.bg-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.bg-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderBgGrid(tab.dataset.cat);
  });
});

// Search
const bgSearch = document.getElementById('bg-search');
if (bgSearch) {
  bgSearch.addEventListener('input', () => { bgQuery = bgSearch.value; renderBgGrid(); });
}

// Open / close
const bgOverlay = document.getElementById('bg-overlay');
document.getElementById('bg-btn').addEventListener('click', () => {
  bgOverlay.classList.toggle('open');
  if (bgOverlay.classList.contains('open')) { pruneEmptyBgTabs(); renderBgGrid(bgCat); }
});
document.getElementById('close-bg').addEventListener('click', () => bgOverlay.classList.remove('open'));

// ── Widget opacity + invisible frames ─────────────────────────────────────────
(function() {
  const slider  = document.getElementById('widget-opacity');
  const label   = document.getElementById('opacity-val');
  const invisCb = document.getElementById('invisible-frames');

  function applyOpacity(v) {
    document.documentElement.style.setProperty('--widget-alpha', (v/100).toFixed(2));
    label.textContent = v + '%';
  }
  function applyInvisible(on) {
    document.body.classList.toggle('invisible-frames', on);
    // Disable opacity slider when fully invisible
    slider.disabled = on;
    label.style.opacity = on ? '0.3' : '1';
  }

  const savedOp  = parseInt(localStorage.getItem('widget-opacity') ?? '82');
  const savedInv = localStorage.getItem('invisible-frames') === 'true';
  slider.value   = savedOp;
  applyOpacity(savedOp);
  invisCb.checked = savedInv;
  applyInvisible(savedInv);

  slider.addEventListener('input', () => {
    applyOpacity(parseInt(slider.value));
    localStorage.setItem('widget-opacity', slider.value);
  });
  invisCb.addEventListener('change', () => {
    applyInvisible(invisCb.checked);
    localStorage.setItem('invisible-frames', invisCb.checked);
  });
})();

// Restore from localStorage
function initBackground() {
  const saved = localStorage.getItem('bg');
  if (saved) setBackground(saved);
}

// ── Layout persistence ────────────────────────────────────────────────────────
const LAYOUT_VERSION = 4;

function saveLayout() {
  const state = {
    v:       LAYOUT_VERSION,
    mode:    layoutMode,
    widgets: widgets.map(w => ({
      type: w.type,
      left: w.card.style.left,
      top:  w.card.style.top,
      w:    w.card.style.width,
      h:    w.card.style.height,
      opt:  WIDGET_META[w.type].opt ? !!w.state[WIDGET_META[w.type].opt.key] : undefined,
    })),
  };
  localStorage.setItem('layout', JSON.stringify(state));
}

function restoreLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem('layout') || 'null');
    // If no saved state, or version mismatch → use clean default
    if (!saved || saved.v !== LAYOUT_VERSION) {
      localStorage.removeItem('layout');
      localStorage.removeItem('bg');          // also clear background
      localStorage.removeItem('invisible-frames');
      return false;
    }
    if (!Array.isArray(saved.widgets) || !saved.widgets.length) return false;
    layoutMode = saved.mode === 'manual' ? 'manual' : 'auto';
    saved.widgets.forEach(s => {
      if (!WIDGET_META[s.type]) return;   // skip types that no longer exist
      const widget = createWidget(s.type, { skipArrange: true, skipReveal: true, opt: s.opt });
      widget.card.style.left   = s.left;
      widget.card.style.top    = s.top;
      widget.card.style.width  = s.w;
      widget.card.style.height = s.h;
    });
    return true;
  } catch { return false; }
}

// Save layout whenever a widget is moved or resized (debounced)
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLayout, 600);
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateDigits();
initBackground();

// Decode the recordings now, not when the first cue fires. An AudioContext may
// only be created before a gesture in a suspended state, but decodeAudioData
// works fine on a suspended context — so the samples are ready long before
// anyone presses Start.
try { mzCtx(); } catch (e) { /* no audio support; the synth covers it */ }

requestAnimationFrame(loop);
requestAnimationFrame(() => {
  // Try to restore saved layout; fall back to default circle + blocks
  if (!restoreLayout()) {
    createWidget('circle');
    createWidget('blocks');
  }
  // Listen for any position/size changes and save
  document.addEventListener('mouseup',  scheduleSave);
  document.addEventListener('touchend', scheduleSave);
});
</script>
