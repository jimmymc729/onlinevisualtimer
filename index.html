function buildQueryBackgrounds() {
  let lock = 1;
  return QUERY_BACKGROUND_SERIES.flatMap(series =>
    series.items.map(([name, query]) =>
      queryPhotoBg(`query-${series.key}-${lock}`, name, series.cats, query, lock++)
    )
  );
}

const QUERY_PHOTO_BACKGROUNDS = buildQueryBackgrounds();
const BACKGROUNDS = [...ANIMATED_BACKGROUNDS, ...CURATED_PHOTO_BACKGROUNDS, ...QUERY_PHOTO_BACKGROUNDS, ...ACCENT_BACKGROUNDS];
const BACKGROUND_MAP = new Map(BACKGROUNDS.map(bg => [bg.id, bg]));

function backgroundMatchesCategory(bg, cat) {
  if (cat === 'all') return true;
  const cats = Array.isArray(bg.cats) ? bg.cats : [bg.cat].filter(Boolean);
  return cats.includes(cat);
}

let currentBgId = null;

function unsplashUrl(id, w, h) {
  return `https://images.unsplash.com/${id}?w=${w}&h=${h}&fit=crop&q=80`;
}

function queryPhotoUrl(query, lock, w, h) {
  const encodedQuery = query
    .split(',')
    .map(term => encodeURIComponent(term.trim()))
    .join(',');
  return `https://loremflickr.com/${w}/${h}/${encodedQuery}?lock=${lock}`;
}

function cssUrl(url) {
  return `url("${url.replace(/"/g, '%22')}")`;
}

function backgroundUrl(bg, w, h) {
  if (bg.kind === 'animated') return bg.fallback;
  if (bg.kind === 'gradient') return bg.value;
  if (bg.kind === 'query-photo') return queryPhotoUrl(bg.query, bg.lock, w, h);
  return unsplashUrl(bg.id, w, h);
}

function clearBackgroundMedia() {
  bgMediaLayer.replaceChildren();
}

function tryPlayVideo(video) {
  const maybePromise = video.play();
  if (maybePromise && typeof maybePromise.catch === 'function') {
    maybePromise.catch(() => {});
  }
}

function mountAnimatedBackground(bg) {
  clearBackgroundMedia();
  const video = document.createElement('video');
  video.className = 'bg-media-video';
  video.src = bg.src;
  video.muted = true;
  video.loop = true;
  video.autoplay = true;
  video.playsInline = true;
  video.preload = 'metadata';
  video.setAttribute('aria-hidden', 'true');
  video.addEventListener('loadedmetadata', () => tryPlayVideo(video), { once: true });
  bgMediaLayer.appendChild(video);
  tryPlayVideo(video);
}

function setBackground(id) {
  const bg = id ? BACKGROUND_MAP.get(id) : null;
  currentBgId = bg ? id : null;
  if (!bg) {
    clearBackgroundMedia();
    board.style.backgroundImage = '';
    board.style.backgroundSize  = '';
    board.style.backgroundPosition = '';
    board.style.backgroundRepeat = '';
    document.body.classList.remove('has-bg');
    document.getElementById('bg-btn').classList.remove('active');
    localStorage.removeItem('bg');
  } else {
    if (bg.kind === 'animated') {
      board.style.backgroundImage = bg.fallback;
      mountAnimatedBackground(bg);
    } else {
      clearBackgroundMedia();
      board.style.backgroundImage = bg.kind === 'gradient'
        ? bg.value
        : cssUrl(backgroundUrl(bg, 1920, 1080));
    }
    board.style.backgroundSize     = 'cover';
    board.style.backgroundPosition = 'center';
    board.style.backgroundRepeat   = 'no-repeat';
    document.body.classList.add('has-bg');
    document.getElementById('bg-btn').classList.add('active');
    localStorage.setItem('bg', bg.id);
  }
  // Update active thumbnail
  document.querySelectorAll('.bg-thumb').forEach(t => {
    t.classList.toggle('active', t.dataset.id === (currentBgId || 'none'));
  });
}

function renderBgGrid(cat) {
  const grid = document.getElementById('bg-grid');
  grid.innerHTML = '';

  // None tile
  const none = document.createElement('div');
  none.className = 'bg-thumb none-tile' + (currentBgId === null ? ' active' : '');
  none.dataset.id = 'none';
  none.textContent = '✕ None';
  none.addEventListener('click', () => setBackground(null));
  grid.appendChild(none);

  const list = BACKGROUNDS.filter(bg => backgroundMatchesCategory(bg, cat));
  list.forEach(bg => {
    const tile = document.createElement('div');
    tile.className = 'bg-thumb' + (bg.kind === 'animated' ? ' animated-thumb' : '') + (currentBgId === bg.id ? ' active' : '');
    tile.dataset.id = bg.id;
    tile.style.backgroundImage = bg.kind === 'gradient'
      ? bg.value
      : `linear-gradient(180deg, rgba(8,12,20,0.06), rgba(8,12,20,0.06)), ${bg.kind === 'animated' ? backgroundUrl(bg, 400, 240) : cssUrl(backgroundUrl(bg, 400, 240))}`;
    tile.style.backgroundSize = 'cover';
    tile.style.backgroundPosition = 'center';
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', bg.name);
    if (bg.kind === 'animated') {
      const preview = document.createElement('video');
      preview.className = 'bg-thumb-video';
      preview.src = bg.src;
      preview.muted = true;
      preview.loop = true;
      preview.playsInline = true;
      preview.preload = 'metadata';
      preview.setAttribute('aria-hidden', 'true');
      tile.appendChild(preview);
      tile.addEventListener('mouseenter', () => tryPlayVideo(preview));
      tile.addEventListener('mouseleave', () => {
        preview.pause();
        try { preview.currentTime = 0; } catch (e) {}
      });
    }
    const label = document.createElement('span');
    label.className = 'bg-thumb-label';
    label.textContent = bg.name;
    tile.appendChild(label);
    tile.addEventListener('click', () => setBackground(bg.id));
    grid.appendChild(tile);
  });
}

// Tabs
document.querySelectorAll('.bg-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.bg-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderBgGrid(tab.dataset.cat);
  });
});

  if (bgOverlay.classList.contains('open')) renderBgGrid('all');
});
document.getElementById('close-bg').addEventListener('click', () => bgOverlay.classList.remove('open'));

// ── Widget opacity + invisible frames ─────────────────────────────────────────
(function() {
  const slider  = document.getElementById('widget-opacity');
  const label   = document.getElementById('opacity-val');
  const invisCb = document.getElementById('invisible-frames');

  function applyOpacity(v) {
    document.documentElement.style.setProperty('--widget-alpha', (v/100).toFixed(2));
    label.textContent = v + '%';
  }
  function applyInvisible(on) {
    document.body.classList.toggle('invisible-frames', on);
    // Disable opacity slider when fully invisible
    slider.disabled = on;
    label.style.opacity = on ? '0.3' : '1';
  }

  const savedOp  = parseInt(localStorage.getItem('widget-opacity') ?? '82');
  const savedInv = localStorage.getItem('invisible-frames') === 'true';
  slider.value   = savedOp;
  applyOpacity(savedOp);
  invisCb.checked = savedInv;
  applyInvisible(savedInv);

  slider.addEventListener('input', () => {
    applyOpacity(parseInt(slider.value));
    localStorage.setItem('widget-opacity', slider.value);
  });
  invisCb.addEventListener('change', () => {
    applyInvisible(invisCb.checked);
    localStorage.setItem('invisible-frames', invisCb.checked);
  });
})();

// Restore from localStorage
function initBackground() {
  const saved = localStorage.getItem('bg');
  if (saved) setBackground(saved);
}

// ── Layout persistence ────────────────────────────────────────────────────────
const LAYOUT_VERSION = 4;

function saveLayout() {
  const state = {
    v:       LAYOUT_VERSION,
    mode:    layoutMode,
    widgets: widgets.map(w => ({
      type: w.type,
      left: w.card.style.left,
      top:  w.card.style.top,
      w:    w.card.style.width,
      h:    w.card.style.height,
    })),
  };
  localStorage.setItem('layout', JSON.stringify(state));
}

function restoreLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem('layout') || 'null');
    // If no saved state, or version mismatch → use clean default
    if (!saved || saved.v !== LAYOUT_VERSION) {
      localStorage.removeItem('layout');
      localStorage.removeItem('bg');          // also clear background
      localStorage.removeItem('invisible-frames');
      return false;
    }
    if (!Array.isArray(saved.widgets) || !saved.widgets.length) return false;
    layoutMode = saved.mode === 'manual' ? 'manual' : 'auto';
    saved.widgets.forEach(s => {
      if (!WIDGET_META[s.type]) return;   // skip types that no longer exist
      const widget = createWidget(s.type, { skipArrange: true, skipReveal: true });
      widget.card.style.left   = s.left;
      widget.card.style.top    = s.top;
      widget.card.style.width  = s.w;
      widget.card.style.height = s.h;
    });
    return true;
  } catch { return false; }
}

// Save layout whenever a widget is moved or resized (debounced)
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLayout, 600);
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateDigits();
initBackground();
requestAnimationFrame(loop);
requestAnimationFrame(() => {
  // Try to restore saved layout; fall back to default circle + blocks
  if (!restoreLayout()) {
    createWidget('circle');
    createWidget('blocks');
  }
  // Listen for any position/size changes and save
  document.addEventListener('mouseup',  scheduleSave);
  document.addEventListener('touchend', scheduleSave);
});
