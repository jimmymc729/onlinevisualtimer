  const cowW    = Math.min(spanW / UFO_COWS * 0.90, Math.max(14, H * 0.20));
  const cowH    = cowW * 0.78;
  const cowX    = i => marginX + spanW * ((i + 0.5) / UFO_COWS);

  // Which cow is being taken, and how far along
  const prog   = Math.min(UFO_COWS, elapsed * UFO_COWS);
  const done   = Math.min(UFO_COWS, Math.floor(prog));
  const frac   = Math.min(1, prog - done);
  const active = done < UFO_COWS ? done : -1;

  const TRAVEL  = 0.30;                            // share of the interval spent flying over
  const beaming = active >= 0 && frac >= TRAVEL;
  const riseT   = beaming ? (frac - TRAVEL) / (1 - TRAVEL) : 0;

  // Saucer position — glides to the next cow, then holds while it beams
  let ufoX;
  if (active < 0) {
    ufoX = cowX(UFO_COWS - 1);
  } else if (frac < TRAVEL) {
    const from = active === 0 ? cowX(0) : cowX(active - 1);
    const t = frac / TRAVEL;
    const e = t * t * (3 - 2 * t);                 // smoothstep
    ufoX = from + (cowX(active) - from) * e;
  } else {
    ufoX = cowX(active);
  }
  const hoverY = Math.max(24, groundY - Math.max(64, H * 0.54));
  let ufoY = hoverY + Math.sin(now / 620) * 3;
  let ufoScale = 1;

  // Outro: the saucer hangs a beat, then rockets away
  if (ot > 0) {
    const t = Math.max(0, (ot - 0.30) / 0.70);
    ufoY -= t * t * (hoverY + H * 0.5);
    ufoScale = Math.max(0.15, 1 - t * 0.7);
  }

  const ufoW = Math.max(38, Math.min(W * 0.26, cowW * 3.0));

  // ── Tractor beam ────────────────────────────────────────────────────────────
  if (beaming && ot === 0) {
    const halfTop = ufoW * 0.10, halfBot = cowW * 0.85;
    const beamTop = ufoY + ufoW * 0.12;   // matches the saucer's emitter
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ufoX - halfTop, beamTop);
    ctx.lineTo(ufoX + halfTop, beamTop);
    ctx.lineTo(ufoX + halfBot, groundY);
    ctx.lineTo(ufoX - halfBot, groundY);
    ctx.closePath();
    ctx.fillStyle = col + '2b';
    ctx.fill();
    // Scan lines travelling up the beam
    ctx.clip();
    ctx.strokeStyle = col + '55';
    ctx.lineWidth = 2;
    const span = groundY - ufoY;
    for (let k = 0; k < 5; k++) {
      const p  = ((now / 700 + k / 5) % 1);
      const yy = groundY - p * span;
      const hw = halfTop + (halfBot - halfTop) * ((yy - ufoY) / span);
      ctx.beginPath(); ctx.moveTo(ufoX - hw, yy); ctx.lineTo(ufoX + hw, yy); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Ground ──────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#1a2844';
  ctx.fillRect(0, groundY, W, H - groundY);

  // Grass tufts, laid out once and reused so they don't shimmer between frames
  if (!state.tufts || state.tuftW !== W) {
    state.tuftW = W;
    const n = Math.max(8, Math.round(W / 24));
    state.tufts = Array.from({ length: n }, (_, i) => ({
      x: (i + 0.5) * (W / n) + (Math.random() - 0.5) * (W / n) * 0.7,
      h: 3 + Math.random() * 5,
      lean: (Math.random() - 0.5) * 2.4,
    }));
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  state.tufts.forEach(t => {
    ctx.moveTo(t.x, groundY + 1);
    ctx.lineTo(t.x + t.lean, groundY - t.h);
  });
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

  // ── The herd ────────────────────────────────────────────────────────────────
  for (let i = 0; i < UFO_COWS; i++) {
    if (i < done) continue;                        // already taken
    if (i === active && beaming) {
      // Rising up the beam: eases off the ground, tumbles, shrinks into the hull
      const lift = riseT * riseT * (3 - 2 * riseT);            // smoothstep
      const y  = groundY + (ufoY + ufoW * 0.12 - groundY) * lift;
      const x  = cowX(i) + (ufoX - cowX(i)) * lift;
      const sc = 1 - lift * 0.42;
      const wob = Math.sin(riseT * 13) * 0.5 * Math.min(1, riseT * 2.2);
      ctx.save();
      ctx.globalAlpha = riseT > 0.82 ? Math.max(0, (1 - riseT) / 0.18) : 1;
      drawCow(ctx, x, y, cowW * sc, cowH * sc, col, wob);
      ctx.restore();
    } else {
      // Grazing: a gentle idle bob keeps the herd alive
      const bob = Math.sin(now / 900 + i * 1.7) * (cowH * 0.02);
      drawCow(ctx, cowX(i), groundY + bob, cowW, cowH, col, 0);
    }
  }

  // ── Saucer ──────────────────────────────────────────────────────────────────
  drawSaucer(ctx, ufoX, ufoY, ufoW, col, now / 260, ufoScale);
}

// ── Render: Sheep Herding ─────────────────────────────────────────────────────
// Same counting idea as Cow Abduction — the flock left in the field is the time
// remaining — but the motion is deliberately different: sheep walk horizontally
// into the barn with a leg cycle rather than being lifted straight up.
const SHEEP_COUNT = 10;

// A woolly sheep facing right. (x, y) is the centre of its feet. `step` drives
// the walk cycle; 0 means standing.
function drawSheepBody(ctx, x, y, w, h, col, step, stride = 1, graze = 0, flip = false) {
  // Head and legs take a darkened tint of the timer colour — near-black vanishes
  // against the night hills, and this keeps the whole animal on-palette.
  const DARK  = lerpHex(col, '#0b1120', 0.32);
  const bodyW = w * 0.64, bodyH = h * 0.46;
  const bx = x - w / 2, byTop = y - h * 0.80, byBot = byTop + bodyH;
  const legH = y - byBot;

  ctx.save();
  if (flip) { ctx.translate(x, 0); ctx.scale(-1, 1); ctx.translate(-x, 0); }

  // Short stubby legs — the shorter they are against the body, the cuter it reads
  const lw = Math.max(2.4, w * 0.098);
  ctx.fillStyle = DARK;
  [[0.20, 1], [0.38, -1], [0.64, -1], [0.82, 1]].forEach(([f, dir]) => {
    ctx.save();
    ctx.translate(bx + bodyW * f, byBot);
    ctx.rotate(Math.sin(step) * dir * 0.075 * stride);
    rrect(ctx, -lw / 2, -lw * 0.3, lw, legH + lw * 0.3, lw * 0.5);
    ctx.fill();
    ctx.restore();
  });

  // Fleece: a ring of small puffs around an ellipse, so the outline is bumpy all
  // the way round rather than a few big lobes.
  const cxp = bx + bodyW * 0.50, cyp = byTop + bodyH * 0.46;
  const rx = bodyW * 0.54, ry = bodyH * 0.50;
  ctx.fillStyle = col;
  const PUFFS = 13;
  for (let i = 0; i < PUFFS; i++) {
    const a = (i / PUFFS) * Math.PI * 2;
    const pr = (0.155 + 0.055 * Math.sin(i * 2.7)) * w * 0.5;
    ctx.beginPath();
    ctx.arc(cxp + Math.cos(a) * rx * 0.86, cyp + Math.sin(a) * ry * 0.80, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(cxp, cyp, rx * 0.92, ry * 0.92, 0, 0, Math.PI * 2);
  ctx.fill();

  const hw = w * 0.36, hh = h * 0.36;
  const hx = bx + bodyW * 0.72, hy = byTop + bodyH * 0.14;
  ctx.save();
  if (graze > 0.001) {
    // Mostly a drop with a slight tilt — a large rotation swings the muzzle out
    // past the body and the head reads as having fallen off.
    ctx.translate(graze * hw * 0.22, graze * h * 0.25);
    const px = hx + hw * 0.15, py = hy + hh * 0.5;
    ctx.translate(px, py); ctx.rotate(graze * 0.42); ctx.translate(-px, -py);
  }
  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.ellipse(hx + hw * 0.10, hy + hh * 0.16, hw * 0.26, hh * 0.20, -0.85, 0, Math.PI * 2);
  ctx.fill();                                                                  // ear
  rrect(ctx, hx + hw * 0.02, hy + hh * 0.06, hw * 0.92, hh * 0.80, hw * 0.42); ctx.fill(); // skull
  rrect(ctx, hx + hw * 0.44, hy + hh * 0.36, hw * 0.60, hh * 0.44, hh * 0.22); ctx.fill(); // muzzle
  // Fleecy forelock tufts over the brow
  ctx.fillStyle = col;
  [[0.16, -0.02, 0.20], [0.42, -0.09, 0.23], [0.68, -0.01, 0.18]].forEach(([dx, dy, r]) => {
    ctx.beginPath();
    ctx.arc(hx + hw * dx, hy + hh * dy, hw * r, 0, Math.PI * 2);
    ctx.fill();
  });
  // A bigger eye with a pupil does most of the work of making it look friendly
  ctx.fillStyle = '#f7faff';
  ctx.beginPath();
  ctx.arc(hx + hw * 0.50, hy + hh * 0.36, Math.max(1.2, w * 0.036), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#101a2e';
  ctx.beginPath();
  ctx.arc(hx + hw * 0.52, hy + hh * 0.37, Math.max(0.6, w * 0.018), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();   // head
  ctx.restore();   // facing
}

// The sheepdog: low, dark, pointed ears and a raised tail.
function drawDog(ctx, x, y, w, h, step) {
  // A border collie: four legs, a plumed tail, pricked ears and a small white
  // chest patch. The old one was a two-legged slab and read as a generic animal.
  const DK = '#4a5f8a', LT = '#dce6f5';
  const bodyW = w * 0.72, bodyH = h * 0.38;
  const bx = x - w / 2, byTop = y - h * 0.68, byBot = byTop + bodyH;
  const legH = y - byBot;

  ctx.fillStyle = DK;
  const lw = Math.max(1.8, w * 0.075);
  [[0.22, 1], [0.34, 1], [0.70, -1], [0.82, -1]].forEach(([f, dir]) => {
    ctx.save();
    ctx.translate(bx + bodyW * f, byBot);
    ctx.rotate(Math.sin(step) * dir * 0.34);
    rrect(ctx, -lw / 2, -lw * 0.3, lw, legH + lw * 0.3, lw * 0.5);
    ctx.fill();
    ctx.restore();
  });

  // Plumed tail, carried up
  ctx.strokeStyle = DK;
  ctx.lineWidth = Math.max(2.4, w * 0.095);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx + bodyW * 0.06, byTop + bodyH * 0.42);
  ctx.bezierCurveTo(bx - w * 0.07, byTop + bodyH * 0.28,
                    bx - w * 0.09, byTop - h * 0.08,
                    bx + w * 0.02, byTop - h * 0.20);
  ctx.stroke();

  rrect(ctx, bx, byTop, bodyW, bodyH, bodyH * 0.46);
  ctx.fill();
  // Small chest patch, low and forward — a marking rather than a badge
  ctx.fillStyle = LT;
  ctx.beginPath();
  ctx.ellipse(bx + bodyW * 0.84, byTop + bodyH * 0.80, bodyW * 0.10, bodyH * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  const hw = w * 0.30, hh = h * 0.26;
  const hx = bx + bodyW * 0.76, hy = byTop - hh * 0.40;
  ctx.fillStyle = DK;
  [[0.14, -0.34], [0.44, -0.06]].forEach(([ex, tilt]) => {   // pricked ears
    ctx.save();
    ctx.translate(hx + hw * ex, hy + hh * 0.18);
    ctx.rotate(tilt);
    ctx.beginPath();
    ctx.moveTo(-hw * 0.12, hh * 0.16);
    ctx.lineTo(0, -hh * 0.44);
    ctx.lineTo(hw * 0.14, hh * 0.14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  rrect(ctx, hx, hy, hw * 0.82, hh, hw * 0.36); ctx.fill();                    // skull
  rrect(ctx, hx + hw * 0.58, hy + hh * 0.34, hw * 0.40, hh * 0.44, hh * 0.18); ctx.fill(); // snout
  ctx.fillStyle = LT;
  rrect(ctx, hx + hw * 0.72, hy + hh * 0.40, hw * 0.26, hh * 0.32, hh * 0.14); ctx.fill(); // muzzle tip
  ctx.fillStyle = '#101a2e';
  ctx.beginPath();
  ctx.ellipse(hx + hw * 0.94, hy + hh * 0.52, hw * 0.07, hh * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(hx + hw * 0.50, hy + hh * 0.40, Math.max(0.9, w * 0.030), 0, Math.PI * 2);
  ctx.fill();
}

function drawSheep(ctx, W, H, pct, col, state) {
  if (W < 120 || H < 110) return;
  const now = NOW();
  const elapsed = 1 - pct;
  const ot = outroT();

  // ── Three rolling hills, back to front. Each is a soft curve the animals
  //    stand on; drawing a nearer hill after its flock hides their feet, which
  //    is what gives the scene depth without any perspective maths.
  // Horizon sits high: the interest is all on the ground, and a 60% sky left
  // most of the widget empty. More pasture also spreads the hills further apart.
  const BANDS = [
    { base: 0.42, amp: 0.034, ph: 0.5, k: 1.5, s: 0.55, tone: '#232d4d' },
    { base: 0.65, amp: 0.046, ph: 2.3, k: 2.1, s: 0.76, tone: '#2a375a' },
    { base: 0.95, amp: 0.056, ph: 4.4, k: 1.7, s: 1.00, tone: '#324268' },
  ];
  const crest = (x, b) =>
    H * b.base - H * b.amp * (Math.sin(x / W * Math.PI * b.k + b.ph) * 0.65
                            + Math.sin(x / W * Math.PI * b.k * 2.3 + b.ph * 1.7) * 0.35);
  // Continuous band position so a sheep can walk from one hill to another
  const groundAt = (x, bi) => {
    const lo = Math.max(0, Math.min(BANDS.length - 1, Math.floor(bi)));
    const hi = Math.max(0, Math.min(BANDS.length - 1, lo + 1));
    const t = Math.max(0, Math.min(1, bi - lo));
    return {
      y: crest(x, BANDS[lo]) * (1 - t) + crest(x, BANDS[hi]) * t,
      s: BANDS[lo].s * (1 - t) + BANDS[hi].s * t,
    };
  };

  const BARN = { x: 0.74, b: 1.0 };

  if (!state.ready || state.sw !== W || state.sh !== H) {
    state.ready = true; state.sw = W; state.sh = H;
    state.stars = Array.from({ length: Math.max(10, Math.round(W * H / 9000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.40,
      r: Math.random() * 0.9 + 0.35, a: Math.random() * 0.35 + 0.15,
      tw: Math.random() * Math.PI * 2,
    }));
    state.trees = [
      { x: 0.10, b: 0 }, { x: 0.30, b: 0 }, { x: 0.90, b: 0 }, { x: 0.05, b: 1 },
    ];
    // Spread over the hills, then ordered by how near the barn each one is
    const spots = [
      [0.10, 2], [0.30, 2], [0.52, 2], [0.74, 2],
      [0.16, 1], [0.40, 1], [0.58, 1],
      [0.22, 0], [0.46, 0], [0.66, 0],
    ];
    state.flock = spots.map(([x, b]) => ({
      x: x + (Math.random() - 0.5) * 0.05,
      b,
      ph: Math.random() * Math.PI * 2,
      sp: 0.7 + Math.random() * 0.6,
      wx: 0.030 + Math.random() * 0.035,     // how far it mooches across
      wb: 0.28 + Math.random() * 0.17,       // and how far toward / away from us
    })).sort((p, q) =>
      ((p.x - BARN.x) ** 2 + ((p.b - BARN.b) * 0.30) ** 2) -
      ((q.x - BARN.x) ** 2 + ((q.b - BARN.b) * 0.30) ** 2));
  }

  // ── Sky ───────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#161c33';
  ctx.fillRect(0, 0, W, H);
  state.stars.forEach(st => {
    ctx.globalAlpha = st.a * (0.6 + 0.4 * Math.sin(now / 1600 + st.tw));
    ctx.fillStyle = '#ffeccd';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Who has gone in ───────────────────────────────────────────────────────
  const prog   = Math.min(SHEEP_COUNT, elapsed * SHEEP_COUNT);
  const done   = Math.min(SHEEP_COUNT, Math.floor(prog));
  const frac   = Math.min(1, prog - done);
  const active = done < SHEEP_COUNT ? done : -1;
  const WAIT   = 0.20;
  const walking = active >= 0 && frac >= WAIT;
  const walkT  = walking ? (frac - WAIT) / (1 - WAIT) : 0;
  const shut   = ot > 0 ? Math.min(1, ot / 0.55) : 0;

  const bp = groundAt(BARN.x * W, BARN.b);
  const barnW = Math.min(W * 0.30, 210) * bp.s;
  const barnH = barnW * 1.00;
  const doorW = barnW * 0.40, doorH = barnH * 0.46;
  const barnX = BARN.x * W, barnBase = bp.y;
  const doorX = barnX - doorW / 2, doorY = barnBase - doorH;

  const drawBarn = () => {
    const bx = barnX - barnW / 2, by = barnBase - barnH;
    ctx.fillStyle = '#212a45';
    ctx.beginPath();
    ctx.moveTo(bx + barnW, by + barnH * 0.32);
    ctx.lineTo(bx + barnW * 1.22, by + barnH * 0.42);
    ctx.lineTo(bx + barnW * 1.22, barnBase - barnH * 0.03);
    ctx.lineTo(bx + barnW, barnBase);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#33406a';
    rrect(ctx, bx, by + barnH * 0.32, barnW, barnH * 0.68, 4); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx - barnW * 0.08, by + barnH * 0.35);
    ctx.lineTo(bx + barnW * 0.5, by);
    ctx.lineTo(bx + barnW * 1.08, by + barnH * 0.35);
    ctx.closePath();
    ctx.fillStyle = '#445280'; ctx.fill();
    // plain dark doorway — no lamplight
    ctx.fillStyle = '#12182a';
    rrect(ctx, doorX, doorY, doorW, doorH, 3); ctx.fill();
    ctx.fillStyle = '#12182a';
    rrect(ctx, bx + barnW * 0.42, by + barnH * 0.44, barnW * 0.16, barnH * 0.12, 2); ctx.fill();
    if (shut > 0) {
      ctx.fillStyle = '#445280';
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 1.2;
      [-1, 1].forEach(side => {
        const w = (doorW / 2) * shut;
        const x = side < 0 ? doorX : doorX + doorW - w;
        rrect(ctx, x, doorY, Math.max(0.5, w), doorH, 2);
        ctx.fill(); ctx.stroke();
      });
    }
  };

  // ── Everything that stands on the ground, grouped by which hill ───────────
  const buckets = [[], [], []];
  const baseSize = Math.min(W, H) * 0.17;

  // The sheep at the door is drawn separately, after the barn, clipped to the
  // opening — so it walks *into* the doorway instead of fading out on the wall.
  let entering = null;
  const atBarn = [];        // drawn after the barn, so the approach isn't hidden by it
  const ENTER = 0.72;                        // walkT at which it reaches the door

  for (let i = 0; i < SHEEP_COUNT; i++) {
    if (i < done) continue;
    const f = state.flock[i];
    // Two out-of-phase sines per axis so the path never looks like a metronome.
    // Sampling it twice gives velocity, and everything else follows from that:
    // which way it faces, how hard its legs swing, and whether it's grazing.
    const wander = t => ({
      x: f.x + Math.sin(t * 0.45 * f.sp + f.ph) * f.wx
             + Math.sin(t * 0.24 * f.sp + f.ph * 1.7) * f.wx * 0.55,
      b: f.b + Math.sin(t * 0.31 * f.sp + f.ph * 2.3) * f.wb,
    });
    const T = now / 1000;
    const p0 = wander(T), p1 = wander(T + 0.06);
    const vx = (p1.x - p0.x) / 0.06;                 // field-widths per second
    // Normalised against this sheep's own top speed — absolute thresholds left
    // every sheep permanently half-grazing instead of alternating.
    const vmax = f.wx * f.sp * (0.45 + 0.55 * 0.24) || 1e-6;
    const u = Math.min(1, Math.abs(vx) / vmax);
    let flip = vx < 0;                               // facing
    let stride = Math.min(1, u * 1.35);              // legs swing with real speed
    // Grazing runs on its own slow rhythm — sheep browse in bouts — but the head
    // comes up whenever it's actually moving off.
    const bout = 0.5 + 0.5 * Math.sin(T * 0.13 * f.sp + f.ph * 3.1);
    let graze = Math.max(0, Math.min(1, bout * 1.65 - u * 0.7));
    stride *= 1 - graze * 0.6;      // head down means a slow shuffle, not a stride
    let x = p0.x * W;
    let b = p0.b, step = now / 260 * f.sp + f.ph;

    if (i === active && walking && walkT >= ENTER) {
      // Through the door: step up into the dark and shrink away
      const t = (walkT - ENTER) / (1 - ENTER);
      const g = groundAt(barnX, BARN.b);
      const sw = baseSize * g.s;
      entering = () => {
        ctx.save();
        rrect(ctx, doorX, doorY, doorW, doorH, 3);
        ctx.clip();
        const sc = 1 - t * 0.42;
        ctx.globalAlpha = 1 - t * 0.30;
        drawSheepBody(ctx, barnX, barnBase - t * doorH * 0.62,
                      sw * sc, sw * 0.80 * sc, col, now / 110, 1, 0, false);
        ctx.restore();
      };
      continue;
    }

    if (i === active && walking) {
      // Crossing the field to the door
      const w = walkT / ENTER;
      const e = w * w * (3 - 2 * w);
      const nx = (f.x + (BARN.x - f.x) * e) * W;
      flip = nx < x;                         // face the way it set off
      x = nx;
      b = f.b + (BARN.b - f.b) * e;
      step = now / 150;                      // a purposeful trot, not a sprint
      stride = 1; graze = 0;                 // head up, properly walking
    }

    const g = groundAt(x, b);
    const sw = baseSize * g.s;
    const bob = Math.sin(now / 950 + f.ph) * sw * 0.02;
    const draw = () => drawSheepBody(ctx, x, g.y + bob, sw, sw * 0.80, col, step, stride, graze, flip);
    // Once it overlaps the barn it has to paint after it, or it disappears
    // behind the wall for the last stretch before the door.
    if (i === active && walking && Math.abs(x - barnX) < barnW * 0.8) atBarn.push(draw);
    else buckets[Math.max(0, Math.min(2, Math.round(b)))].push({ x, draw });
  }

  // Dog trots to whichever sheep is next
  if (ot === 0 && active >= 0) {
    const f = state.flock[active];
    const tx = (walking ? f.x + (BARN.x - f.x) * walkT : f.x) - 0.085;
    const tb = walking ? f.b + (BARN.b - f.b) * walkT : f.b;
    if (state.dogX === undefined) { state.dogX = tx; state.dogB = tb; }
    const px = state.dogX;
    state.dogX += (tx - state.dogX) * 0.055;
    state.dogB += (tb - state.dogB) * 0.055;
    const moving = Math.abs(state.dogX - px) > 0.0012;
    const dg = groundAt(state.dogX * W, state.dogB);
    const dw = baseSize * 0.78 * dg.s;
    buckets[Math.max(0, Math.min(2, Math.round(state.dogB)))].push({ x: state.dogX * W,
      draw: () => drawDog(ctx, state.dogX * W, dg.y, dw, dw * 0.72, moving ? now / 70 : 0) });
  }



  // ── Paint back to front: hill, then what stands on it ─────────────────────
  BANDS.forEach((band, bi) => {
    ctx.fillStyle = band.tone;
    ctx.beginPath();
    ctx.moveTo(0, crest(0, band));
    for (let x = 0; x <= W; x += 6) ctx.lineTo(x, crest(x, band));
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();

    if (bi === 0) {
      state.trees.forEach(t => {
        if (t.b !== 0) return;
        const g = groundAt(t.x * W, 0);
        const th = baseSize * 1.5 * g.s;
        ctx.fillStyle = '#1b2440';
        ctx.fillRect(t.x * W - th * 0.05, g.y - th * 0.44, th * 0.10, th * 0.45);
        [[0, -0.64, 0.30], [-0.20, -0.52, 0.23], [0.20, -0.53, 0.24]].forEach(([dx, dy, r]) => {
          ctx.beginPath(); ctx.arc(t.x * W + th * dx, g.y + th * dy, th * r, 0, Math.PI * 2); ctx.fill();
        });
      });
    }
    buckets[bi].sort((a, b) => a.x - b.x).forEach(it => it.draw());
    // The barn paints after everything standing on its hill, and the sheep in
    // the doorway after the barn — sorting these by x put an arriving sheep in
    // front of the wall instead of inside the opening.
    if (bi === Math.round(BARN.b)) {
      drawBarn();
      atBarn.forEach(d => d());
      if (entering) entering();
    }
  });
}

// ── Render: Candle ────────────────────────────────────────────────────────────
// The wax column is the time: it burns down, so the amount of colour on screen
// is the amount of time left, same read as Blocks. The flame is warm rather than
// timer-coloured because fire reads as fire — it's a prop, not the signal, the
// same split used for the saucer in Cow Abduction. Flat fills throughout.
function drawCandle(ctx, W, H, pct, col, state) {
  if (W < 60 || H < 90) return;
  const now = NOW();
  const ot  = outroT();                 // >0 while the finale plays
  const cx  = W / 2;
  const PAD = Math.max(10, H * 0.045);

  // Holder
  const holderW = Math.min(W * 0.56, 170);
  const holderH = Math.max(9, H * 0.042);
  const holderY = H - PAD - holderH;

  // Wax column
  const candleW  = Math.min(W * 0.32, holderW * 0.58);
  const flameRoom = Math.max(42, H * 0.17);
  const maxH  = Math.max(20, holderY - (PAD + flameRoom));
  const stub  = Math.max(6, H * 0.022);
  const candleH  = stub + Math.max(0, maxH - stub) * pct;
  const candleTop = holderY - candleH;
  const left = cx - candleW / 2;

  // Stable drips + melt rim, laid out once per size
  if (!state.candleW || state.candleW !== W || state.candleH !== H) {
    state.candleW = W; state.candleH = H;
    // Spread down the column and varied in length — clustered equal-length
    // drips read as a symmetrical collar rather than running wax.
    state.drips = [
      { side: -1, off: 0.05, len: 0.55, w: 0.15 },
      { side:  1, off: 0.10, len: 0.30, w: 0.13 },
      { side:  1, off: 0.34, len: 0.62, w: 0.16 },
    ].map(d => ({ ...d,
      off: d.off + Math.random() * 0.05,
      len: d.len * (0.8 + Math.random() * 0.4) }));
  }

  // ── Melted wax pooling on the holder ───────────────────────────────────────
  const elapsed = 1 - pct;
  // Clamped to the holder — an unbounded pool spills off the dish at the end
  const poolW = Math.min(candleW * (0.62 + elapsed * 0.95), holderW * 0.88);
  const poolH = Math.max(3, candleW * 0.10 * (0.5 + elapsed));
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(cx, holderY + 1, poolW / 2, poolH, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Wax column ─────────────────────────────────────────────────────────────
  rrect(ctx, left, candleTop, candleW, candleH + 2, Math.min(candleW * 0.16, 10));
  ctx.fillStyle = col;
  ctx.fill();

  // Softly rounded, slightly uneven melt rim
  ctx.beginPath();
  ctx.moveTo(left, candleTop + candleW * 0.10);
  ctx.quadraticCurveTo(cx - candleW * 0.22, candleTop - candleW * 0.09, cx, candleTop - candleW * 0.04);
  ctx.quadraticCurveTo(cx + candleW * 0.26, candleTop - candleW * 0.11, left + candleW, candleTop + candleW * 0.12);
  ctx.closePath();
  ctx.fill();

  // Drips running from the rim
  state.drips.forEach(d => {
    const x = cx + d.side * candleW * 0.50;   // on the edge, so they run down the outside
    const y0 = candleTop + candleW * d.off;
    const w  = candleW * d.w;
    // Clamp to the holder, allowing for the rounded end-cap — otherwise on a
    // burnt-down candle the cap alone still pokes out below the dish.
    const len = Math.min(
      candleW * d.len * (0.7 + 0.3 * Math.sin(now / 1400 + d.off * 9)),
      holderY - y0 - w / 2 - candleW * 0.06);
    if (len <= 0) return;
    rrect(ctx, x - w / 2, y0, w, len, w / 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y0 + len, w / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Shading down one side gives the column some roundness (flat tone, no gradient)
  ctx.save();
  rrect(ctx, left, candleTop, candleW, candleH + 2, Math.min(candleW * 0.16, 10));
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  ctx.fillRect(left + candleW * 0.72, candleTop - candleW, candleW * 0.28, candleH + candleW * 2);
  ctx.restore();

  // ── Wick ───────────────────────────────────────────────────────────────────
  const wickH = Math.max(4, candleW * 0.20);
  ctx.strokeStyle = '#2a1f18';
  ctx.lineWidth = Math.max(1.6, candleW * 0.055);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, candleTop - candleW * 0.03);
  ctx.lineTo(cx + Math.sin(now / 500) * wickH * 0.18, candleTop - wickH);
  ctx.stroke();

  const tipY = candleTop - wickH;

  // ── Flame, or the smoke that replaces it once time is up ──────────────────
  if (ot > 0 || pct <= 0) {
    // Outro: the flame is out; a wisp of smoke curls up and fades
    const t = ot > 0 ? ot : 1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.strokeStyle = '#8b95a8';
    ctx.lineWidth = Math.max(1.4, candleW * 0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    const rise = (Math.max(28, H * 0.16)) * (0.25 + t);
    ctx.moveTo(cx, tipY);
    for (let i = 1; i <= 12; i++) {
      const f = i / 12;
      ctx.lineTo(cx + Math.sin(f * 4.2 + now / 420) * candleW * 0.30 * f, tipY - rise * f);
    }
    ctx.stroke();
    ctx.restore();
  } else {
    // Two flat shapes: outer flame and a hotter core. Flicker is two sines at
    // different rates so it never settles into a visible loop.
    const flick = 1 + Math.sin(now / 88) * 0.07 + Math.sin(now / 31) * 0.035;
    const fh = Math.max(14, H * 0.095) * flick;
    const fw = fh * 0.50;
    const fx = cx + Math.sin(now / 240) * fw * 0.13;

    const teardrop = (w, h) => {
      ctx.beginPath();
      ctx.moveTo(fx, tipY - h);
      ctx.bezierCurveTo(fx + w, tipY - h * 0.46, fx + w * 0.74, tipY + h * 0.06, fx, tipY + h * 0.06);
      ctx.bezierCurveTo(fx - w * 0.74, tipY + h * 0.06, fx - w, tipY - h * 0.46, fx, tipY - h);
      ctx.closePath();
    };
    teardrop(fw, fh);               ctx.fillStyle = '#f0a027'; ctx.fill();
    teardrop(fw * 0.52, fh * 0.60); ctx.fillStyle = '#ffd772'; ctx.fill();
    teardrop(fw * 0.24, fh * 0.30); ctx.fillStyle = '#fff6d8'; ctx.fill();
  }

  // ── Holder ─────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#243354';
  rrect(ctx, cx - holderW / 2, holderY, holderW, holderH, holderH * 0.42);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 1.5;
  rrect(ctx, cx - holderW / 2, holderY, holderW, holderH, holderH * 0.42);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rrect(ctx, cx - holderW / 2 + 4, holderY + 2, holderW - 8, holderH * 0.40, 3);
  ctx.fill();
}

// ── Render: Hourglass — curved glass, dome sand pile, stream ─────────────────
function drawHourglass(ctx, W, H, pct, col, state) {
  const cx   = W / 2;
  const capH = 16;
  const PAD  = 32;
  const y0   = PAD;
  const bot  = H - PAD;
  const mid  = (y0 + bot) / 2;
  const topH = mid - y0;
  const botH = bot - mid;

  // Glass dimensions — wide bulges, very narrow neck for drama
  const halfW = Math.min(W * 0.46, 110);
  const neck  = 3.5;

  // ── Glass path — classic hourglass curves ─────────────────────────────────
  // Each half: stays wide, then sweeps sharply to the neck at the midpoint.
  // Two bezier segments per side. cp1 keeps the wall wide, cp2 arrives at neck.
  function glassPath() {
    ctx.beginPath();
    ctx.moveTo(cx - halfW, y0);
    ctx.lineTo(cx + halfW, y0);

    // Right: top → neck
    ctx.bezierCurveTo(
      cx + halfW,      y0 + topH * 0.50,   // stay wide through the upper half
      cx + neck + 10,  mid - topH * 0.05,  // curve hard to neck near the waist
      cx + neck,       mid
    );
    // Right: neck → bottom
    ctx.bezierCurveTo(
      cx + neck + 10,  mid + botH * 0.05,
      cx + halfW,      bot - botH * 0.50,
      cx + halfW,      bot
    );

    ctx.lineTo(cx - halfW, bot);

    // Left: bottom → neck
    ctx.bezierCurveTo(
      cx - halfW,      bot - botH * 0.50,
      cx - neck - 10,  mid + botH * 0.05,
      cx - neck,       mid
    );
    // Left: neck → top
    ctx.bezierCurveTo(
      cx - neck - 10,  mid - topH * 0.05,
      cx - halfW,      y0 + topH * 0.50,
      cx - halfW,      y0
    );

    ctx.closePath();
  }

  const elapsed = 1 - pct;

  // ── Glass interior (dark, semi-transparent) ───────────────────────────────
  glassPath();
  ctx.fillStyle = 'rgba(10, 16, 30, 0.88)';
  ctx.fill();

  // ── Clip sand to glass shape ──────────────────────────────────────────────
  ctx.save();
  glassPath();
  ctx.clip();

  // Top sand — level drops as time runs out
  // pct=1 → surface at y0 (full); pct=0 → surface at mid (empty)
  const y_top = y0 + elapsed * topH;
  if (pct > 0.003) {
    ctx.fillStyle = col;
    ctx.fillRect(cx - halfW - 2, y_top, halfW * 2 + 4, mid - y_top + 2);
    // Crisp surface highlight
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillRect(cx - halfW + 6, y_top, halfW * 2 - 12, 2.5);
  }

  // Bottom sand pile — grows upward as elapsed increases
  const pile_h    = elapsed * botH * 0.90;
  const y_pile    = bot - pile_h;
  const dome_rise = Math.min(pile_h * 0.22, 16);

  if (elapsed > 0.003) {
    ctx.fillStyle = col;
    ctx.fillRect(cx - halfW - 2, y_pile, halfW * 2 + 4, bot - y_pile + 2);
    // Domed top surface — sand settles in a natural mound
    ctx.beginPath();
    ctx.moveTo(cx - halfW - 2, y_pile);
    ctx.quadraticCurveTo(cx, y_pile - dome_rise, cx + halfW + 2, y_pile);
    ctx.fill();
    // Subtle ridge along the dome crest
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 0.45, y_pile - dome_rise * 0.38);
    ctx.quadraticCurveTo(cx, y_pile - dome_rise - 1, cx + halfW * 0.45, y_pile - dome_rise * 0.38);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // ── Sand stream through the neck ─────────────────────────────────────────
  // Seconds, not a fraction of the duration — see the note in drawLiquid. At
  // 10 minutes this held the sand stream back for 6 seconds and cut it 7 short.
  if (running && pct * totalSeconds > 0.8) {
    const streamEnd = elapsed > 0.003 ? y_pile - dome_rise : bot - 4;
    // Solid continuous stream — no dash
    ctx.beginPath();
    ctx.moveTo(cx, mid + 1);
    ctx.lineTo(cx, streamEnd);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.setLineDash([]);
    ctx.stroke();
  }

  // ── Falling sand grains ───────────────────────────────────────────────────
  const now = NOW();
  if (running && pct * totalSeconds > 0.8) {
    if (now - state.lastSpawn > 55) {
      state.lastSpawn = now;
      for (let i = 0; i < 3; i++) {
        state.grains.push({
          x:  cx + (Math.random() - 0.5) * neck * 1.8,
          y:  mid + 3,
          vy: 1.8 + Math.random() * 2.2,
          r:  1.2 + Math.random() * 1.0,
        });
      }
    }
  }
  const grainStop = elapsed > 0.003 ? y_pile - dome_rise - 1 : bot - 2;
  state.grains = state.grains.filter(g => {
    g.vy += 0.32;
    g.y  += g.vy;
    if (g.y >= grainStop) return false;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    return true;
  });

  ctx.restore();

  // ── Glass walls — bright crisp outline ────────────────────────────────────
  glassPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // ── Left-edge highlight — makes the glass read as glassy ─────────────────
  ctx.save();
  glassPath();
  ctx.clip();
  // Left inner edge of top bulge
  ctx.beginPath();
  ctx.moveTo(cx - halfW + 9, y0 + 10);
  ctx.bezierCurveTo(
    cx - halfW + 9, y0 + topH * 0.48,
    cx - neck - 7,  mid - topH * 0.05,
    cx - neck + 1,  mid
  );
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();
  // Right-edge secondary highlight (fainter)
  ctx.beginPath();
  ctx.moveTo(cx + halfW - 6, y0 + 10);
  ctx.bezierCurveTo(
    cx + halfW - 6, y0 + topH * 0.40,
    cx + neck + 6,  mid - topH * 0.08,
    cx + neck - 1,  mid
  );
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.restore();

  // ── End caps ─────────────────────────────────────────────────────────────
  const capW = halfW * 2 + 16;
  const capX = cx - capW / 2;
  ctx.fillStyle = '#1e2e42';
  ctx.strokeStyle = 'rgba(255,255,255,0.24)';
  ctx.lineWidth = 1.5;
  rrect(ctx, capX, y0 - capH, capW, capH, 7); ctx.fill(); ctx.stroke();
  rrect(ctx, capX, bot,       capW, capH, 7); ctx.fill(); ctx.stroke();
  // Cap top highlights
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rrect(ctx, capX + 4, y0 - capH + 2, capW - 8, capH * 0.45, 4); ctx.fill();
  rrect(ctx, capX + 4, bot + 2,        capW - 8, capH * 0.45, 4); ctx.fill();
}

// ── Timer logic ───────────────────────────────────────────────────────────────
const doneBanner = document.getElementById('done-banner');
const startBtn    = document.getElementById('start-btn');
const soundCheck  = document.getElementById('sound-check');
const soundSelect = document.getElementById('sound-select');
const digitTimer  = document.getElementById('digit-timer');
const dgtEls      = [0,1,2,3,4,5].map(i => document.getElementById(`d${i}`));

const MAX_SECONDS = 99 * 3600 + 59 * 60 + 59; // 99:59:59

// ── Outro phase ───────────────────────────────────────────────────────────────
// Narrative widgets need a beat after zero to finish their story (the saucer
// flying off, etc). The chime still fires exactly at zero; only the done-banner
// waits. Timers with no narrative widget on the board are unaffected.
const OUTRO_MS    = 2500;
const OUTRO_TYPES = new Set(['ufo', 'candle', 'sheep']);
let   outroStart  = 0;               // timestamp the outro began, 0 when idle

// 0 → 1 across the outro; 0 when no outro is playing.
function outroT() {
  if (!outroStart) return 0;
  return Math.min(1, (NOW() - outroStart) / OUTRO_MS);
}

function finishTimer() {
  outroStart = 0;
  doneBanner.style.display = 'block';
  setInputsDisabled(false);
  startBtn.textContent = '▶ Start';
}

let _lastDigitSec = -1;
function updateDigits(secs) {
  // When called without an argument, show the set duration (edit mode)
  const val = (secs !== undefined) ? secs : totalSeconds;
  const h = Math.floor(val / 3600);
  const m = Math.floor(val / 60) % 60;
  const s = val % 60;
  dgtEls[0].textContent = Math.floor(h / 10);
  dgtEls[1].textContent = h % 10;
  dgtEls[2].textContent = Math.floor(m / 10);
  dgtEls[3].textContent = m % 10;
  dgtEls[4].textContent = Math.floor(s / 10);
  dgtEls[5].textContent = s % 10;

  // Dim leading zeros so the active units read first: 00:05:00
  const lead = [h < 10, h === 0, h === 0 && m < 10, false, false, false];
  dgtEls.forEach((el, i) => el.classList.toggle('leading', lead[i]));
}

function stopTimer() {
  pausedElapsed = getElapsed(); // save where we paused
  running = false; startStamp = null;
  _lastDigitSec = -1;
}

function setDuration(secs) {
  running = false; startStamp = null; pausedElapsed = 0; outroStart = 0;
  totalSeconds = Math.max(1, Math.min(secs, MAX_SECONDS));
  remaining = totalSeconds;
  doneBanner.style.display = 'none';
  startBtn.textContent = '▶ Start';
  updateDigits();
}

// Wire up each +/− button
document.querySelectorAll('.dbt').forEach(btn => {
  btn.addEventListener('click', () => setDuration(totalSeconds + parseInt(btn.dataset.delta)));
});
// ── Sound library ─────────────────────────────────────────────────────────────
const SOUNDS = {
  // Soft two-note bleat — a wobbling sawtooth through a lowpass reads as "baa"
  baa(ac) {
    const t = ac.currentTime;
    [[0, 0.34, 415, 350], [0.30, 0.42, 392, 330]].forEach(([s, d, f0, f1]) => {
      const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
      const vib = ac.createOscillator(), vg = ac.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 1100;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0, t + s);
      o.frequency.linearRampToValueAtTime(f1, t + s + d);
      vib.type = 'sine'; vib.frequency.value = 22;      // the characteristic waver
      vg.gain.value = 13;
      vib.connect(vg); vg.connect(o.frequency);
      o.connect(lp); lp.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0, t + s);
      g.gain.linearRampToValueAtTime(0.5, t + s + 0.05);
      g.gain.setValueAtTime(0.42, t + s + d * 0.6);
      g.gain.exponentialRampToValueAtTime(0.001, t + s + d);
      vib.start(t + s); o.start(t + s);
      o.stop(t + s + d + 0.05); vib.stop(t + s + d + 0.05);
    });
  },

  // Friendly ascending chime — good for primary classrooms
  chime(ac) {
    const t = ac.currentTime;
    [[523,0,.5],[659,.28,.55],[784,.56,.7],[1046,.85,.9]].forEach(([f,s,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+s);
      g.gain.linearRampToValueAtTime(.9,t+s+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.start(t+s); o.stop(t+s+d+.1);
    });
  },

  // Rich school bell with harmonics + long sustain
  bell(ac) {
    const t=ac.currentTime;
    [[440,1],[880,.5],[1320,.25],[1760,.12],[2200,.06]].forEach(([f,amp])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(amp,t+.01);
      g.gain.exponentialRampToValueAtTime(.001,t+3.0);
      o.start(t); o.stop(t+3.1);
    });
  },

  // Single crisp high ding
  ding(ac) {
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sine'; o.frequency.value=1318; // E6
    g.gain.setValueAtTime(1.0,t);
    g.gain.exponentialRampToValueAtTime(.001,t+2.2);
    o.start(t); o.stop(t+2.3);
  },

  // Urgent repeating alarm beeps
  alarm(ac) {
    const t=ac.currentTime;
    for(let i=0;i<6;i++){
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(.8,t+i*.22);
      g.gain.setValueAtTime(0,t+i*.22+.16);
      o.start(t+i*.22); o.stop(t+i*.22+.18);
    }
  },

  // Triumphant fanfare — great for celebrations
  fanfare(ac) {
    const t=ac.currentTime;
    [[523,.0,.14],[523,.15,.14],[523,.3,.14],[659,.44,.32],[523,.76,.14],
     [659,.91,.32],[784,1.24,1.0]].forEach(([f,s,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.85,t+s);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.start(t+s); o.stop(t+s+d+.05);
    });
  },

  // Game-show style buzzer
  buzzer(ac) {
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sawtooth'; o.frequency.value=180;
    g.gain.setValueAtTime(.9,t);
    g.gain.setValueAtTime(.9,t+.85);
    g.gain.exponentialRampToValueAtTime(.001,t+1.1);
    o.start(t); o.stop(t+1.2);
  },
};

function playSound(name) {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    SOUNDS[name]?.(ac);
  } catch(e) {}
}

function playDone() {
  if (!soundCheck.checked) return;
  playSound(soundSelect.value);
}

document.getElementById('preview-sound').addEventListener('click', () => {

});

function setInputsDisabled(disabled) {
  document.querySelectorAll('.dbt').forEach(b => b.disabled = disabled);
  digitTimer.classList.toggle('disabled', disabled);
}

startBtn.addEventListener('click', () => {

  if (running) {

    startBtn.textContent = '▶ Resume';

  } else {
    doneBanner.style.display = 'none'; outroStart = 0;

});

document.getElementById('reset-btn').addEventListener('click', () => {

  remaining = totalSeconds;
  widgets.forEach(w => { w.state.drops = []; w.state.grains = []; });
  doneBanner.style.display = 'none'; startBtn.textContent = '▶ Start';
  setInputsDisabled(false);
  // The RAF loop only drives the digits while running, so put them back by hand
  _lastDigitSec = -1;

});

// ── Fullscreen / presentation mode ───────────────────────────────────────────
// Hides the header and control bar so the timers own the whole display. The
// floating bar keeps start/reset/exit reachable without leaving fullscreen.
const presentBar   = document.getElementById('present-bar');
const presentTime  = document.getElementById('present-time');
const presentStart = document.getElementById('present-start');
let presentHideTimer = null, idleTimer = null;

const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

function revealPresentBar() {
  if (!document.body.classList.contains('presenting')) return;
  presentBar.classList.add('show');
  document.body.classList.remove('idle');
  clearTimeout(presentHideTimer);
  clearTimeout(idleTimer);
  presentHideTimer = setTimeout(() => presentBar.classList.remove('show'), 2800);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3200);
}

async function enterPresent() {
  document.body.classList.add('presenting');
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (e) {
    // Fullscreen can be refused (iOS Safari has no element fullscreen).
    // The chrome is still hidden, which is most of the benefit.
  }
  revealPresentBar();
}

function exitPresent() {
  document.body.classList.remove('presenting', 'idle');
  presentBar.classList.remove('show');
  clearTimeout(presentHideTimer);
  clearTimeout(idleTimer);
  if (inFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}

document.getElementById('present-btn').addEventListener('click', e => {
  e.currentTarget.blur();   // the bar is about to be hidden; don't strand focus
  enterPresent();
});
document.getElementById('present-exit').addEventListener('click', exitPresent);
presentStart.addEventListener('click', () => { startBtn.click(); revealPresentBar(); });
document.getElementById('present-reset').addEventListener('click', () => {
  document.getElementById('reset-btn').click(); revealPresentBar();
});

// Leaving fullscreen by any route (Esc, browser UI) must drop presentation mode
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    if (!inFullscreen() && document.body.classList.contains('presenting')) exitPresent();
  }));

['mousemove', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, revealPresentBar, { passive: true }));

// Keyboard: F toggles fullscreen, Esc leaves it, Space starts/pauses.
// Ignored while typing so the background search box still works.
document.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (typing) return;                       // never steal keys from a text field
  const presenting = document.body.classList.contains('presenting');

  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    presenting ? exitPresent() : enterPresent();
  } else if (e.key === 'Escape' && presenting) {
    exitPresent();
  } else if (e.code === 'Space' && tag !== 'BUTTON') {
    // Space is how a keyboard user activates a focused button, so only take it
    // when focus isn't on one.
    e.preventDefault();                     // otherwise the page scrolls
    startBtn.click();
    revealPresentBar();
  }
});

// ── Procedural backgrounds ────────────────────────────────────────────────────
// Drawn in-page rather than streamed. No network, no load wait, no file size —
// and they loop forever by construction, so there is no seam to hide, no title
// card and no camera move. Each generator exposes:
//   res(W,H) → internal canvas size (lava renders small and scales up)
//   css      → CSS filter applied to the canvas element (GPU side)
//   init     → per-instance state
//   draw(ctx, W, H, t, opts, state)   t = seconds
const PROC_GENS = {
  // Lava lamp. Flat circles merged by a CSS blur — no gradients, and the
  // softness is the point, so a quarter-res canvas is plenty.
  lava: {
    res: (W, H) => [Math.max(120, Math.round(W * 0.30)), Math.max(120, Math.round(H * 0.30))],
    css: 'blur(34px)',
    init: (o) => Array.from({ length: o.count || 12 }, () => ({
      x:     Math.random(),
      r:     0.056 + Math.random() * 0.058,
      phase: Math.random() * Math.PI * 2,
      speed: 0.055 + Math.random() * 0.075,
      sway:  0.03 + Math.random() * 0.05,
    })),
    draw(ctx, W, H, t, o, blobs) {
      ctx.fillStyle = o.bg;
      ctx.fillRect(0, 0, W, H);
      const R = Math.min(W, H);
      for (const b of blobs) {
        // Rise and sink on a slow sine, with a lazy horizontal sway
        const y = 0.5 + 0.44 * Math.sin(t * b.speed + b.phase);
        const x = b.x + b.sway * Math.sin(t * b.speed * 0.55 + b.phase * 1.7);
        ctx.fillStyle = o.blob;
        ctx.beginPath();
        ctx.arc(x * W, y * H, b.r * R, 0, Math.PI * 2);
        ctx.fill();
      }
    },
  },

  // Starfield. Cheap enough to run at full size; stars twinkle on their own
  // phase and the whole field drifts slowly so it never looks frozen.
  stars: {
    res: (W, H) => [W, H],
    css: 'none',
    init: (o, W, H) => ({
      stars: Array.from({ length: Math.round((W * H) / 1500 * (o.density || 1)) }, () => ({
        x: Math.random(), y: Math.random(),
        r: Math.random() * Math.random() * 2.1 + 0.45,
        tw: Math.random() * Math.PI * 2,
        sp: 0.25 + Math.random() * 1.5,
        accent: Math.random() < 0.16,
      })),
      haze: Array.from({ length: 7 }, () => ({
        x: Math.random(), y: Math.random(),
        r: 0.34 + Math.random() * 0.40,
        a: 0.012 + Math.random() * 0.022,
      })),
    }),
    draw(ctx, W, H, t, o, st) {
      ctx.fillStyle = o.bg;
      ctx.fillRect(0, 0, W, H);
      if (o.haze) {
        // Very faint galactic wash — flat fills, low alpha
        for (const h of st.haze) {
          ctx.globalAlpha = h.a;
          ctx.fillStyle = o.haze;
          ctx.beginPath();
          ctx.arc(h.x * W, h.y * H, h.r * Math.max(W, H), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      const dy = t * (o.drift || 0.004);
      for (const s of st.stars) {
        const y = (((s.y + dy) % 1) + 1) % 1;
        ctx.globalAlpha = 0.30 + 0.70 * (0.5 + 0.5 * Math.sin(t * s.sp + s.tw));
        ctx.fillStyle = s.accent ? o.accent : o.star;
        ctx.beginPath();
        ctx.arc(s.x * W, y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    },
  },
};

const BACKGROUND_MAP = new Map(BACKGROUNDS.map(bg => [bg.id, bg]));

function backgroundMatchesCategory(bg, cat) {
  if (cat === 'all') return true;
  const cats = Array.isArray(bg.cats) ? bg.cats : [bg.cat].filter(Boolean);
  return cats.includes(cat);
}

let currentBgId = null;

function unsplashUrl(id, w, h) {
  return `https://images.unsplash.com/${id}?w=${w}&h=${h}&fit=crop&q=80`;
}

function cssUrl(url) {
  return `url("${url.replace(/"/g, '%22')}")`;
}

function backgroundUrl(bg, w, h) {
  if (bg.kind === 'animated') return bg.fallback;
  if (bg.kind === 'gradient') return bg.value;
  return unsplashUrl(bg.id, w, h);
}

let bgLoopRaf = null;

function clearBackgroundMedia() {
  // Stop the crossfade driver too — otherwise switching to a photo or None
  // leaves it running every frame against detached video elements.
  if (bgLoopRaf) { cancelAnimationFrame(bgLoopRaf); bgLoopRaf = null; }
  bgMediaLayer.querySelectorAll('video').forEach(v => { try { v.pause(); v.src = ''; } catch (e) {} });
  bgMediaLayer.replaceChildren();
}

function tryPlayVideo(video) {
  const maybePromise = video.play();
  if (maybePromise && typeof maybePromise.catch === 'function') {
    maybePromise.catch(() => {});
  }
}

// Crossfade looping.
//
// `video.loop = true` hard-cuts from the last frame back to the first, which is
// jarring on footage that wasn't authored as a loop. Instead we run two copies
// of the clip: shortly before the playing one ends, the other starts from zero
// and we fade between them. Motion always runs forward and the seam disappears.
// ── Procedural renderer ───────────────────────────────────────────────────────
// Runs at ~30fps (ambient motion needs no more) and honours reduced-motion by
// drawing a single still frame instead of animating.
const PROC_FPS = 30;
const reduceMotion = window.matchMedia
  ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

function drawProcFrame(gen, opts, ctx, W, H, t, state) {
  ctx.clearRect(0, 0, W, H);
  gen.draw(ctx, W, H, t, opts, state);
}

function mountProceduralBackground(bg) {
  clearBackgroundMedia();
  const gen = PROC_GENS[bg.gen];
  if (!gen) return;

  const cv = document.createElement('canvas');
  cv.className = 'bg-media-canvas';
  cv.style.filter = gen.css || 'none';
  cv.setAttribute('aria-hidden', 'true');
  bgMediaLayer.appendChild(cv);
  const ctx = cv.getContext('2d');

  let state = null, cw = 0, ch = 0;
  const resize = () => {
    const bw = Math.max(2, bgMediaLayer.clientWidth);
    const bh = Math.max(2, bgMediaLayer.clientHeight);
    const [w, h] = gen.res(bw, bh);
    if (w === cw && h === ch) return;
    cw = cv.width = w; ch = cv.height = h;
    state = gen.init(bg.opts, w, h);
  };
  resize();

  if (reduceMotion.matches) {
    drawProcFrame(gen, bg.opts, ctx, cw, ch, 8, state);   // one still frame
    return;
  }

  const t0 = performance.now();
  let last = 0;
  const step = (now) => {
    bgLoopRaf = requestAnimationFrame(step);
    if (now - last < 1000 / PROC_FPS) return;
    last = now;
    resize();
    drawProcFrame(gen, bg.opts, ctx, cw, ch, (now - t0) / 1000, state);
  };
  bgLoopRaf = requestAnimationFrame(step);
}

// Small still frame for the picker tile, rendered once.
function proceduralPoster(bg, w = 200, h = 120) {
  const gen = PROC_GENS[bg.gen];
  if (!gen) return null;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  gen.draw(x, w, h, 7.5, bg.opts, gen.init(bg.opts, w, h));
  return c.toDataURL('image/png');
}

const XFADE_S = 1.2;               // overlap length, seconds

function mountAnimatedBackground(bg) {
  clearBackgroundMedia();
  if (bgLoopRaf) { cancelAnimationFrame(bgLoopRaf); bgLoopRaf = null; }

  const make = () => {
    const v = document.createElement('video');
    v.className = 'bg-media-video';
    v.src = bg.src;
    v.muted = true;
    v.loop = false;                // we handle the wrap ourselves
    v.playsInline = true;
    v.preload = 'auto';
    v.setAttribute('aria-hidden', 'true');
    v.style.opacity = '0';
    v.style.transition = 'none';   // opacity is driven per-frame below
    bgMediaLayer.appendChild(v);
    return v;
  };

  // `b` sits on top of `a` in stacking order. Only `b`'s opacity is ever
  // animated — `a` stays fully opaque underneath. Fading both at once would
  // let the board show through by ~25% at the midpoint and visibly dim.
  const START = bg.startAt || 0;
  const a = make(), b = make();
  a.style.opacity = '1';
  b.style.opacity = '0';
  let front = a, back = b, handedOff = false;
  if (START) {
    front.addEventListener('loadedmetadata',
      () => { try { front.currentTime = START; } catch (e) {} }, { once: true });
  }
  tryPlayVideo(front);

  const step = () => {
    bgLoopRaf = requestAnimationFrame(step);
    const d = front.duration;
    if (!d || !isFinite(d)) return;

    const usable = Math.max(0.5, d - START);          // the part we actually loop
    const fade = Math.min(XFADE_S, usable / 3);       // short clips get a shorter overlap
    const left = d - front.currentTime;

    if (!handedOff && left <= fade) {
      handedOff = true;
      try { back.currentTime = START; } catch (e) {}
      tryPlayVideo(back);
    }
    if (handedOff) {
      const t = Math.min(1, Math.max(0, 1 - left / fade));
      b.style.opacity = String(back === b ? t : 1 - t);
      if (left <= 0.03) {
        // Hand over: the finished clip rewinds and waits its turn underneath
        front.pause();
        try { front.currentTime = START; } catch (e) {}
        b.style.opacity = (back === b) ? '1' : '0';
        const tmp = front; front = back; back = tmp;
        handedOff = false;
      }
    }
  };
  bgLoopRaf = requestAnimationFrame(step);
}

function setBackground(id) {
  const bg = id ? BACKGROUND_MAP.get(id) : null;
  currentBgId = bg ? id : null;
  if (!bg) {
    clearBackgroundMedia();
    board.style.backgroundImage = '';
    board.style.backgroundSize  = '';
    board.style.backgroundPosition = '';
    board.style.backgroundRepeat = '';
    document.body.classList.remove('has-bg');
    document.getElementById('bg-btn').classList.remove('active');
    localStorage.removeItem('bg');
  } else {
    if (bg.kind === 'animated') {
      board.style.backgroundImage = bg.fallback;
      mountAnimatedBackground(bg);
    } else if (bg.kind === 'procedural') {
      board.style.backgroundImage = `linear-gradient(${bg.opts.bg}, ${bg.opts.bg})`;
      mountProceduralBackground(bg);
    } else {
      clearBackgroundMedia();
      board.style.backgroundImage = bg.kind === 'gradient'
        ? bg.value
        : cssUrl(backgroundUrl(bg, 1920, 1080));
    }
    board.style.backgroundSize     = 'cover';
    board.style.backgroundPosition = 'center';
    board.style.backgroundRepeat   = 'no-repeat';
    document.body.classList.add('has-bg');
    document.getElementById('bg-btn').classList.add('active');
    localStorage.setItem('bg', bg.id);
  }
  // Update active thumbnail. Done in place rather than re-rendering the grid so
  // the panel keeps its scroll position when you try backgrounds one after another.
  document.querySelectorAll('.bg-thumb').forEach(t => {
    const on = t.dataset.id === (currentBgId || 'none');
    t.classList.toggle('active', on);
    const tick = t.querySelector('.bg-check');
    if (on && !tick) {
      const el = document.createElement('span');
      el.className = 'bg-check'; el.textContent = '✓';
      t.appendChild(el);
    } else if (!on && tick) {
      tick.remove();
    }
  });
}

let bgCat = 'all';
let bgQuery = '';

function renderBgGrid(cat = bgCat) {
  bgCat = cat;
  const grid = document.getElementById('bg-grid');
  grid.innerHTML = '';

  // None tile
  const none = document.createElement('div');
  none.className = 'bg-thumb none-tile' + (currentBgId === null ? ' active' : '');
  none.dataset.id = 'none';
  none.textContent = '✕ None';
  none.addEventListener('click', () => setBackground(null));
  grid.appendChild(none);

  const q = bgQuery.trim().toLowerCase();
  const list = BACKGROUNDS.filter(bg =>
    backgroundMatchesCategory(bg, cat) &&
    (!q || bg.name.toLowerCase().includes(q) ||
     (Array.isArray(bg.cats) ? bg.cats : []).some(c => c.includes(q)))
  );

  list.forEach(bg => {
    const tile = document.createElement('div');
    tile.className = 'bg-thumb' + (bg.kind === 'animated' ? ' animated-thumb' : '') + (currentBgId === bg.id ? ' active' : '');
    tile.dataset.id = bg.id;
    tile.setAttribute('role', 'button');
    tile.setAttribute('aria-label', bg.name);

    if (bg.kind === 'gradient') {
      tile.style.backgroundImage = bg.value;
      tile.style.backgroundSize = 'cover';
      tile.style.backgroundPosition = 'center';
    } else if (bg.kind === 'procedural') {
      const poster = proceduralPoster(bg);
      if (poster) tile.style.backgroundImage = `url("${poster}")`;
      tile.style.backgroundSize = 'cover';
      tile.style.backgroundPosition = 'center';
    } else if (bg.kind === 'animated') {
      // Gradient stands in until the video is hovered
      tile.style.backgroundImage = bg.fallback;
      tile.style.backgroundSize = 'cover';
      tile.style.backgroundPosition = 'center';
      const preview = document.createElement('video');
      preview.className = 'bg-thumb-video';
      preview.src = bg.src;
      preview.muted = true;
      preview.loop = true;
      preview.playsInline = true;
      preview.preload = 'none';           // only fetched on hover
      preview.setAttribute('aria-hidden', 'true');
      tile.appendChild(preview);
      tile.addEventListener('mouseenter', () => { preview.preload = 'metadata'; tryPlayVideo(preview); });
      tile.addEventListener('mouseleave', () => {
        preview.pause();
        try { preview.currentTime = 0; } catch (e) {}
      });
    } else {
      // A real <img> rather than a CSS background, so we get load/error events:
      // lazy-loading and self-removal on failure both depend on them.
      const img = document.createElement('img');
      img.className = 'bg-thumb-img';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = '';
      img.src = backgroundUrl(bg, 400, 240);
      img.addEventListener('load',  () => tile.classList.add('loaded'));
      img.addEventListener('error', () => tile.remove());   // never leave a hole
      tile.appendChild(img);
    }

    const label = document.createElement('span');
    label.className = 'bg-thumb-label';
    label.textContent = bg.name;
    tile.appendChild(label);
    if (currentBgId === bg.id) {
      const tick = document.createElement('span');
      tick.className = 'bg-check'; tick.textContent = '✓';
      tile.appendChild(tick);
    }
    tile.addEventListener('click', () => setBackground(bg.id));
    grid.appendChild(tile);
  });

  const empty = document.createElement('p');
  empty.className = 'bg-empty';
  empty.textContent = q ? `No backgrounds match “${bgQuery.trim()}”` : 'Nothing here yet';
  empty.style.display = list.length ? 'none' : 'block';
  grid.appendChild(empty);
}

// Hide category chips that have nothing in them, so the row doesn't advertise
// empty tabs as the library changes.
function pruneEmptyBgTabs() {
  document.querySelectorAll('.bg-tab').forEach(tab => {
    const c = tab.dataset.cat;
    const n = c === 'all' ? BACKGROUNDS.length
                          : BACKGROUNDS.filter(bg => backgroundMatchesCategory(bg, c)).length;
    tab.style.display = n ? '' : 'none';
  });
}

// Tabs
document.querySelectorAll('.bg-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.bg-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderBgGrid(tab.dataset.cat);
  });
});

// Search
const bgSearch = document.getElementById('bg-search');
if (bgSearch) {
  bgSearch.addEventListener('input', () => { bgQuery = bgSearch.value; renderBgGrid(); });
}

// Open / close
const bgOverlay = document.getElementById('bg-overlay');
document.getElementById('bg-btn').addEventListener('click', () => {
  bgOverlay.classList.toggle('open');
  if (bgOverlay.classList.contains('open')) { pruneEmptyBgTabs(); renderBgGrid(bgCat); }
});
document.getElementById('close-bg').addEventListener('click', () => bgOverlay.classList.remove('open'));

// ── Widget opacity + invisible frames ─────────────────────────────────────────
(function() {
  const slider  = document.getElementById('widget-opacity');
  const label   = document.getElementById('opacity-val');
  const invisCb = document.getElementById('invisible-frames');

  function applyOpacity(v) {
    document.documentElement.style.setProperty('--widget-alpha', (v/100).toFixed(2));
    label.textContent = v + '%';
  }
  function applyInvisible(on) {
    document.body.classList.toggle('invisible-frames', on);
    // Disable opacity slider when fully invisible
    slider.disabled = on;
    label.style.opacity = on ? '0.3' : '1';
  }

  const savedOp  = parseInt(localStorage.getItem('widget-opacity') ?? '82');
  const savedInv = localStorage.getItem('invisible-frames') === 'true';
  slider.value   = savedOp;
  applyOpacity(savedOp);
  invisCb.checked = savedInv;
  applyInvisible(savedInv);

  slider.addEventListener('input', () => {
    applyOpacity(parseInt(slider.value));
    localStorage.setItem('widget-opacity', slider.value);
  });
  invisCb.addEventListener('change', () => {
    applyInvisible(invisCb.checked);
    localStorage.setItem('invisible-frames', invisCb.checked);
  });
})();

// Restore from localStorage
function initBackground() {
  const saved = localStorage.getItem('bg');
  if (saved) setBackground(saved);
}

// ── Layout persistence ────────────────────────────────────────────────────────
const LAYOUT_VERSION = 4;

function saveLayout() {
  const state = {
    v:       LAYOUT_VERSION,
    mode:    layoutMode,
    widgets: widgets.map(w => ({
      type: w.type,
      left: w.card.style.left,
      top:  w.card.style.top,
      w:    w.card.style.width,
      h:    w.card.style.height,
    })),
  };
  localStorage.setItem('layout', JSON.stringify(state));
}

function restoreLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem('layout') || 'null');
    // If no saved state, or version mismatch → use clean default
    if (!saved || saved.v !== LAYOUT_VERSION) {
      localStorage.removeItem('layout');
      localStorage.removeItem('bg');          // also clear background
      localStorage.removeItem('invisible-frames');
      return false;
    }
    if (!Array.isArray(saved.widgets) || !saved.widgets.length) return false;
    layoutMode = saved.mode === 'manual' ? 'manual' : 'auto';
    saved.widgets.forEach(s => {
      if (!WIDGET_META[s.type]) return;   // skip types that no longer exist
      const widget = createWidget(s.type, { skipArrange: true, skipReveal: true });
      widget.card.style.left   = s.left;
      widget.card.style.top    = s.top;
      widget.card.style.width  = s.w;
      widget.card.style.height = s.h;
    });
    return true;
  } catch { return false; }
}

// Save layout whenever a widget is moved or resized (debounced)
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLayout, 600);
}

// ── Init ──────────────────────────────────────────────────────────────────────
updateDigits();
initBackground();
requestAnimationFrame(loop);
requestAnimationFrame(() => {
  // Try to restore saved layout; fall back to default circle + blocks
  if (!restoreLayout()) {
    createWidget('circle');
    createWidget('blocks');
  }
  // Listen for any position/size changes and save
  document.addEventListener('mouseup',  scheduleSave);
  document.addEventListener('touchend', scheduleSave);
});
</script>
</body>
