<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Visual Timer | onlinevisualtimer.com</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%230b1120'/><circle cx='16' cy='16' r='10' fill='none' stroke='%231a2844' stroke-width='4'/><circle cx='16' cy='16' r='10' fill='none' stroke='%2322c55e' stroke-width='4.5' stroke-dasharray='47 16' stroke-dashoffset='16' stroke-linecap='round'/></svg>" />
  <meta name="description" content="Free visual timer widgets for classrooms, focus sessions, ADHD, and more." />
  <style>
    :root {
      --bg:      #0b1120;
      --s1:      #141e30;
      --s2:      #1a2844;
      --s3:      #243354;
      --border:  rgba(255,255,255,0.07);
      --text:    #f0f4ff;
      --sub:     #6a85b0;
      --accent:  #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(11,17,32,0.95);
      backdrop-filter: blur(16px);
      z-index: 100;
    }
    .logo { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
    .logo span { color: var(--text); }
    .tagline { font-size: 0.74rem; color: var(--sub); }

    /* ── BOARD ── */
    #board {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 10px 10px;
    }
    #bg-media-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    /* Ambient colour bloom that breathes with the timer */
    #board::before {
      content: '';
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 35%,
        var(--flow-col, rgba(34,197,94,0.06)) 0%, transparent 68%);
      transition: background 0.8s ease;
    }

    /* ── WIDGET CARDS ── */
    .widget-card {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      overflow: hidden;
      min-width: 160px;
      min-height: 140px;
      transition: box-shadow 0.2s;
    }
    /* Custom resize handle — replaces CSS resize:both so we control snap */
    .resize-handle {
      position: absolute;
      bottom: 0; right: 0;
      width: 22px; height: 22px;
      cursor: se-resize;
      z-index: 5;
    }
    .resize-handle::after {
      content: '';
      position: absolute;
      right: 5px; bottom: 5px;
      width: 10px; height: 10px;
      border-right: 2px solid rgba(255,255,255,0.2);
      border-bottom: 2px solid rgba(255,255,255,0.2);
      border-radius: 1px;
      transition: border-color 0.1s;
    }
    .widget-card:hover .resize-handle::after { border-color: rgba(255,255,255,0.45); }
    .resize-handle:active::after { border-color: var(--accent); }
    .widget-card.dragging {
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
      opacity: 0.93;
    }
    /* Snappy position/size animation for auto-layout */
    .widget-card.animating {
      transition: left .15s cubic-bezier(.2,0,.2,1),
                  top  .15s cubic-bezier(.2,0,.2,1),
                  width  .15s cubic-bezier(.2,0,.2,1),
                  height .15s cubic-bezier(.2,0,.2,1);
    }
    .widget-card:hover .widget-close { opacity: 1; }

    .widget-header {
      flex-shrink: 0;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 10px;
      background: var(--s2);
      cursor: grab;
      user-select: none;
      border-bottom: 1px solid var(--border);
    }
    .widget-header:active { cursor: grabbing; }
    .widget-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--sub);
      letter-spacing: 0.2px;
    }
    .drag-dots { color: var(--s3); letter-spacing: -1px; font-size: 1rem; }
    .widget-close {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      opacity: 0;
      line-height: 1;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }
    .widget-close:hover { background: rgba(239,68,68,0.15); color: #ef4444; }

    .widget-body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .widget-body canvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
    }

    #add-btn {
      background: var(--accent);
      color: #061020;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(56,189,248,0.28);
      transition: box-shadow 0.2s, transform 0.12s;
    }
    #add-btn:hover { box-shadow: 0 0 40px rgba(56,189,248,0.45); transform: scale(1.04); }
    #add-btn:active { transform: scale(0.93) !important; transition-duration: .05s !important; }
    #layout-btn {
      background: var(--s2);
      color: var(--sub);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.08s, color 0.08s;
    }
    #layout-btn:hover { background: var(--s3); color: var(--text); }
    #layout-btn:active { transform: scale(0.93); transition-duration: .05s; }

    /* ── ADD OVERLAY ── */
    #add-overlay {
      position: fixed; inset: 0;
      background: rgba(6,10,20,0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }
    #add-overlay.open { opacity: 1; pointer-events: all; }
    .overlay-card {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 24px;
      width: 460px;
      max-width: 92vw;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }
    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .overlay-top h3 { font-size: 0.95rem; font-weight: 700; }
    .overlay-x {
      background: none; border: none;
      color: var(--sub); font-size: 1.2rem;
      cursor: pointer; padding: 2px 8px;
      border-radius: 8px;
    }
    .overlay-x:hover { background: var(--s2); color: var(--text); }
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .wt-btn {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 6px 10px;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      cursor: pointer; color: var(--text);
      transition: background 0.14s, border-color 0.14s, transform 0.1s;
    }
    .wt-btn:hover { background: var(--s3); border-color: var(--accent); transform: translateY(-2px); }
    .wt-btn:active { transform: scale(0.94); }
    .wt-icon { font-size: 1.5rem; }
    .wt-label { font-size: 0.68rem; font-weight: 600; color: var(--sub); text-align: center; }

    /* ── DONE BANNER ── */
    #done-banner {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      background: linear-gradient(135deg,#22c55e,#16a34a);
      color: #fff;
      padding: 18px 44px;
      border-radius: 999px;
      font-size: 1.4rem; font-weight: 800;
      z-index: 300;
      box-shadow: 0 0 60px rgba(34,197,94,0.5);
      cursor: pointer;
      animation: dpop .4s ease, dpulse 1s .4s ease-in-out infinite alternate;
    }
    @keyframes dpop {
      from { transform:translate(-50%,-50%) scale(.7); opacity:0; }
      to   { transform:translate(-50%,-50%) scale(1);  opacity:1; }
    }
    @keyframes dpulse {
      from { box-shadow:0 0 40px rgba(34,197,94,.4); }
      to   { box-shadow:0 0 70px rgba(34,197,94,.65); }
    }

    /* ── CONTROLS BAR ── */
    #controls-bar {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: rgba(11,17,32,0.97);
      backdrop-filter: blur(16px);
      padding: 8px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      z-index: 100;
    }
    .ctrl-center { display: flex; align-items: center; gap: 16px; justify-content: center; }
    .ctrl-right  { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    /* ── Digit-column time setter ── */
    .digit-timer {
      display: flex; align-items: center; gap: 2px;
    }
    .digit-col {
      display: flex; flex-direction: column;
      align-items: center; gap: 1px;
    }
    .dbt {
      background: none; border: none;
      color: var(--sub); font-size: 0.95rem; font-weight: 700;
      cursor: pointer; padding: 3px 9px;
      border-radius: 7px; line-height: 1; user-select: none;
      transition: color 0.06s, background 0.06s, transform 0.06s;
    }
    .dbt:hover  { color: var(--accent); background: var(--s2); }
    .dbt:active { transform: scale(0.8); }
    .dbt:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
    .dgt {
      font-size: 2.7rem; font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--text); line-height: 1;
      min-width: 1.6ch; text-align: center;
      letter-spacing: -1px;
      transition: color 0.15s;
    }
    .digit-timer.disabled .dgt { color: var(--sub); }
    /* Leading zero-hours are dimmed so the eye lands on the active units */
    .dgt.leading { color: var(--s3); }
    .digit-sep {
      font-size: 2.7rem; font-weight: 900;
      color: var(--s3); line-height: 1;
      padding: 0 1px; margin-top: 2px;
      /* vertically center with the digits, offset for the buttons */
      align-self: center;
    }
    /* Six digits need more room than four — scale the bar down on smaller screens */
    @media (max-width: 1500px) {
      .dgt, .digit-sep { font-size: 2.3rem; }
      .dbt { padding: 3px 7px; }
      .ctrl-center { gap: 12px; }
    }
    @media (max-width: 1240px) {
      .dgt, .digit-sep { font-size: 1.9rem; }
      .dbt { padding: 2px 5px; font-size: 0.85rem; }
      .ctrl-center { gap: 8px; }
      #controls-bar { padding: 8px 12px; }
      .ctrl-right { gap: 6px; }
    }
    .ctrl-btns { display: flex; gap: 8px; align-items: center; }
    .btn {
      border: none; border-radius: 999px;
      font-weight: 700; cursor: pointer;
      transition: transform 0.06s, box-shadow 0.12s, background 0.08s;
    }
    .btn:active { transform: scale(0.91) !important; }
    .btn-start {
      background: var(--accent); color: #061020;
      padding: 9px 28px; font-size: 0.9rem;
    }
    .btn-start:hover { box-shadow: 0 0 22px rgba(56,189,248,0.35); }
    .btn-reset {
      background: var(--s2); color: var(--sub);
      padding: 9px 16px; font-size: 0.88rem;
      border: 1px solid var(--border);
    }
    .btn-reset:hover { color: var(--text); background: var(--s3); }

    /* ── Background panel ── */
    #bg-overlay {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 336px;
      background: var(--s1);
      border-left: 1px solid var(--border);
      z-index: 200;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.2s cubic-bezier(.2,0,.2,1);
      box-shadow: -8px 0 40px rgba(0,0,0,0.4);
    }
    #bg-overlay.open { transform: translateX(0); }
    .bg-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .bg-panel-header h3 { font-size: 0.9rem; font-weight: 700; }
    .bg-close {
      background: none; border: none; color: var(--sub);
      font-size: 1.2rem; cursor: pointer; padding: 2px 7px;
      border-radius: 7px;
    }
    .bg-close:hover { background: var(--s2); color: var(--text); }
    .bg-tabs {
      display: flex; gap: 5px; padding: 10px 12px;
      flex-wrap: wrap; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .bg-tab {
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 10px;
      font-size: 0.7rem; font-weight: 700; line-height: 1.1;
      cursor: pointer; color: var(--sub);
      transition: background 0.1s, color 0.1s;
    }
    .bg-tab:hover { background: var(--s3); color: var(--text); }
    .bg-tab.active { background: var(--accent); color: #061020; border-color: var(--accent); }
    .bg-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: 92px;
      gap: 10px;
      padding: 12px 12px 18px;
      overflow-y: auto; flex: 1;
      align-content: start;
    }
    .bg-thumb {
      min-height: 92px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.12s, transform 0.1s;
      position: relative;
      background: linear-gradient(160deg, #19243c 0%, #0d1424 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .bg-thumb:hover { transform: scale(1.04); }
    .bg-thumb.active { border-color: var(--accent); }
    .bg-thumb.animated-thumb::before {
      content: 'Video';
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(6, 12, 24, 0.74);
      border: 1px solid rgba(255,255,255,0.12);
      color: #dbeafe;
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .bg-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(3,8,18,0.04) 0%, rgba(3,8,18,0.14) 100%);
      pointer-events: none;
    }
    .bg-thumb-label {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 16px 10px 8px;
      background: linear-gradient(180deg, rgba(4,8,18,0) 0%, rgba(4,8,18,0.86) 100%);
      color: #f0f4ff;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      z-index: 1;
    }
    .bg-thumb-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 0;
      background: linear-gradient(160deg, #10192b 0%, #07101c 100%);
    }
    .bg-thumb:hover .bg-thumb-label,
    .bg-thumb.active .bg-thumb-label { opacity: 1; transform: translateY(0); }
    .bg-thumb.none-tile {
      background: var(--s2); border-color: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; color: var(--sub); font-weight: 600;
      letter-spacing: 0.5px;
    }
    #bg-btn {
      background: var(--s2); color: var(--sub);
      border: 1px solid var(--border);
      border-radius: 999px; padding: 10px 14px;
      font-size: 0.88rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.08s, color 0.08s;
    }
    #bg-btn:hover { background: var(--s3); color: var(--text); }
    #bg-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ── Widget transparency slider ── */
    .opacity-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px 8px;
      flex-shrink: 0;
    }
    .opacity-row label { font-size: 0.74rem; color: var(--sub); white-space: nowrap; }
    .opacity-row input[type=range] {
      flex: 1; accent-color: var(--accent);
      height: 3px; cursor: pointer;
    }
    .opacity-val { font-size: 0.72rem; color: var(--sub); min-width: 28px; text-align: right; }
    .invisible-row {
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .invisible-row label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.74rem; color: var(--sub);
      cursor: pointer; user-select: none;
    }
    .invisible-row input { accent-color: var(--accent); cursor: pointer; }

    /* ── Invisible frames mode ── */
    body.invisible-frames .widget-card {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    body.invisible-frames .widget-header {
      background: transparent !important;
      border-color: transparent !important;
      opacity: 0;
      transition: opacity 0.2s;
    }
    body.invisible-frames .widget-card:hover .widget-header {
      opacity: 0.55;
    }
    body.invisible-frames .widget-card:hover {
      border-color: rgba(255,255,255,0.18) !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.10) !important;
    }
    body.invisible-frames .widget-card:active {
      border-color: rgba(255,255,255,0.30) !important;
    }

    /* ── Widget frosted-glass adaptation when background photo is set ── */
    /* dot grid is CSS background-image; JS inline style overrides it automatically */
    body.has-bg #board::before { display: none; } /* hide ambient bloom when photo set */
    body.has-bg .widget-card {
      background: rgba(11,17,32, var(--widget-alpha, 0.82));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-color: rgba(255,255,255,0.11);
      box-shadow: 0 4px 32px rgba(0,0,0,0.45);
    }
    body.has-bg .widget-header {
      background: rgba(20,34,58, var(--widget-alpha, 0.82));
    }
    body.has-bg #controls-bar {
      background: rgba(8,13,22,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    body.has-bg header {
      background: rgba(8,13,22,0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .bg-media-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      pointer-events: none;
      filter: saturate(1.02) contrast(1.02) brightness(0.92);
    }
    .animated-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }
    .animated-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(3,8,18,0.06) 0%, rgba(3,8,18,0.18) 100%);
      pointer-events: none;
    }
    .animated-bg .blob,
    .animated-bg .beam,
    .animated-bg .mist,
    .animated-bg .wave,
    .animated-bg .grid,
    .animated-bg .scan,
    .animated-bg .stars,
    .animated-bg .particles,
    .animated-bg .bars,
    .animated-bg .snow-layer,
    .animated-bg .sheet {
      position: absolute;
      inset: 0;
    }
    .animated-bg .blob,
    .animated-bg .mist,
    .animated-bg .wave,
    .animated-bg .beam {
      filter: blur(28px);
      opacity: 0.8;
      border-radius: 50%;
    }
    .animated-bg .blob {
      animation: bgFloat 18s ease-in-out infinite alternate;
    }
    .animated-bg .beam {
      animation: bgSweep 22s linear infinite;
    }
    .animated-bg .mist {
      animation: bgDrift 30s linear infinite;
    }
    .animated-bg .wave {
      animation: bgWave 16s ease-in-out infinite alternate;
    }
    .animated-bg .scan {
      animation: bgScan 6s linear infinite;
    }
    .animated-bg .stars {
      animation: bgTwinkle 8s ease-in-out infinite alternate;
    }
    .animated-bg .particles {
      animation: bgRise 16s linear infinite;
    }
    .animated-bg .bars {
      animation: bgPulse 7s ease-in-out infinite alternate;
    }
    .animated-bg .snow-layer,
    .animated-bg .sheet {
      animation: bgFall 13s linear infinite;
    }

    .scene-aurora {
      background: linear-gradient(180deg, #03111f 0%, #081b31 45%, #11283b 100%);
    }
    .scene-aurora .blob.a {
      inset: -10% 35% 38% -8%;

<script>
// ── Timer state ───────────────────────────────────────────────────────────────
let totalSeconds  = 5 * 60;
let remaining     = totalSeconds; // updated every RAF frame — fractional
let running       = false;
let startStamp    = null;   // performance.now() when last started/resumed
let pausedElapsed = 0;      // seconds elapsed at last pause

function getElapsed() {
  if (!running || startStamp === null) return pausedElapsed;
  return pausedElapsed + (performance.now() - startStamp) / 1000;
}
function getPreciseRemaining() {
  return Math.max(0, totalSeconds - getElapsed());
}

// ── Widget registry ───────────────────────────────────────────────────────────
const WIDGET_META = {
  circle:    { name: 'Circle Timer',  defaultW: 290, defaultH: 330 },
  bar:       { name: 'Progress Bar',  defaultW: 380, defaultH: 110 },
  blocks:    { name: 'Blocks',        defaultW: 360, defaultH: 270 },
  dots:      { name: 'Dots',          defaultW: 360, defaultH: 270 },
  liquid:    { name: 'Liquid Timer',  defaultW: 230, defaultH: 370 },
  hourglass: { name: 'Hourglass',     defaultW: 170, defaultH: 380 },
  clock:     { name: 'Analog Clock',  defaultW: 280, defaultH: 300 },
  digital:   { name: 'Digital',       defaultW: 300, defaultH: 170 },
  ufo:       { name: 'Cow Abduction', defaultW: 460, defaultH: 300 },
};

let widgets = [];
let nextId  = 0;
let topZ    = 10;
let layoutMode = 'auto';
const board = document.getElementById('board');
const bgMediaLayer = document.getElementById('bg-media-layer');

// ── Grid snap (for manual drag/resize only) ───────────────────────────────────
const SNAP = 20;
function snap(v) { return Math.round(v / SNAP) * SNAP; }
function snapDown(v) { return Math.floor(v / SNAP) * SNAP; }
function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

// ── Auto-layout: pixel-perfect tiling — no snap rounding here ────────────────
const M = 8;  // outer margin
const G = 8;  // gap between widgets

function gridFor(n) {
  if (n <= 1) return [1, 1];
  if (n <= 2) return [2, 1];
  if (n <= 3) return [3, 1];
  if (n <= 4) return [2, 2];
  if (n <= 6) return [3, 2];
  if (n <= 8) return [4, 2];
  return [4, Math.ceil(n / 4)];
}

function autoLayout(animate = true) {
  const n = widgets.length;
  if (n === 0) return;
  const [cols, rows] = gridFor(n);

  // Use exact Math.round — no SNAP rounding — so widgets fill the board perfectly
  const availW = board.clientWidth  - M * 2;
  const availH = board.clientHeight - M * 2;
  const cellW  = Math.round((availW - G * (cols - 1)) / cols);
  const cellH  = Math.round((availH - G * (rows - 1)) / rows);

  if (animate) {
    widgets.forEach(w => w.card.classList.add('animating'));
    setTimeout(() => widgets.forEach(w => w.card.classList.remove('animating')), 180);
  }
  widgets.forEach((w, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    w.card.style.left   = (M + c * (cellW + G)) + 'px';
    w.card.style.top    = (M + r * (cellH + G)) + 'px';
    w.card.style.width  = cellW + 'px';
    w.card.style.height = cellH + 'px';
  });
}

function getBoardRect() {
  return {
    left: M,
    top: M,
    right: Math.max(M, board.clientWidth - M),
    bottom: Math.max(M, board.clientHeight - M),
  };
}

// ── Reflow when the board changes size ────────────────────────────────────────
// Auto layouts re-tile to fill the new space. Manual arrangements are scaled
// proportionally so the user's composition is preserved instead of stranded.
const MIN_W = 160, MIN_H = 140;   // must match .widget-card min-width/min-height
let lastBoardW = 0, lastBoardH = 0;

function reflowLayout() {
  const bw = board.clientWidth, bh = board.clientHeight;
  if (bw < 40 || bh < 40) return;              // collapsed / hidden — ignore
  const pw = lastBoardW, ph = lastBoardH;
  lastBoardW = bw; lastBoardH = bh;

  if (!pw || !ph) return;                      // first observation — just seed
  if (pw === bw && ph === bh) return;          // nothing actually changed
  if (!widgets.length) return;

  if (layoutMode === 'auto') {
    autoLayout(false);                         // instant re-tile, no animation
    scheduleSave();
    return;
  }

  const sx = (bw - M * 2) / Math.max(1, pw - M * 2);
  const sy = (bh - M * 2) / Math.max(1, ph - M * 2);

  widgets.forEach(w => {
    const c = w.card;
    const left = parseFloat(c.style.left)   || 0;
    const top  = parseFloat(c.style.top)    || 0;
    const wid  = parseFloat(c.style.width)  || c.offsetWidth;
    const hei  = parseFloat(c.style.height) || c.offsetHeight;

    // Scale size, then position, both relative to the board's inner margin
    let nw = Math.max(MIN_W, Math.round(wid * sx));
    let nh = Math.max(MIN_H, Math.round(hei * sy));
    nw = Math.min(nw, Math.max(MIN_W, bw - M * 2));
    nh = Math.min(nh, Math.max(MIN_H, bh - M * 2));

    let nl = Math.round(M + (left - M) * sx);
    let nt = Math.round(M + (top  - M) * sy);
    // Keep fully on the board
    nl = Math.max(M, Math.min(nl, bw - M - nw));
    nt = Math.max(M, Math.min(nt, bh - M - nh));

    c.style.left = nl + 'px';  c.style.top    = nt + 'px';
    c.style.width = nw + 'px'; c.style.height = nh + 'px';
  });
  scheduleSave();
}

// ResizeObserver catches every cause of a board size change — window resizes,
// and the control bar changing height at different breakpoints.
let _reflowRaf = null;
new ResizeObserver(() => {
  if (_reflowRaf) cancelAnimationFrame(_reflowRaf);
  _reflowRaf = requestAnimationFrame(() => { _reflowRaf = null; reflowLayout(); });
}).observe(board);

function getCardRect(card) {
  return {
    left: card.offsetLeft,
    top: card.offsetTop,
    right: card.offsetLeft + card.offsetWidth,
    bottom: card.offsetTop + card.offsetHeight,
  };
}

function expandRect(rect, pad) {
  return {
    left: rect.left - pad,
    top: rect.top - pad,
    right: rect.right + pad,
    bottom: rect.bottom + pad,
  };
}

function overlaps(a, b) {
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}

function findLargestAvailableRect(excludeCard = null, minW = 0, minH = 0) {
  const boardRect = getBoardRect();
  const obstacles = widgets
    .filter(w => w.card !== excludeCard)
    .map(w => getCardRect(w.card));

  if (!obstacles.length) return boardRect;

  const xs = new Set([boardRect.left, boardRect.right]);
  const ys = new Set([boardRect.top, boardRect.bottom]);

  obstacles.forEach(rect => {
    const padded = expandRect(rect, G);
    xs.add(clamp(padded.left, boardRect.left, boardRect.right));
    xs.add(clamp(padded.right, boardRect.left, boardRect.right));
    ys.add(clamp(padded.top, boardRect.top, boardRect.bottom));
    ys.add(clamp(padded.bottom, boardRect.top, boardRect.bottom));
  });

  const xVals = [...xs].sort((a, b) => a - b);
  const yVals = [...ys].sort((a, b) => a - b);
  let best = null;

  for (let xi = 0; xi < xVals.length - 1; xi++) {
    for (let xj = xi + 1; xj < xVals.length; xj++) {
      const left = xVals[xi];
      const right = xVals[xj];
      const width = right - left;
      if (width < minW) continue;

      for (let yi = 0; yi < yVals.length - 1; yi++) {
        for (let yj = yi + 1; yj < yVals.length; yj++) {
          const top = yVals[yi];
          const bottom = yVals[yj];
          const height = bottom - top;
          if (height < minH) continue;

          const candidate = { left, top, right, bottom };
          if (obstacles.some(rect => overlaps(candidate, expandRect(rect, G)))) continue;

          const area = width * height;
          if (
            !best ||
            area > best.area ||
            (area === best.area && (top < best.top || (top === best.top && left < best.left)))
          ) {
            best = { ...candidate, width, height, area };
          }
        }
      }
    }
  }

  return best;
}

function fitWidgetDimension(defaultSize, available, minSize) {
  if (available <= 0) return defaultSize;
  if (available <= minSize) return available;

  const preferred = Math.min(defaultSize, available);
  const snapped = snapDown(preferred);
  if (snapped >= minSize) return snapped;
  return available;
}

function placeWidgetInLargestSpace(card, meta) {
  const minW = 160;
  const minH = 140;
  const boardRect = getBoardRect();
  const targetRect =
    findLargestAvailableRect(card, minW, minH) ||
    findLargestAvailableRect(card) ||
    boardRect;

  const availW = Math.max(0, targetRect.right - targetRect.left);
  const availH = Math.max(0, targetRect.bottom - targetRect.top);
  const width = Math.min(
    fitWidgetDimension(meta.defaultW, availW, minW),
    boardRect.right - boardRect.left
  );
  const height = Math.min(
    fitWidgetDimension(meta.defaultH, availH, minH),
    boardRect.bottom - boardRect.top
  );

  const left = clamp(
    targetRect.left + Math.max(0, (availW - width) / 2),
    boardRect.left,
    Math.max(boardRect.left, boardRect.right - width)
  );
  const top = clamp(
    targetRect.top + Math.max(0, (availH - height) / 2),
    boardRect.top,
    Math.max(boardRect.top, boardRect.bottom - height)
  );

  card.style.left = snap(left) + 'px';
  card.style.top = snap(top) + 'px';
  card.style.width = Math.max(minW, snapDown(width) || width) + 'px';
  card.style.height = Math.max(minH, snapDown(height) || height) + 'px';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
// Smoothly interpolate between hex colours
function lerpHex(a, b, t) {
  const p = s => parseInt(s, 16);
  const r = Math.round(p(a.slice(1,3)) + (p(b.slice(1,3))-p(a.slice(1,3)))*t);
  const g = Math.round(p(a.slice(3,5)) + (p(b.slice(3,5))-p(a.slice(3,5)))*t);
  const bv= Math.round(p(a.slice(5,7)) + (p(b.slice(5,7))-p(a.slice(5,7)))*t);
  return '#'+[r,g,bv].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// Continuous colour: green → yellow → orange → red with no hard cuts
function timerColor(pct) {
  if (pct >= 0.5)  return '#22c55e';
  if (pct >= 0.25) return lerpHex('#f0b429','#22c55e',(pct-0.25)/0.25);
  if (pct >= 0.1)  return lerpHex('#f97316','#f0b429',(pct-0.1)/0.15);
  return                   lerpHex('#ef4444','#f97316', pct/0.1);
}

// Keep for any leftover refs
function timerColors(pct) {
  const c=timerColor(pct); return { base:c, light:c, glow:c };
}
function fmt(s) {
  const secs = Math.max(0, Math.ceil(s - 0.001)); // ceil so display shows whole seconds remaining
  const h = Math.floor(secs / 3600);
  const m = Math.floor(secs / 60) % 60;
  const sec = secs % 60;
  // Hours only appear once there are hours — keeps short timers reading "5:00"
  return h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
}
// Set ctx.font at `fs`, shrinking it so `text` fits within maxW.
// Labels grow from "5:00" to "99:59:59" once hours are in play, so a font size
// derived only from the container will overflow. Returns the size actually used.
function fitFont(ctx, text, maxW, fs, weight = 900) {
  ctx.font = `${weight} ${fs}px -apple-system,sans-serif`;
  const w = ctx.measureText(text).width;
  if (w > maxW && w > 0) {
    fs = Math.max(8, fs * (maxW / w));
    ctx.font = `${weight} ${fs}px -apple-system,sans-serif`;
  }
  return fs;
}
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Create widget ─────────────────────────────────────────────────────────────
function createWidget(type, options = {}) {
  const { skipArrange = false, skipReveal = false } = options;
  const meta = WIDGET_META[type];
  if (!meta) return null;               // unknown/retired widget type
  const id   = ++nextId;

  const card = document.createElement('div');
  card.className = 'widget-card';
  card.id = `w${id}`;
  // Start hidden at 0,0 — autoLayout will place & reveal it
  card.style.cssText = `left:0;top:0;width:${meta.defaultW}px;height:${meta.defaultH}px;z-index:${topZ++};opacity:0;pointer-events:none`;

  card.innerHTML = `
    <div class="widget-header">
      <div class="widget-title"><span class="drag-dots">⠿⠿</span>${meta.name}</div>
      <button class="widget-close" title="Remove">×</button>
    </div>
    <div class="widget-body"><canvas></canvas></div>
    <div class="resize-handle"></div>`;
  board.appendChild(card);

  const body   = card.querySelector('.widget-body');
  const canvas = card.querySelector('canvas');
  const ctx    = canvas.getContext('2d');
  const state  = { drops:[], grains:[], lastSpawn:0 };
  const ro = new ResizeObserver(() => {
    canvas.width  = body.clientWidth;
    canvas.height = body.clientHeight;
  });
  ro.observe(body);
  card.querySelector('.widget-close').addEventListener('click', e => { e.stopPropagation(); removeWidget(id); });

  const widget = { id, type, card, canvas, ctx, state, ro };
  widgets.push(widget);
  makeDraggable(card); makeResizable(card);

  if (!skipArrange) {
    if (layoutMode === 'manual') {
      placeWidgetInLargestSpace(card, meta);
    } else {
      autoLayout(true);
    }
  }

  if (skipReveal) {
    card.style.opacity = '1';
    card.style.pointerEvents = '';
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      card.style.transition = 'opacity .12s ease';
      card.style.opacity = '1';
      card.style.pointerEvents = '';
      setTimeout(() => { card.style.transition = ''; }, 140);
    }));
  }

  return widget;
}

function removeWidget(id) {
  const w = widgets.find(w => w.id === id);
  if (!w) return;
  w.ro.disconnect();
  w.card.style.transition = 'opacity .1s, transform .1s';
  w.card.style.opacity = '0';
  w.card.style.transform = 'scale(.88)';
  w.card.style.pointerEvents = 'none';
  setTimeout(() => {
    w.card.remove();
    widgets = widgets.filter(x => x.id !== id);
    if (layoutMode === 'auto') autoLayout(true);
    setTimeout(saveLayout, 250);
  }, 110);
}

// ── Drag ─────────────────────────────────────────────────────────────────────
function makeDraggable(card) {
  const header = card.querySelector('.widget-header');
  let drag = false, ox = 0, oy = 0, startLeft = 0, startTop = 0;

  function startDrag(cx, cy) {
    drag = true;
    const br = board.getBoundingClientRect();
    ox = cx - br.left - card.offsetLeft;
    oy = cy - br.top  - card.offsetTop;
    startLeft = card.offsetLeft;
    startTop = card.offsetTop;
    card.style.zIndex = ++topZ;
    card.classList.add('dragging');
  }
  function moveDrag(cx, cy) {
    if (!drag) return;
    const br = board.getBoundingClientRect();
    // Snap to grid in real-time for satisfying "magnetic" feel
    card.style.left = snap(Math.max(0, cx - br.left - ox)) + 'px';
    card.style.top  = snap(Math.max(0, cy - br.top  - oy)) + 'px';
  }
  function endDrag() {
    if (!drag) return;
    drag = false; card.classList.remove('dragging');
    card.style.left = snap(card.offsetLeft) + 'px';
    card.style.top  = snap(card.offsetTop)  + 'px';
    if (card.offsetLeft !== startLeft || card.offsetTop !== startTop) {
      layoutMode = 'manual';
    }
  }

  header.addEventListener('mousedown', e => {
    if (e.target.classList.contains('widget-close')) return;
    startDrag(e.clientX, e.clientY); e.preventDefault();
  });
  document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', endDrag);

  header.addEventListener('touchstart', e => {
    if (e.target.classList.contains('widget-close')) return;
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY); e.preventDefault();
  }, { passive:false });
  document.addEventListener('touchmove', e => {
    if (!drag) return;
    moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault();
  }, { passive:false });
  document.addEventListener('touchend', endDrag);
}

// ── Resize (custom handle — gives us live grid snap) ─────────────────────────
function makeResizable(card) {
  const handle = card.querySelector('.resize-handle');
  let resizing = false, startW, startH, startX, startY;

  function startResize(cx, cy) {
    resizing = true;
    startW = card.offsetWidth;
    startH = card.offsetHeight;
    startX = cx; startY = cy;
    card.style.zIndex = ++topZ;
  }
  function doResize(cx, cy) {
    if (!resizing) return;
    const minW = 160, minH = 140;
    card.style.width  = snap(Math.max(minW, startW + cx - startX)) + 'px';
    card.style.height = snap(Math.max(minH, startH + cy - startY)) + 'px';
  }
  function endResize() {
    if (!resizing) return;
    resizing = false;
    if (card.offsetWidth !== startW || card.offsetHeight !== startH) {
      layoutMode = 'manual';
    }
  }

  handle.addEventListener('mousedown', e => {
    startResize(e.clientX, e.clientY);
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e => doResize(e.clientX, e.clientY));
  document.addEventListener('mouseup', endResize);

  handle.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startResize(t.clientX, t.clientY);
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!resizing) return;
    doResize(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', endResize);
}

// ── Add overlay ───────────────────────────────────────────────────────────────
const overlay = document.getElementById('add-overlay');
document.getElementById('add-btn').addEventListener('click', () => overlay.classList.add('open'));
document.getElementById('close-overlay').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

document.querySelectorAll('.wt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    createWidget(btn.dataset.type);
    overlay.classList.remove('open');
    setTimeout(saveLayout, 400); // save after animation settles
  });
});

document.getElementById('layout-btn').addEventListener('click', () => {
  layoutMode = 'auto';
  autoLayout(true);
  setTimeout(saveLayout, 250);
});

// ── RAF render loop ───────────────────────────────────────────────────────────
function loop() {
  // Precise sub-second remaining — drives smooth visual interpolation
  remaining = getPreciseRemaining();

  // Detect timer completion
  if (running && remaining <= 0) {
    running = false; startStamp = null; pausedElapsed = totalSeconds;
    remaining = 0;
    // The digit block below is skipped once running is false, so it would
    // otherwise freeze on the previous frame's value (00:00:01)
    _lastDigitSec = 0;
    updateDigits(0);
    playDone();                       // chime fires exactly at zero, always
    // Narrative widgets get a moment to finish their story before the banner
    const wantsOutro = widgets.some(w => OUTRO_TYPES.has(w.type));
    if (wantsOutro) {
      outroStart = performance.now();
    } else {
      finishTimer();
    }
  }

  // End of the outro → now show the banner
  if (outroStart && performance.now() - outroStart >= OUTRO_MS) finishTimer();

  // Live countdown digits — update only when the displayed second changes
  if (running) {
    const dispSec = Math.ceil(remaining); // ceiling so 4:59.9 shows 5:00
    if (dispSec !== _lastDigitSec) {
      _lastDigitSec = dispSec;
      updateDigits(dispSec);
    }
  }

  const pct = totalSeconds > 0 ? remaining / totalSeconds : 0;
  const col = timerColor(pct);
  // Drive the board ambient colour bloom
  document.documentElement.style.setProperty('--flow-col', timerColors(pct).base + '0d');
  for (const w of widgets) {
    const { canvas:cv, ctx, type, state } = w;
    const W = cv.width, H = cv.height;
    if (W < 10 || H < 10) continue;
    ctx.clearRect(0, 0, W, H);
    switch (type) {
      case 'circle':    drawCircle(ctx,W,H,pct,col);        break;
      case 'bar':       drawBar(ctx,W,H,pct,col);            break;
      case 'blocks':    drawBlocks(ctx,W,H,pct,col);         break;
      case 'dots':      drawDots(ctx,W,H,pct,col);           break;
      case 'digital':   drawDigital(ctx,W,H,pct,col);        break;
      case 'clock':     drawClock(ctx,W,H,pct,col);          break;
      case 'liquid':    drawLiquid(ctx,W,H,pct,col,state);   break;
      case 'hourglass': drawHourglass(ctx,W,H,pct,col,state);break;
      case 'ufo':       drawUFOTimer(ctx,W,H,pct,col,state);  break;
    }
  }
  requestAnimationFrame(loop);
}

// ── Render: Circle ────────────────────────────────────────────────────────────
function drawCircle(ctx, W, H, pct, col) {
  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-26;
  if (r < 10) return;
  // Pulse ring thickness in final 10% for urgency
  const urgencyPulse = pct < 0.1 ? Math.sin(performance.now()/120)*2 : 0;
  const lw = Math.max(10, r*0.13) + urgencyPulse;

  // Track ring
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#1a2844'; ctx.lineWidth=lw; ctx.stroke();

  if (pct > 0) {
    const hand=-Math.PI/2+(1-pct)*Math.PI*2, end=Math.PI*3/2;
    // Flat pie fill
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r-1,hand,end); ctx.closePath();
    ctx.fillStyle=col+'22'; ctx.fill();
    // Flat arc
    ctx.beginPath(); ctx.arc(cx,cy,r,hand,end);
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  }

  // Time text — flat
  const fs=Math.max(16,Math.min(r*0.52,90));
  ctx.fillStyle=col; fitFont(ctx, fmt(remaining), r*1.55, fs);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(remaining),cx,cy);
}

// ── Render: Bar ───────────────────────────────────────────────────────────────
function drawBar(ctx, W, H, pct, col) {
  const pad=16, bh=Math.min(70,H*0.28), bw=W-pad*2, r=bh/2;
  const tall=H>bh*3.5, by=tall?H*0.38-bh/2:(H-bh)/2;

  // Track — flat
  rrect(ctx,pad,by,bw,bh,r); ctx.fillStyle='#1a2844'; ctx.fill();

  // Fill — flat colour
  const fw=bw*pct;
  if (fw>2) { rrect(ctx,pad+bw-fw,by,fw,bh,r); ctx.fillStyle=col; ctx.fill(); }

  // Time label
  if (tall) {
    const fs=Math.min(W*0.28,H*0.22,80);
    ctx.fillStyle=col; fitFont(ctx, fmt(remaining), W*0.90, fs);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmt(remaining),W/2,H*0.18);
  } else {
    ctx.fillStyle='#fff'; fitFont(ctx, fmt(remaining), W*0.80, Math.min(bh*.5,28), 800);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmt(remaining),W/2,by+bh/2);
  }
}

// ── Render: Blocks — each cell drains individually ────────────────────────────
function drawBlocks(ctx, W, H, pct, col) {
  const C=10, R=6, T=C*R, pad=16, gap=5;
  const cell=Math.min((W-pad*2-gap*(C-1))/C,(H-pad*2-gap*(R-1))/R,48);
  const gw=C*cell+(C-1)*gap, gh=R*cell+(R-1)*gap;
  const ox=(W-gw)/2, oy=(H-gh)/2;
  const rc=Math.min(10, cell*0.28);
  const elapsed=(1-pct)*T; // fractional blocks consumed

  for (let i=0; i<T; i++) {
    const bx=ox+(i%C)*(cell+gap), by=oy+Math.floor(i/C)*(cell+gap);

    // Dark base
    rrect(ctx,bx,by,cell,cell,rc);
    ctx.fillStyle='#1a2844'; ctx.globalAlpha=0.4; ctx.fill();
    ctx.globalAlpha=1;

    if (elapsed <= i) {
      // Fully remaining — solid fill
      rrect(ctx,bx,by,cell,cell,rc); ctx.fillStyle=col; ctx.fill();
    } else if (elapsed < i+1) {
      // Currently draining — liquid surface ripples as level drops
      const t = performance.now()/1000;
      const fillH = cell * (1-(elapsed-i));
      const surfY = by + cell - fillH;
      // Urgency: wave gets faster + bigger in final 10%
      const urgency = pct < 0.1 ? 2.5 : 1;
      const amp  = Math.min(fillH*0.3, 2.5) * urgency;
      const freq = pct < 0.1 ? 6 : 4;
      const spd  = pct < 0.1 ? 5 : 3;

      ctx.save();
      rrect(ctx,bx,by,cell,cell,rc); ctx.clip();
      ctx.fillStyle = col;
      ctx.beginPath();
      // Wavy surface
      for (let s=0; s<=16; s++) {
        const wx = bx + s*(cell/16);
        const wy = surfY + Math.sin(s/16*Math.PI*freq + t*spd)*amp;
        s===0 ? ctx.moveTo(wx, wy) : ctx.lineTo(wx, wy);
      }
      ctx.lineTo(bx+cell, by+cell);
      ctx.lineTo(bx, by+cell);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // else fully drained — dark base only
  }
}

// ── Render: Dots — each dot drains individually ────────────────────────────────
function drawDots(ctx, W, H, pct, col) {
  const C=10, R=6, T=C*R, pad=16, gap=6;
  const diam=Math.min((W-pad*2-gap*(C-1))/C,(H-pad*2-gap*(R-1))/R,44);
  const r=diam/2;
  const gw=C*diam+(C-1)*gap, gh=R*diam+(R-1)*gap;
  const ox=(W-gw)/2, oy=(H-gh)/2;
  const elapsed=(1-pct)*T;

  for (let i=0; i<T; i++) {
    const dcx=ox+(i%C)*(diam+gap)+r, dcy=oy+Math.floor(i/C)*(diam+gap)+r;

    // Dark base
    ctx.beginPath(); ctx.arc(dcx,dcy,r,0,Math.PI*2);
    ctx.fillStyle='#1a2844'; ctx.globalAlpha=0.4; ctx.fill();
    ctx.globalAlpha=1;

    if (elapsed <= i) {
      // Full
      ctx.beginPath(); ctx.arc(dcx,dcy,r,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
    } else if (elapsed < i+1) {
      // Draining — wavy liquid surface inside the circle
      const t = performance.now()/1000;
      const fillH = diam * (1-(elapsed-i));
      const surfY = dcy + r - fillH;
      const urgency = pct < 0.1 ? 2.5 : 1;
      const amp  = Math.min(fillH*0.35, 2.2) * urgency;
      const spd  = pct < 0.1 ? 5 : 3;

      ctx.save();
      ctx.beginPath(); ctx.arc(dcx,dcy,r,0,Math.PI*2); ctx.clip();
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let s=0; s<=12; s++) {
        const wx = dcx - r + s*(diam/12);
        const wy = surfY + Math.sin(s/12*Math.PI*4 + t*spd)*amp;
        s===0 ? ctx.moveTo(wx,wy) : ctx.lineTo(wx,wy);
      }
      ctx.lineTo(dcx+r, dcy+r);
      ctx.lineTo(dcx-r, dcy+r);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── Render: Digital ───────────────────────────────────────────────────────────
function drawDigital(ctx, W, H, pct, col) {
  const fs=Math.min(W*.38,H*.58,110);
  ctx.fillStyle=col; fitFont(ctx, fmt(remaining), W*0.88, fs);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(remaining),W/2,H/2);
}

// ── Render: Clock ─────────────────────────────────────────────────────────────
function drawClock(ctx, W, H, pct, col) {
  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-12;
  if (r<20) return;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#141e30'; ctx.fill();
  ctx.strokeStyle='#1a2844'; ctx.lineWidth=3; ctx.stroke();
  for (let i=0;i<60;i++) {
    const a=(i/60)*Math.PI*2-Math.PI/2, big=i%5===0;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(r-(big?14:8)),cy+Math.sin(a)*(r-(big?14:8)));
    ctx.lineTo(cx+Math.cos(a)*(r-3),cy+Math.sin(a)*(r-3));
    ctx.strokeStyle=big?'#3a5070':'#243354'; ctx.lineWidth=big?2:1; ctx.stroke();
  }
  if (pct>0) {
    const hand=-Math.PI/2+(1-pct)*Math.PI*2, end=Math.PI*3/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r-4,hand,end); ctx.closePath();
    ctx.fillStyle=col+'30'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(hand)*(r-12),cy+Math.sin(hand)*(r-12));
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  const fs=Math.max(11,Math.min(r*.28,26));
  ctx.fillStyle='#f0f4ff'; fitFont(ctx, fmt(remaining), r*1.05, fs, 700);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(remaining),cx,cy+r*.45);
}

// ── Render: Liquid ────────────────────────────────────────────────────────────
function drawLiquid(ctx, W, H, pct, col, state) {
  const cw = Math.max(60, Math.min(W * 0.88, 300));
  const ch = H - 20;
  const cx = W / 2;
  const x0 = cx - cw/2, y0 = 10, pad = 9;
  const ix = x0+pad, iw = cw-pad*2, iy = y0+pad, ih = ch-pad*2;
  const elapsed = 1 - pct;
  const now = performance.now();

  state.drops = state.drops || [];

  // Compact pools — the cascade is the star, not the reservoirs
  const maxPool  = ih * 0.12;
  const topH     = pct * maxPool;
  const botH     = elapsed * maxPool;
  const topSurfY = iy + topH;
  const botSurfY = iy + ih - botH;

  // ── 5 alternating ramps forming the zig-zag ────────────────────────────────
  // Even: anchored to LEFT wall, open end on RIGHT  → drops roll rightward
  // Odd:  anchored to RIGHT wall, open end on LEFT  → drops roll leftward
  // Anchor extends past the wall so the clip cuts it flush (looks attached).
  const gapW  = iw * 0.26;
  const slope = iw * 0.10;
  const fracs = [0.20, 0.34, 0.48, 0.62, 0.76];

  const SHELVES = fracs.map((f, i) => {
    const my = iy + f * ih;
    return (i % 2 === 0)
      ? { ax: ix - 8,       ay: my, bx: ix + iw - gapW, by: my + slope, dir:  1 }
      : { ax: ix + iw + 8,  ay: my, bx: ix + gapW,      by: my + slope, dir: -1 };
  });

  // ── Glass body ─────────────────────────────────────────────────────────────
  rrect(ctx, x0, y0, cw, ch, 20);
  ctx.fillStyle = 'rgba(10,16,30,0.80)';
  ctx.fill();

  ctx.save();
  rrect(ctx, ix, iy, iw, ih, 14);
  ctx.clip();

  // ── Ramps — solid physical ledges ─────────────────────────────────────────
  SHELVES.forEach(s => {
    ctx.lineCap = 'round';
    // Body of the ramp
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by);
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();
    // Wet top edge — thin tint of the timer colour
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay - 3); ctx.lineTo(s.bx, s.by - 3);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.26)';
    ctx.stroke();
  });

  // ── Spawn a steady cascade ────────────────────────────────────────────────
  // Constant rate while running so the motion stays lively the whole time;
  // the pools carry the "how much is left" signal.
  const spawnGap = 170;
  if (running && pct > 0.01 && pct < 0.995 &&
      now - state.lastSpawn > spawnGap && state.drops.length < 44) {
    state.lastSpawn = now;
    const r = 6 + Math.random() * 6;
    state.drops.push({
      x:  ix + iw * (0.16 + Math.random() * 0.44),
      y:  topSurfY + r,
      vx: 0, vy: 0.5 + Math.random() * 0.5, r,
      phase: 'fall',      // 'fall' | 'slide'
      si: 0,              // shelf index to test from
      sp: 0,              // current slide speed
    });
  }

  // ── Update + draw drops ───────────────────────────────────────────────────
  state.drops = state.drops.filter(d => {
    if (d.phase === 'fall') {
      d.vy = Math.min(d.vy + 0.22, 9);
      d.y += d.vy;

      // Land on the first ramp beneath us
      for (let i = d.si; i < SHELVES.length; i++) {
        const s = SHELVES[i];
        const lo = Math.min(s.ax, s.bx), hi = Math.max(s.ax, s.bx);
        if (d.x < lo || d.x > hi) continue;
        const t  = (d.x - s.ax) / (s.bx - s.ax);
        const sy = s.ay + (s.by - s.ay) * t;
        if (d.y + d.r >= sy) {
          d.y = sy - d.r;
          d.vy = 0;
          d.sp = 0.8 + Math.random() * 0.7;
          d.phase = 'slide';
          d.si = i;
          break;
        }
      }

    } else {
      const s = SHELVES[d.si];
      d.sp = Math.min(d.sp + 0.06, 4.2);   // accelerate down the ramp
      d.x += s.dir * d.sp;
      const t = Math.max(0, Math.min(1, (d.x - s.ax) / (s.bx - s.ax)));
      d.y = s.ay + (s.by - s.ay) * t - d.r;
      // Tip off the open end
      if (s.dir > 0 ? d.x >= s.bx : d.x <= s.bx) {
        d.phase = 'fall'; d.vy = 0.4; d.si++;
      }
    }

    // Merge into the bottom pool
    if (d.y - d.r > botSurfY + 2) return false;

    // Teardrop stretch when falling, squash when rolling
    const k  = d.phase === 'fall' ? 1 + Math.min(d.vy * 0.028, 0.32) : 0.86;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r / k, d.r * k, 0, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    // Specular dot
    ctx.beginPath();
    ctx.ellipse(d.x - d.r*0.26, d.y - d.r*0.28, d.r*0.20, d.r*0.24, -0.3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fill();
    return true;
  });

  // ── Pools drawn OVER drops so they emerge from / sink into the liquid ─────
  const tw = now / 620;

  if (topH > 1) {
    ctx.beginPath();
    ctx.moveTo(ix - 2, iy - 4);
    ctx.lineTo(ix + iw + 2, iy - 4);
    ctx.lineTo(ix + iw + 2, topSurfY);
    for (let x = iw; x >= 0; x -= 5) {
      ctx.lineTo(ix + x, topSurfY + Math.sin(x/19 + tw) * 1.7);
    }
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.24)'; ctx.lineWidth = 2; ctx.stroke();
  }

  if (botH > 1) {
    ctx.beginPath();
    ctx.moveTo(ix - 2, botSurfY);
    for (let x = 0; x <= iw; x += 5) {
      ctx.lineTo(ix + x, botSurfY + Math.sin(x/19 - tw) * 1.7);
    }
    ctx.lineTo(ix + iw + 2, iy + ih + 4);
    ctx.lineTo(ix - 2, iy + ih + 4);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.restore();

  // ── Glass outline + edge shimmer ──────────────────────────────────────────
  rrect(ctx, x0, y0, cw, ch, 20);
  ctx.strokeStyle = 'rgba(255,255,255,0.26)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.save();
  rrect(ctx, x0, y0, cw, ch, 20); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(x0 + 11, y0 + 18); ctx.lineTo(x0 + 11, y0 + ch - 18);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}

// ── Render: Cow Abduction ─────────────────────────────────────────────────────
// A discrete counter dressed up as a joke: the herd IS the time remaining, so it
// reads at a glance exactly like Blocks. Cows go left→right, matching the
// reading direction used by the other timers.
const UFO_COWS = 10;

// A chunky, readable cow facing right. (x, y) is the centre of its feet, and h
// is the full height including the head. Two details do the heavy lifting at
// small sizes: legs grouped in front/back pairs (evenly spaced legs read as a
// caterpillar), and a neck wedge tying the head to the shoulder (without it the
// head floats). Verified legible down to ~32px wide, the real in-widget size.
function drawCow(ctx, x, y, w, h, col, tilt) {
  const DARK    = '#0b1120';
  const bx      = x - w / 2;
  const bodyW   = w * 0.68;
  const bodyTop = y - h * 0.78;
  const bodyBot = y - h * 0.26;
  const bodyH   = bodyBot - bodyTop;
  const hw = w * 0.34, hh = h * 0.26;
  const hx = x + w * 0.06, hy = y - h * 0.95;
  const LEGS = [0.14, 0.30, 0.68, 0.84];

  ctx.save();
  if (tilt) { ctx.translate(x, y); ctx.rotate(tilt); ctx.translate(-x, -y); }

  // ── Legs + hooves (behind the body) ──
  const lw    = Math.max(2, w * 0.078);
  const hoofH = Math.max(1.2, h * 0.032);
  ctx.fillStyle = col;
  LEGS.forEach(f => ctx.fillRect(bx + bodyW * f - lw / 2, bodyBot - 1, lw, h * 0.26 + 1));
  ctx.fillStyle = DARK;
  LEGS.forEach(f => ctx.fillRect(bx + bodyW * f - lw / 2, y - hoofH, lw, hoofH));

  // ── Tail + tuft ──
  const tx = bx - w * 0.015, ty = bodyBot + h * 0.08;
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.6, w * 0.040);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx + bodyW * 0.06, bodyTop + bodyH * 0.14);
  ctx.quadraticCurveTo(bx - w * 0.07, bodyTop + bodyH * 0.60, tx, ty);
  ctx.stroke();
  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.ellipse(tx, ty + h * 0.012, w * 0.036, h * 0.046, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Neck wedge, then body ──
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(bx + bodyW * 0.70, bodyTop + bodyH * 0.08);
  ctx.lineTo(hx + hw * 0.10, hy + hh * 0.20);
  ctx.lineTo(hx + hw * 0.40, hy + hh * 1.05);
  ctx.lineTo(bx + bodyW * 0.88, bodyTop + bodyH * 0.60);
  ctx.closePath();
  ctx.fill();

  rrect(ctx, bx, bodyTop, bodyW, bodyH, Math.min(bodyH * 0.40, bodyW * 0.17));
  ctx.fill();

  // ── Head: a rounded skull plus a snout stepping forward and down.
  //    Both in the body colour — a dark muzzle patch reads as a beak, and a
  //    lone nose dot plus an eye reads as two eyes. Shape does the work here,
  //    leaving exactly one dark mark on the face. ──
  ctx.beginPath();                                   // ear, behind the skull
  ctx.ellipse(hx + hw * 0.12, hy + hh * 0.04, hw * 0.17, hh * 0.19, -0.5, 0, Math.PI * 2);
  ctx.fill();
  rrect(ctx, hx, hy, hw * 0.70, hh, hh * 0.40);      // skull
  ctx.fill();
  rrect(ctx, hx + hw * 0.40, hy + hh * 0.30, hw * 0.60, hh * 0.70, hh * 0.32); // snout
  ctx.fill();

  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.arc(hx + hw * 0.34, hy + hh * 0.36, Math.max(0.9, w * 0.024), 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();                                   // nostril, small enough to stay a detail
  ctx.ellipse(hx + hw * 0.88, hy + hh * 0.68, hw * 0.055, hh * 0.09, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Markings — small enough that the colour still dominates ──
  ctx.beginPath();
  ctx.ellipse(bx + bodyW * 0.30, bodyTop + bodyH * 0.36, bodyW * 0.10, bodyH * 0.19, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bx + bodyW * 0.57, bodyTop + bodyH * 0.66, bodyW * 0.072, bodyH * 0.135, 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSaucer(ctx, cx, cy, w, col, phase, scale) {
  const s = scale === undefined ? 1 : scale;
  w *= s;
  const h = w * 0.30;
  const domePath = () => {
    ctx.beginPath();
    ctx.ellipse(cx, cy - h * 0.20, w * 0.27, h * 0.85, 0, Math.PI, 0);
  };
  const hullPath = () => {
    ctx.beginPath();
    ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  };

  // Dome
  domePath();
  ctx.fillStyle = '#3d5273'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.3; ctx.stroke();
  // Glint on the glass
  ctx.save();
  domePath(); ctx.clip();
  ctx.beginPath();
  ctx.ellipse(cx - w * 0.10, cy - h * 0.50, w * 0.05, h * 0.30, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.24)'; ctx.fill();
  ctx.restore();

  // Hull — neutral slate so the green stays the time signal
  hullPath();
  ctx.fillStyle = '#2b3d5e'; ctx.fill();
  // Darker underside gives the disc some thickness
  ctx.save();
  hullPath(); ctx.clip();
  ctx.fillStyle = '#1b2740';
  ctx.fillRect(cx - w / 2, cy + h * 0.05, w, h);
  ctx.restore();
  hullPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Chasing rim lights, in the timer colour
  const N = 5, lit = Math.floor(phase * 6) % N;
  for (let i = 0; i < N; i++) {
    const lx = cx - w * 0.34 + (w * 0.68) * (i / (N - 1));
    ctx.beginPath();
    ctx.arc(lx, cy + h * 0.12, Math.max(1.4, w * 0.032), 0, Math.PI * 2);
    ctx.fillStyle = i === lit ? col : 'rgba(255,255,255,0.16)';
    ctx.fill();
  }

  // Emitter the beam actually comes out of
  ctx.beginPath();
  ctx.ellipse(cx, cy + h * 0.40, w * 0.10, h * 0.17, 0, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();
}

function drawUFOTimer(ctx, W, H, pct, col, state) {
  if (W < 80 || H < 80) return;
  const now     = performance.now();
  const elapsed = 1 - pct;
  const ot      = outroT();                       // 0 unless the finale is playing
  const groundY = H - Math.max(16, H * 0.12);

  // Stable starfield, regenerated only when the widget is resized
  if (!state.stars || state.starW !== W || state.starH !== H) {
    state.starW = W; state.starH = H;
    const n = Math.max(8, Math.round(W * H / 7000));
    state.stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * Math.max(10, groundY - 24),
      r: Math.random() * 1.1 + 0.4,
      a: Math.random() * 0.35 + 0.12,
    }));
  }
  state.stars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fill();
  });

  // Herd geometry
  const marginX = Math.max(14, W * 0.06);
  const spanW   = W - marginX * 2;
  const cowW    = Math.min(spanW / UFO_COWS * 0.90, Math.max(14, H * 0.20));
  const cowH    = cowW * 0.78;
  const cowX    = i => marginX + spanW * ((i + 0.5) / UFO_COWS);

  // Which cow is being taken, and how far along
  const prog   = Math.min(UFO_COWS, elapsed * UFO_COWS);
  const done   = Math.min(UFO_COWS, Math.floor(prog));
  const frac   = Math.min(1, prog - done);
  const active = done < UFO_COWS ? done : -1;

  const TRAVEL  = 0.30;                            // share of the interval spent flying over
  const beaming = active >= 0 && frac >= TRAVEL;
  const riseT   = beaming ? (frac - TRAVEL) / (1 - TRAVEL) : 0;

  // Saucer position — glides to the next cow, then holds while it beams
  let ufoX;
  if (active < 0) {
    ufoX = cowX(UFO_COWS - 1);
  } else if (frac < TRAVEL) {
    const from = active === 0 ? cowX(0) : cowX(active - 1);
    const t = frac / TRAVEL;
    const e = t * t * (3 - 2 * t);                 // smoothstep
    ufoX = from + (cowX(active) - from) * e;
  } else {
    ufoX = cowX(active);
  }
  const hoverY = Math.max(24, groundY - Math.max(64, H * 0.54));
  let ufoY = hoverY + Math.sin(now / 620) * 3;
  let ufoScale = 1;

  // Outro: the saucer hangs a beat, then rockets away
  if (ot > 0) {
    const t = Math.max(0, (ot - 0.30) / 0.70);
    ufoY -= t * t * (hoverY + H * 0.5);
    ufoScale = Math.max(0.15, 1 - t * 0.7);
  }

  const ufoW = Math.max(38, Math.min(W * 0.26, cowW * 3.0));

  // ── Tractor beam ────────────────────────────────────────────────────────────
  if (beaming && ot === 0) {
    const halfTop = ufoW * 0.10, halfBot = cowW * 0.85;
    const beamTop = ufoY + ufoW * 0.12;   // matches the saucer's emitter
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ufoX - halfTop, beamTop);
    ctx.lineTo(ufoX + halfTop, beamTop);
    ctx.lineTo(ufoX + halfBot, groundY);
    ctx.lineTo(ufoX - halfBot, groundY);
    ctx.closePath();
    ctx.fillStyle = col + '2b';
    ctx.fill();
    // Scan lines travelling up the beam
    ctx.clip();
    ctx.strokeStyle = col + '55';
    ctx.lineWidth = 2;
    const span = groundY - ufoY;
    for (let k = 0; k < 5; k++) {
      const p  = ((now / 700 + k / 5) % 1);
      const yy = groundY - p * span;
      const hw = halfTop + (halfBot - halfTop) * ((yy - ufoY) / span);
      ctx.beginPath(); ctx.moveTo(ufoX - hw, yy); ctx.lineTo(ufoX + hw, yy); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Ground ──────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#1a2844';
  ctx.fillRect(0, groundY, W, H - groundY);

  // Grass tufts, laid out once and reused so they don't shimmer between frames
  if (!state.tufts || state.tuftW !== W) {
    state.tuftW = W;
    const n = Math.max(8, Math.round(W / 24));
    state.tufts = Array.from({ length: n }, (_, i) => ({
      x: (i + 0.5) * (W / n) + (Math.random() - 0.5) * (W / n) * 0.7,
      h: 3 + Math.random() * 5,
      lean: (Math.random() - 0.5) * 2.4,
    }));
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  state.tufts.forEach(t => {
    ctx.moveTo(t.x, groundY + 1);
    ctx.lineTo(t.x + t.lean, groundY - t.h);
  });
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

  // ── The herd ────────────────────────────────────────────────────────────────
  for (let i = 0; i < UFO_COWS; i++) {
    if (i < done) continue;                        // already taken
    if (i === active && beaming) {
      // Rising up the beam: eases off the ground, tumbles, shrinks into the hull
      const lift = riseT * riseT * (3 - 2 * riseT);            // smoothstep
      const y  = groundY + (ufoY + ufoW * 0.12 - groundY) * lift;
      const x  = cowX(i) + (ufoX - cowX(i)) * lift;
      const sc = 1 - lift * 0.42;
      const wob = Math.sin(riseT * 13) * 0.5 * Math.min(1, riseT * 2.2);
      ctx.save();
      ctx.globalAlpha = riseT > 0.82 ? Math.max(0, (1 - riseT) / 0.18) : 1;
      drawCow(ctx, x, y, cowW * sc, cowH * sc, col, wob);
      ctx.restore();
    } else {
      // Grazing: a gentle idle bob keeps the herd alive
      const bob = Math.sin(now / 900 + i * 1.7) * (cowH * 0.02);
      drawCow(ctx, cowX(i), groundY + bob, cowW, cowH, col, 0);
    }
  }

  // ── Saucer ──────────────────────────────────────────────────────────────────
  drawSaucer(ctx, ufoX, ufoY, ufoW, col, now / 260, ufoScale);
}

// ── Render: Hourglass — curved glass, dome sand pile, stream ─────────────────
function drawHourglass(ctx, W, H, pct, col, state) {
  const cx   = W / 2;
  const capH = 16;
  const PAD  = 32;
  const y0   = PAD;
  const bot  = H - PAD;
  const mid  = (y0 + bot) / 2;
  const topH = mid - y0;
  const botH = bot - mid;

  // Glass dimensions — wide bulges, very narrow neck for drama
  const halfW = Math.min(W * 0.46, 110);
  const neck  = 3.5;

  // ── Glass path — classic hourglass curves ─────────────────────────────────
  // Each half: stays wide, then sweeps sharply to the neck at the midpoint.
  // Two bezier segments per side. cp1 keeps the wall wide, cp2 arrives at neck.
  function glassPath() {
    ctx.beginPath();
    ctx.moveTo(cx - halfW, y0);
    ctx.lineTo(cx + halfW, y0);

    // Right: top → neck
    ctx.bezierCurveTo(
      cx + halfW,      y0 + topH * 0.50,   // stay wide through the upper half
      cx + neck + 10,  mid - topH * 0.05,  // curve hard to neck near the waist
      cx + neck,       mid
    );
    // Right: neck → bottom
    ctx.bezierCurveTo(
      cx + neck + 10,  mid + botH * 0.05,
      cx + halfW,      bot - botH * 0.50,
      cx + halfW,      bot
    );

    ctx.lineTo(cx - halfW, bot);

    // Left: bottom → neck
    ctx.bezierCurveTo(
      cx - halfW,      bot - botH * 0.50,
      cx - neck - 10,  mid + botH * 0.05,
      cx - neck,       mid
    );
    // Left: neck → top
    ctx.bezierCurveTo(
      cx - neck - 10,  mid - topH * 0.05,
      cx - halfW,      y0 + topH * 0.50,
      cx - halfW,      y0
    );

    ctx.closePath();
  }

  const elapsed = 1 - pct;

  // ── Glass interior (dark, semi-transparent) ───────────────────────────────
  glassPath();
  ctx.fillStyle = 'rgba(10, 16, 30, 0.88)';
  ctx.fill();

  // ── Clip sand to glass shape ──────────────────────────────────────────────
  ctx.save();
  glassPath();
  ctx.clip();

  // Top sand — level drops as time runs out
  // pct=1 → surface at y0 (full); pct=0 → surface at mid (empty)
  const y_top = y0 + elapsed * topH;
  if (pct > 0.003) {
    ctx.fillStyle = col;
    ctx.fillRect(cx - halfW - 2, y_top, halfW * 2 + 4, mid - y_top + 2);
    // Crisp surface highlight
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillRect(cx - halfW + 6, y_top, halfW * 2 - 12, 2.5);
  }

  // Bottom sand pile — grows upward as elapsed increases
  const pile_h    = elapsed * botH * 0.90;
  const y_pile    = bot - pile_h;
  const dome_rise = Math.min(pile_h * 0.22, 16);

  if (elapsed > 0.003) {
    ctx.fillStyle = col;
    ctx.fillRect(cx - halfW - 2, y_pile, halfW * 2 + 4, bot - y_pile + 2);
    // Domed top surface — sand settles in a natural mound
    ctx.beginPath();
    ctx.moveTo(cx - halfW - 2, y_pile);
    ctx.quadraticCurveTo(cx, y_pile - dome_rise, cx + halfW + 2, y_pile);
    ctx.fill();
    // Subtle ridge along the dome crest
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 0.45, y_pile - dome_rise * 0.38);
    ctx.quadraticCurveTo(cx, y_pile - dome_rise - 1, cx + halfW * 0.45, y_pile - dome_rise * 0.38);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // ── Sand stream through the neck ─────────────────────────────────────────
  if (running && pct > 0.012 && pct < 0.99) {
    const streamEnd = elapsed > 0.003 ? y_pile - dome_rise : bot - 4;
    // Solid continuous stream — no dash
    ctx.beginPath();
    ctx.moveTo(cx, mid + 1);
    ctx.lineTo(cx, streamEnd);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.setLineDash([]);
    ctx.stroke();
  }

  // ── Falling sand grains ───────────────────────────────────────────────────
  const now = performance.now();
  if (running && pct > 0.012 && pct < 0.995) {
    if (now - state.lastSpawn > 55) {
      state.lastSpawn = now;
      for (let i = 0; i < 3; i++) {
        state.grains.push({
          x:  cx + (Math.random() - 0.5) * neck * 1.8,
          y:  mid + 3,
          vy: 1.8 + Math.random() * 2.2,
          r:  1.2 + Math.random() * 1.0,
        });
      }
    }
  }
  const grainStop = elapsed > 0.003 ? y_pile - dome_rise - 1 : bot - 2;
  state.grains = state.grains.filter(g => {
    g.vy += 0.32;
    g.y  += g.vy;
    if (g.y >= grainStop) return false;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    return true;
  });

  ctx.restore();

  // ── Glass walls — bright crisp outline ────────────────────────────────────
  glassPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // ── Left-edge highlight — makes the glass read as glassy ─────────────────
  ctx.save();
  glassPath();
  ctx.clip();
  // Left inner edge of top bulge
  ctx.beginPath();
  ctx.moveTo(cx - halfW + 9, y0 + 10);
  ctx.bezierCurveTo(
    cx - halfW + 9, y0 + topH * 0.48,
    cx - neck - 7,  mid - topH * 0.05,
    cx - neck + 1,  mid
  );
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();
  // Right-edge secondary highlight (fainter)
  ctx.beginPath();
  ctx.moveTo(cx + halfW - 6, y0 + 10);
  ctx.bezierCurveTo(
    cx + halfW - 6, y0 + topH * 0.40,
    cx + neck + 6,  mid - topH * 0.08,
    cx + neck - 1,  mid
  );
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.restore();

  // ── End caps ─────────────────────────────────────────────────────────────
  const capW = halfW * 2 + 16;
  const capX = cx - capW / 2;
  ctx.fillStyle = '#1e2e42';
  ctx.strokeStyle = 'rgba(255,255,255,0.24)';
  ctx.lineWidth = 1.5;
  rrect(ctx, capX, y0 - capH, capW, capH, 7); ctx.fill(); ctx.stroke();
  rrect(ctx, capX, bot,       capW, capH, 7); ctx.fill(); ctx.stroke();
  // Cap top highlights
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rrect(ctx, capX + 4, y0 - capH + 2, capW - 8, capH * 0.45, 4); ctx.fill();
  rrect(ctx, capX + 4, bot + 2,        capW - 8, capH * 0.45, 4); ctx.fill();
}

// ── Timer logic ───────────────────────────────────────────────────────────────
const doneBanner = document.getElementById('done-banner');
const startBtn    = document.getElementById('start-btn');
const soundCheck  = document.getElementById('sound-check');
const soundSelect = document.getElementById('sound-select');
const digitTimer  = document.getElementById('digit-timer');
const dgtEls      = [0,1,2,3,4,5].map(i => document.getElementById(`d${i}`));

const MAX_SECONDS = 99 * 3600 + 59 * 60 + 59; // 99:59:59

// ── Outro phase ───────────────────────────────────────────────────────────────
// Narrative widgets need a beat after zero to finish their story (the saucer
// flying off, etc). The chime still fires exactly at zero; only the done-banner
// waits. Timers with no narrative widget on the board are unaffected.
const OUTRO_MS    = 2500;
const OUTRO_TYPES = new Set(['ufo']);
let   outroStart  = 0;               // timestamp the outro began, 0 when idle

// 0 → 1 across the outro; 0 when no outro is playing.
function outroT() {
  if (!outroStart) return 0;
  return Math.min(1, (performance.now() - outroStart) / OUTRO_MS);
}

function finishTimer() {
  outroStart = 0;
  doneBanner.style.display = 'block';
  setInputsDisabled(false);
  startBtn.textContent = '▶ Start';
}

let _lastDigitSec = -1;
function updateDigits(secs) {
  // When called without an argument, show the set duration (edit mode)
  const val = (secs !== undefined) ? secs : totalSeconds;
  const h = Math.floor(val / 3600);
  const m = Math.floor(val / 60) % 60;
  const s = val % 60;
  dgtEls[0].textContent = Math.floor(h / 10);
  dgtEls[1].textContent = h % 10;
  dgtEls[2].textContent = Math.floor(m / 10);
  dgtEls[3].textContent = m % 10;
  dgtEls[4].textContent = Math.floor(s / 10);
  dgtEls[5].textContent = s % 10;

  // Dim leading zeros so the active units read first: 00:05:00
  const lead = [h < 10, h === 0, h === 0 && m < 10, false, false, false];
  dgtEls.forEach((el, i) => el.classList.toggle('leading', lead[i]));
}

function stopTimer() {
  pausedElapsed = getElapsed(); // save where we paused
  running = false; startStamp = null;
  _lastDigitSec = -1;
}

function setDuration(secs) {
  running = false; startStamp = null; pausedElapsed = 0; outroStart = 0;
  totalSeconds = Math.max(1, Math.min(secs, MAX_SECONDS));
  remaining = totalSeconds;
  doneBanner.style.display = 'none';
  startBtn.textContent = '▶ Start';
  updateDigits();
}

// Wire up each +/− button
document.querySelectorAll('.dbt').forEach(btn => {
  btn.addEventListener('click', () => setDuration(totalSeconds + parseInt(btn.dataset.delta)));
});
// ── Sound library ─────────────────────────────────────────────────────────────
const SOUNDS = {
  // Friendly ascending chime — good for primary classrooms
  chime(ac) {
    const t = ac.currentTime;
    [[523,0,.5],[659,.28,.55],[784,.56,.7],[1046,.85,.9]].forEach(([f,s,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+s);
      g.gain.linearRampToValueAtTime(.9,t+s+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.start(t+s); o.stop(t+s+d+.1);
    });
  },

  // Rich school bell with harmonics + long sustain
  bell(ac) {
    const t=ac.currentTime;
    [[440,1],[880,.5],[1320,.25],[1760,.12],[2200,.06]].forEach(([f,amp])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(amp,t+.01);
      g.gain.exponentialRampToValueAtTime(.001,t+3.0);
      o.start(t); o.stop(t+3.1);
    });
  },

  // Single crisp high ding
  ding(ac) {
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sine'; o.frequency.value=1318; // E6
    g.gain.setValueAtTime(1.0,t);
    g.gain.exponentialRampToValueAtTime(.001,t+2.2);
    o.start(t); o.stop(t+2.3);
  },

  // Urgent repeating alarm beeps
  alarm(ac) {
    const t=ac.currentTime;
    for(let i=0;i<6;i++){
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(.8,t+i*.22);
      g.gain.setValueAtTime(0,t+i*.22+.16);
      o.start(t+i*.22); o.stop(t+i*.22+.18);
    }
  },

  // Triumphant fanfare — great for celebrations
  fanfare(ac) {
    const t=ac.currentTime;
    [[523,.0,.14],[523,.15,.14],[523,.3,.14],[659,.44,.32],[523,.76,.14],
     [659,.91,.32],[784,1.24,1.0]].forEach(([f,s,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.85,t+s);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.start(t+s); o.stop(t+s+d+.05);
    });
  },

  // Game-show style buzzer
  buzzer(ac) {
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sawtooth'; o.frequency.value=180;
    g.gain.setValueAtTime(.9,t);
    g.gain.setValueAtTime(.9,t+.85);
    g.gain.exponentialRampToValueAtTime(.001,t+1.1);
    o.start(t); o.stop(t+1.2);
  },
};

function playSound(name) {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    SOUNDS[name]?.(ac);
  } catch(e) {}
}

function playDone() {
  if (!soundCheck.checked) return;
  playSound(soundSelect.value);
}

document.getElementById('preview-sound').addEventListener('click', () => {
  playSound(soundSelect.value);
});

function setInputsDisabled(disabled) {
  document.querySelectorAll('.dbt').forEach(b => b.disabled = disabled);
  digitTimer.classList.toggle('disabled', disabled);
}

startBtn.addEventListener('click', () => {
  if (getPreciseRemaining() <= 0) return;
  if (running) {
    stopTimer(); // saves pausedElapsed
    startBtn.textContent = '▶ Resume';
    setInputsDisabled(false);
  } else {
    doneBanner.style.display = 'none'; outroStart = 0;
    startStamp = performance.now(); running = true;
    setInputsDisabled(true);
    startBtn.textContent = '⏸ Pause';
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  running = false; startStamp = null; pausedElapsed = 0; outroStart = 0;
  remaining = totalSeconds;
  widgets.forEach(w => { w.state.drops = []; w.state.grains = []; });
  doneBanner.style.display = 'none'; startBtn.textContent = '▶ Start';
  setInputsDisabled(false);
  // The RAF loop only drives the digits while running, so put them back by hand
  _lastDigitSec = -1;
  updateDigits();
});

doneBanner.addEventListener('click', () => doneBanner.style.display = 'none');
