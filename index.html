  'SSSSSSSS',
  'SS    SS',
  'S      S',
];

// Shared pixel blitter — used by Maze Muncher and Mushroom Wood.
// dir: 0 right, 1 down, 2 left, 3 up. Transposes and mirrors on the sprite grid,
// so pixels stay square and aligned instead of being rotated into mush.
function pxBlit(ctx, rows, pal, cx, cy, px, dir) {
  const n = rows.length, h = n / 2;
  for (let r = 0; r < n; r++) {
    const line = rows[r];
    for (let c = 0; c < line.length; c++) {
      const col = pal[line[c]];
      if (!col) continue;
      const a = c - h, b = r - h;                   // sprite space, origin centre
      let x, y;
      if (dir === 0)      { x =  a; y =  b; }
      else if (dir === 1) { x = -b; y =  a; }
      else if (dir === 2) { x = -a; y =  b; }        // mirrored, not rotated
      else                { x =  b; y = -a; }
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(cx + x * px), Math.round(cy + y * px),
                   Math.ceil(px), Math.ceil(px));
    }
  }
}

// Fallback for the unlikely case drawMaze is called without a state object —
// without it the seed would be re-rolled every frame and the maze would flicker.
const mzOrphan = {};

function mzPrng(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

const mzCache = new Map();
function mzBuild(cw, ch, seed) {
  const key = cw + 'x' + ch + '#' + seed;
  if (mzCache.has(key)) return mzCache.get(key);
  if (mzCache.size > 12) mzCache.clear();      // mazes are cheap to rebuild

  // Recursive-backtracker maze: proper branches and dead ends. The seed is
  // picked once per timer and kept, so the layout is fixed for a whole run — it
  // has to be, or the maze would redraw itself every frame — but a new run gets
  // a new maze. That is configuration, not animation state: given the seed,
  // every position here is still a pure function of pct, so seeking and video
  // export stay exact.
  const rnd = mzPrng(seed * 2654435761 + cw * 7919 + ch * 104729);
  const ix = (c, r) => r * cw + c;
  const open = Array.from({ length: cw * ch }, () => ({}));
  const seen = new Array(cw * ch).fill(false);
  const stack = [[0, 0]];
  seen[0] = true;
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const opts = MZ_DIRS.filter(([dc, dr]) => {
      const nc = c + dc, nr = r + dr;
      return nc >= 0 && nr >= 0 && nc < cw && nr < ch && !seen[ix(nc, nr)];
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dc, dr, a, b] = opts[Math.floor(rnd() * opts.length)];
    const nc = c + dc, nr = r + dr;
    open[ix(c, r)][a] = true; open[ix(nc, nr)][b] = true;
    seen[ix(nc, nr)] = true;
    stack.push([nc, nr]);
  }

  // Depth-first walk, retracing out of each dead end.
  const route = [], first = new Map();
  const walk = (c, r, back) => {
    const k = c + ',' + r;
    if (!first.has(k)) first.set(k, route.length);
    route.push([2 * c + 1, 2 * r + 1]);
    for (const [dc, dr, a, b] of MZ_DIRS) {
      if (!open[ix(c, r)][a] || a === back) continue;
      route.push([2 * c + 1 + dc, 2 * r + 1 + dr]);
      walk(c + dc, r + dr, b);
      route.push([2 * c + 1 + dc, 2 * r + 1 + dr]);
      route.push([2 * c + 1, 2 * r + 1]);
    }
  };
  walk(0, 0, null);

  // The tour ends by retracing all the way home, and that return trip has no new
  // dots in it — on a short timer that left half the video with an empty maze.
  // Cut the route at the final new cell so the last dot goes at exactly zero.
  let last = 0;
  first.forEach(i => { if (i > last) last = i; });
  route.length = last + 1;

  const m = { cw, ch, open, route, first, ix, tw: 2 * cw + 1, th: 2 * ch + 1, ev: null };
  mzCache.set(key, m);
  return m;
}

function mzOpen(m, tc, tr) {
  if (tc < 0 || tr < 0 || tc >= m.tw || tr >= m.th) return false;
  const oc = tc % 2 === 1, or = tr % 2 === 1;
  if (oc && or) return true;
  if (!oc && !or) return false;
  if (oc) {
    const c = (tc - 1) / 2, r = tr / 2 - 1;
    return r >= 0 && r + 1 < m.ch && !!m.open[m.ix(c, r)].S;
  }
  const r = (tr - 1) / 2, c = tc / 2 - 1;
  return c >= 0 && c + 1 < m.cw && !!m.open[m.ix(c, r)].E;
}

// Route index of a drone at elapsed fraction s. Independent of wall clock, so
// encounters happen at the same point of every run.
function mzDroneIdx(m, d, s) {
  const L = m.route.length;
  const amp = L * d.period / 4;                // slope = 4*amp/period = L for all
  let g = d.base * L + amp * mzTri(s / d.period + d.ph);

  // Actually flee. The bot's route position at any elapsed fraction is just
  // s*(L-1), so a drone reacting to it stays closed-form — no history, no
  // per-frame state, still exact under seeking and export.
  //
  // The dodge is deliberately BOUNDED. The bot advances the whole route over the
  // run, so a bounded sidestep means it always gets overtaken in the end: the
  // drone backs off, runs out of room, and is caught. Unbounded fleeing would
  // mean nothing was ever caught and the timer would lose its best moment.
  // The dodge has to be CONTINUOUS. The first version used Math.sign(gap), so
  // the instant the bot's position crossed the drone's, the offset flipped from
  // +push to -push — a jump of 37 to 63 route units, which on screen was the
  // drone teleporting across several corridors and appearing to land on top of
  // the bot. x*(1-x²) is odd, peaks mid-range, and returns to zero both at
  // contact and at the edge of awareness, so there is no step anywhere.
  const see = L * MZ_SEE;
  const x = (g - s * (L - 1)) / see;
  if (Math.abs(x) < 1) g += x * (1 - x * x) * see * d.nerve * 2.6;
  return Math.max(0, Math.min(L - 1, g));
}

// When does the bot catch each drone? Solved once per maze by sweeping the
// timeline in tile space (not pixels, so the answer is resolution-independent).
function mzEvents(m) {
  if (m.ev) return m.ev;
  const L = m.route.length;
  const ev = MZ_DRONES.map(() => []);
  const steps = Math.max(3000, L * 10);
  const cool = MZ_DRONES.map(() => -1);
  for (let k = 0; k <= steps; k++) {
    const s = k / steps;
    const b = m.route[Math.round(s * (L - 1))];
    MZ_DRONES.forEach((d, i) => {
      if (s < cool[i]) return;
      const g = m.route[Math.round(mzDroneIdx(m, d, s))];
      if (Math.abs(b[0] - g[0]) + Math.abs(b[1] - g[1]) <= 1) {
        ev[i].push(s);
        cool[i] = s + 0.03;                    // don't re-trigger the same catch
      }
    });
  }
  m.ev = ev;
  return ev;
}

// ── Maze audio ───────────────────────────────────────────────────────────────
// Sounds are defined once, as PCM synthesis, and used two ways: played live on
// the site, and rendered into the exported video's audio track. Defining them as
// oscillator graphs would have meant writing them twice and letting the two
// drift apart, which is exactly the sort of thing nobody notices until a video
// sounds different from the site.
const MZ_SR  = 48000;
const MZ_SFX = {
  // Soft two-note rise as the timer starts. Quiet enough to be a cue, not an
  // announcement.
  start:  { dur: 0.20, amp: 0.10,
            freq: u => (u < 0.5 ? 392 : 523),
            env:  u => { const k = (u * 2) % 1; return Math.min(1, k / 0.10) * Math.pow(1 - k, 1.3); } },

  // Catching a drone. Crunch comes from three things together: a mostly-noise
  // mix, a hard downward pitch sweep, and bitcrushing — a clean square sweep
  // read as a polite "boop" no matter how it was tuned.
  munch:  { dur: 0.26, amp: 0.24, nz: 0.58, crushHz: 5200,
            freq: u => 320 - 250 * u,
            env:  u => { const k = (u * 2) % 1;          // two bites
                         return Math.min(1, k / 0.02) * Math.pow(1 - k, 1.7) * (1 - u * 0.55); } },

  // A sheep reaching the barn. Two bleats, the second lower — the same shape as
  // the site's existing baa chime, ported to PCM so it lands in the exported
  // track too. The waver is the whole thing: a steady tone at this pitch is a
  // buzz, and it's the vibrato that says sheep.
  baa:    { dur: 0.72, amp: 0.19, wave: 'saw', lp: 1100, nz: 0.02,
            freq: u => {
              const p = u < 0.44, k = p ? u / 0.44 : (u - 0.44) / 0.56;
              const f0 = p ? 415 : 392, f1 = p ? 350 : 330;
              return f0 + (f1 - f0) * k + 13 * Math.sin(k * Math.PI * 2 * (p ? 7.5 : 9));
            },
            env:  u => {
              const p = u < 0.44, k = p ? u / 0.44 : (u - 0.44) / 0.56;
              return Math.min(1, k / 0.14) * Math.pow(1 - k, 1.5);
            } },

  // A cow going up in the beam. Low and long, and the rise-then-fall contour is
  // what separates a moo from a foghorn.
  moo:    { dur: 1.05, amp: 0.20, wave: 'saw', lp: 620, nz: 0.04,
            freq: u => {
              const base = u < 0.22 ? 118 + 46 * (u / 0.22)
                         : u < 0.68 ? 164 - 10 * ((u - 0.22) / 0.46)
                         :            154 - 44 * ((u - 0.68) / 0.32);
              return base + 4.5 * Math.sin(u * Math.PI * 2 * 5.5);
            },
            env:  u => Math.min(1, u / 0.10) * Math.min(1, (1 - u) / 0.18) },

  // Passing a trail marker: a soft two-step rise, quieter than the start cue.
  mark:   { dur: 0.13, amp: 0.09, crushHz: 11000,
            freq: u => (u < 0.5 ? 494 : 659),
            env:  u => { const k = (u * 2) % 1; return Math.min(1, k / 0.08) * Math.pow(1 - k, 1.5); } },

  // ── Asteroid Blaster ──────────────────────────────────────────────────────
  // One cue per impact, pitched by what broke, so the ear can follow progress
  // without looking: big rocks are rare and low, small ones frequent and high,
  // and the run audibly lightens as the field empties.
  //
  // Each is three voices rather than one. A single oscillator plus noise makes a
  // blip; a rock coming apart needs a low BODY for the weight, a filtered noise
  // BLAST for the hit itself, and a scatter of DEBRIS trailing off after it.
  // The blast layers use the resonant filter (q) with a falling cutoff — that
  // downward sweep is most of what makes it read as an impact rather than a
  // burst of static.

  // Firing. Happens S times a run, once per shot, so it has to be almost
  // subliminal — this is the quietest cue on the site.
  shoot:  { dur: 0.10, layers: [
            { dur: 0.09, wave: 'tri', amp: 0.040, lp: 3800, crushHz: 11000,
              freq: u => 1500 - 1080 * u,
              env:  u => Math.min(1, u / 0.006) * Math.pow(1 - u, 3.0) },
            { dur: 0.04, nz: 1, q: 1.1, lp: 5200, amp: 0.020,
              freq: () => 0, env: u => Math.pow(1 - u, 4) },
          ] },

  // A large breaking up. The body drops nearly two octaves in 0.7s, which is
  // what gives it weight without needing volume.
  thud:   { dur: 0.85, layers: [
            { dur: 0.70, wave: 'sine', amp: 0.115, lp: 400,
              freq: u => 150 * Math.exp(-2.6 * u) + 34,
              env:  u => Math.min(1, u / 0.004) * Math.pow(1 - u, 2.1) },
            { dur: 0.55, nz: 1, q: 1.25, amp: 0.085,
              lp: 3200, lpAt: u => 3200 * Math.exp(-3.2 * u) + 240,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.002) * Math.pow(1 - u, 2.4) },
            { dur: 0.85, nz: 1, sparse: 0.50, lp: 5200, amp: 0.055, crushHz: 9000,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.05) * Math.pow(1 - u, 1.5) },
          ] },

  // A medium splitting: shorter, drier, a crack rather than a boom.
  crack:  { dur: 0.50, layers: [
            { dur: 0.36, wave: 'sine', amp: 0.075, lp: 900,
              freq: u => 340 * Math.exp(-3.0 * u) + 95,
              env:  u => Math.min(1, u / 0.003) * Math.pow(1 - u, 2.3) },
            { dur: 0.30, nz: 1, q: 1.1, amp: 0.075,
              lp: 5200, lpAt: u => 5200 * Math.exp(-3.6 * u) + 700,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.0015) * Math.pow(1 - u, 2.6) },
            { dur: 0.50, nz: 1, sparse: 0.34, lp: 7000, amp: 0.035, crushHz: 10000,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.04) * Math.pow(1 - u, 1.7) },
          ] },

  // A small going. This fires most often of the three, so it stays the quietest
  // and the shortest — it has to survive being heard a hundred times.
  tick:   { dur: 0.26, layers: [
            { dur: 0.13, nz: 1, q: 0.95, amp: 0.055,
              lp: 7000, lpAt: u => 7000 * Math.exp(-4.0 * u) + 1500,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.001) * Math.pow(1 - u, 3.0) },
            { dur: 0.12, wave: 'tri', amp: 0.026, lp: 3000,
              freq: u => 880 - 330 * u,
              env:  u => Math.min(1, u / 0.004) * Math.pow(1 - u, 3.2) },
            { dur: 0.26, nz: 1, sparse: 0.22, lp: 8000, amp: 0.020, crushHz: 11000,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.03) * Math.pow(1 - u, 2.0) },
          ] },

  // Hull against rock. Metallic and short: two detuned square voices a tritone
  // apart give the clang, and the noise layer underneath is the scrape. It has
  // to cut through whatever else is sounding, because it means something went
  // wrong — but it is still a classroom timer, so it stays under the finale.
  clank:  { dur: 0.34, layers: [
            { dur: 0.26, wave: 'square', amp: 0.075, lp: 5200, crushHz: 8000,
              freq: u => 520 - 140 * u,
              env:  u => Math.min(1, u / 0.002) * Math.pow(1 - u, 2.6) },
            { dur: 0.30, wave: 'square', amp: 0.055, lp: 6000, crushHz: 7000,
              freq: u => 735 - 200 * u,
              env:  u => Math.min(1, u / 0.002) * Math.pow(1 - u, 3.0) },
            { dur: 0.34, nz: 1, q: 1.0, amp: 0.05,
              lp: 4200, lpAt: u => 4200 * Math.exp(-3.0 * u) + 500,
              freq: () => 0,
              env:  u => Math.min(1, u / 0.001) * Math.pow(1 - u, 2.2) },
          ] },

  // Three-note arpeggio at zero, lightly crushed for the 8-bit character.
  finale: { dur: 0.54, amp: 0.14, crushHz: 9000,
            freq: u => (u < 0.33 ? 523 : u < 0.66 ? 659 : 784),
            env:  u => { const k = (u * 3) % 1; return Math.min(1, k / 0.04) * Math.pow(1 - k, 1.4); } },
};

// Square wave by integrating phase per sample rather than taking the sign of a
// sine — with a sweeping frequency the latter jumps phase and clicks.
//
// Noise comes from a fixed-seed LCG, not Math.random: the export has to be
// reproducible, so two renders of one video produce identical audio. crushHz
// holds each output value for several samples, which is what gives the grit.
// A cue is either one voice (the original shape) or several stacked in a
// `layers` array. Stacking is what an impact needs: a low body for the weight, a
// filtered noise burst for the hit, and a scatter of debris after it. One
// oscillator plus noise can make a blip but never a rock breaking apart.
//
// A cue with no `layers` is rendered as a single layer through the same code,
// so every sound written before this stays bit-identical.
function mzRenderSfx(name, out, startFrame, sr, pitch) {
  const f = MZ_SFX[name];
  if (!f) return;
  const layers = f.layers || [f];
  for (let L = 0; L < layers.length; L++)
    mzRenderVoice(layers[L], out, startFrame, sr, pitch, f.dur, L);
}

function mzRenderVoice(f, out, startFrame, sr, pitch, cueDur, idx) {
  const dur  = f.dur || cueDur;
  const n    = Math.ceil(dur * sr);
  const skip = Math.round((f.at || 0) * sr);        // delay within the cue
  const hold = f.crushHz ? Math.max(1, Math.round(sr / f.crushHz)) : 1;
  const nz   = f.nz || 0;
  const saw  = f.wave === 'saw';
  const sine = f.wave === 'sine';
  const tri  = f.wave === 'tri';
  // One-pole lowpass, unless q is set — then a two-pole state-variable filter,
  // which is what gives a noise burst a throat instead of a hiss. lp unset
  // leaves k = 1 and the one-pole path is untouched, so legacy cues are exact.
  const k  = f.lp ? Math.min(1, 2 * Math.PI * f.lp / sr) : 1;
  const svf = f.q !== undefined;
  // Each layer gets its own noise stream, or two noise layers in one cue would
  // be the same signal twice and just sound louder instead of denser.
  let phase = 0, rng = (0x2545f491 + idx * 0x9e3779b9) >>> 0;
  let val = 0, left = 0, lpz = 0, low = 0, band = 0;
  for (let i = 0; i < n; i++) {
    const j = startFrame + skip + i;
    const u = i / n;
    phase += f.freq(u) * (pitch || 1) / sr;         // advance every sample
    if (left <= 0) {
      rng = (rng * 1664525 + 1013904223) >>> 0;
      let noise = (rng / 4294967296) * 2 - 1;
      // Debris: gate the noise down to sparse impulses whose density falls off.
      // Continuous noise reads as a hiss; scattered clicks read as fragments.
      if (f.sparse) {
        rng = (rng * 1664525 + 1013904223) >>> 0;
        const density = f.sparse * (1 - u) * (1 - u);
        noise = (rng / 4294967296) < density ? noise : 0;
      }
      const ph = phase % 1;
      const tone = sine ? Math.sin(ph * 6.283185)
                 : tri  ? 4 * Math.abs(ph - 0.5) - 1
                 : saw  ? ph * 2 - 1
                 :        (ph < 0.5 ? 1 : -1);
      val  = tone * (1 - nz) + noise * nz;
      left = hold;
    }
    left--;
    let y;
    if (svf) {
      // Clamped: the SVF goes unstable as fc approaches 1, and a bright layer
      // with a low q can get there. An exploding filter is a loud click.
      const fc = Math.min(0.85, 2 * Math.sin(Math.PI * Math.min(0.45, (f.lpAt ? f.lpAt(u) : f.lp) / sr)));
      low  += fc * band;
      band += fc * (val - low - f.q * band);
      y = low;
    } else {
      lpz += (val - lpz) * k;
      y = lpz;
    }
    if (j >= 0 && j < out.length) out[j] += y * f.env(u) * f.amp;
  }
}

// Every sound in a run, as seconds from the start. A pure function of the maze
// and the duration, so the exported track lines up with what the site plays.
function mzSoundTrack(m, secs, oneLife) {
  const key = 'trk' + secs + (oneLife ? 'x' : '');
  if (m[key]) return m[key];
  const ev = [{ t: 0, name: 'start', pitch: 1 }];
  mzEvents(m).forEach((list, i) => {
    const hits = oneLife ? list.slice(0, 1) : list;   // one life, one crunch
    hits.forEach(s => ev.push({ t: s * secs, name: 'munch', pitch: MZ_DRONES[i].pitch }));
  });
  ev.push({ t: secs, name: 'finale', pitch: 1 });
  ev.sort((a, b) => a.t - b.t);
  m[key] = ev;
  return ev;
}

// ── Recorded samples ─────────────────────────────────────────────────────────
// A cue can have SEVERAL recordings, and which one plays depends on WHICH animal
// it is, so ten sheep don't all bleat identically. Empty until you add files with
// add-sound.py; any cue without one falls back to its synthesised version, so
// the timers always have sound.
//
// Inlined as base64 rather than loaded from a /sounds/ folder: it keeps the site
// a single file with no extra requests and no missing-file failure mode. A short
// mono clip is only a few KB.
const MZ_WAV = {
  // start: ['data:...'],   (using the synthesised version)

// Cues that play for as long as something is on screen instead of as a one-shot.
// The recording is a seamless loop, repeated to fill the window.
const MZ_SUSTAIN = new Set(['beam']);

// Decoded sample data, filled in on first use.
const mzPCM = {};            // name -> [Float32Array, ...] at the context rate
let   mzPCMrate = 0;

// Decoding is async and the draw loop isn't, so kick it off once up front and
// let the synth cover until it lands.
function mzLoadSamples(ac) {
  Object.keys(MZ_WAV).forEach(name => {
    if (mzPCM[name] !== undefined) return;
    mzPCM[name] = [];
    MZ_WAV[name].forEach((url, k) => {
      try {
        const bin = atob(url.split(',')[1]);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        ac.decodeAudioData(buf.buffer, d => {
          mzPCM[name][k] = d.getChannelData(0).slice();
          mzPCMrate = d.sampleRate;
        }, () => {});
      } catch (e) { /* leave the slot empty; the synth covers it */ }
    });
  });
}

function mzHas(name) {
  const l = mzPCM[name];
  return !!(l && l.filter(Boolean).length && mzPCMrate);
}

// Which recording this particular animal gets.
//
// Deliberately not Math.random(): the exported video has to match the site and
// re-render identically, so the variety is decided by WHICH sheep it is.
//
// Also not a plain hash. Hashing ten sheep across five recordings gave one of
// them five times and three back-to-back repeats — at this sample size a hash
// clumps. Instead each block of n animals gets a seeded shuffle of all n
// recordings, so every one is used once before any repeats, in a scrambled
// order that differs block to block.
function mzVariant(name, i) {
  const l = mzPCM[name];
  const n = l ? l.filter(Boolean).length : 0;
  if (n < 2) return 0;
  const block = Math.floor(i / n), pos = i % n;
  const order = [];
  for (let k = 0; k < n; k++) order.push(k);
  let seed = ((block + 1) * 2654435761) >>> 0;
  for (let k = n - 1; k > 0; k--) {                  // seeded Fisher-Yates
    seed = (seed * 1664525 + 1013904223) >>> 0;
    const j = seed % (k + 1);
    const t = order[k]; order[k] = order[j]; order[j] = t;
  }
  return order[pos];
}


// Mix a recording into an output buffer, resampling if the rates differ. Used by
// the video exporter. Passing endFrame makes it sustained: the loop repeats to
// fill the window, with fades so it doesn't click in or out.
function mzRenderWav(name, out, startFrame, sr, variant, endFrame) {
  if (!mzHas(name)) return false;
  const list = mzPCM[name].filter(Boolean);
  const src = list[(variant || 0) % list.length];
  const ratio = mzPCMrate / sr;
  const srcFrames = Math.max(1, Math.floor(src.length / ratio));
  const total = endFrame === undefined ? srcFrames : Math.max(0, endFrame - startFrame);
  const fade = endFrame === undefined ? 0
             : Math.min(Math.floor(sr * 0.25), Math.floor(total / 4));
  for (let i = 0; i < total; i++) {
    const j = startFrame + i;
    if (j < 0) continue;
    if (j >= out.length) break;
    const t = (i % srcFrames) * ratio, i0 = Math.floor(t), f = t - i0;
    const a = src[i0] || 0, b = src[i0 + 1] || 0;
    let v = a + (b - a) * f;
    if (fade > 0) {
      if (i < fade) v *= i / fade;
      else if (i > total - fade) v *= Math.max(0, (total - i) / fade);
    }
    out[j] += v;
  }
  return true;
}

// ── Live playback ────────────────────────────────────────────────────────────
// One shared context and pre-rendered buffers. playSound() spins up a fresh
// AudioContext per call, which is fine for one chime at the end but would be
// hundreds of contexts over a maze run.
let mzAC = null, mzBufs = {};
function mzCtx() {
  if (!mzAC) mzAC = new (window.AudioContext || window.webkitAudioContext)();
  if (mzAC.state === 'suspended') mzAC.resume();
  mzLoadSamples(mzAC);
  return mzAC;
}

function mzBuf(name, variant) {
  const key = 'w' + name + (variant || 0);
  if (!mzBufs[key] && mzHas(name)) {
    const list = mzPCM[name].filter(Boolean);
    const d = list[(variant || 0) % list.length];
    const b = mzAC.createBuffer(1, d.length, mzPCMrate);
    b.getChannelData(0).set(d);
    mzBufs[key] = b;
  }
  return mzBufs[key];
}

function mzPlay(name, pitch, variant, retry) {
  try {
    const ac = mzCtx();
    const rec = mzBuf(name, variant);
    if (rec && (pitch || 1) === 1) {                   // a recording wins
      const src = ac.createBufferSource();
      src.buffer = rec;
      src.connect(ac.destination);
      src.start();
      return;
    }
    if (!MZ_SFX[name]) {
      // Recording-only cue (the barks, the beam) that hasn't finished decoding.
      // There's no synth to fall back on, so retry shortly rather than swallow
      // it — this is exactly how the start-of-run bark went missing: it fires
      // about 16ms after the click, well before decodeAudioData returns.
      if (MZ_WAV[name] && (retry || 0) < 12) {
        setTimeout(() => mzPlay(name, pitch, variant, (retry || 0) + 1), 120);
      }
      return;
    }
    const key = name + (pitch || 1);
    if (!mzBufs[key]) {
      const f = MZ_SFX[name];
      const n = Math.ceil(f.dur * ac.sampleRate);
      const b = ac.createBuffer(1, n, ac.sampleRate);
      mzRenderSfx(name, b.getChannelData(0), 0, ac.sampleRate, pitch);
      mzBufs[key] = b;
    }
    const src = ac.createBufferSource();
    src.buffer = mzBufs[key];
    src.connect(ac.destination);
    src.start();
  } catch (e) { /* audio is a nicety, never break the timer for it */ }
}

// ── Sustained cue ────────────────────────────────────────────────────────────
// The tractor beam is on screen for most of each cow's interval — 21 seconds on
// a five-minute timer, over three minutes on a forty-five. So it loops for as
// long as the beam is up rather than firing as a one-shot, and fades in and out
// rather than cutting, which would click.
let mzHum = null, mzHumGain = null;
function mzHumOn(name) {
  try {
    if (mzHum) return;
    const ac = mzCtx();
    const rec = mzBuf(name, 0);
    if (!rec) return;
    mzHumGain = ac.createGain();
    mzHumGain.gain.setValueAtTime(0, ac.currentTime);
    mzHumGain.gain.linearRampToValueAtTime(1, ac.currentTime + 0.25);
    mzHum = ac.createBufferSource();
    mzHum.buffer = rec;
    mzHum.loop = true;
    mzHum.connect(mzHumGain);
    mzHumGain.connect(ac.destination);
    mzHum.start();
  } catch (e) { mzHum = null; mzHumGain = null; }
}
function mzHumOff() {
  try {
    if (!mzHum) return;
    const src = mzHum, g = mzHumGain, t = mzAC.currentTime;
    mzHum = null; mzHumGain = null;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.22);
    src.stop(t + 0.3);
  } catch (e) { mzHum = null; mzHumGain = null; }
}

function drawMaze(ctx, W, H, pct, col, state) {
  const secs = Math.max(1, totalSeconds);
  const [cw, ch] = MZ_SIZES.find(z => secs <= z[0]).slice(1);
  const st = state || mzOrphan;
  if (!st.mzSeed) st.mzSeed = (Math.random() * 0x7ffffff | 0) || 1;
  const m = mzBuild(cw, ch, st.mzSeed);
  const L = m.route.length;
  const s = Math.max(0, Math.min(1, 1 - pct));       // elapsed fraction
  const T = NOW() / 1000;                            // drives the idle animations
  const ot = outroT();

  // Corridors wide, walls slim — a uniform grid reads as a pegboard.
  const WF = 0.44;
  const tU = i => (i % 2 === 1 ? 1 : WF);
  let cu = 0, ru = 0;
  for (let i = 0; i < m.tw; i++) cu += tU(i);
  for (let i = 0; i < m.th; i++) ru += tU(i);

  const u  = Math.max(4, Math.min((W - 14) / cu, (H - 14) / ru));
  const px = Math.max(1, u / 8);                     // one sprite pixel
  const q  = v => Math.round(v / px) * px;           // snap to the pixel grid
  const ox = (W - u * cu) / 2, oy = (H - u * ru) / 2;
  const xs = [ox], ys = [oy];
  for (let i = 0; i < m.tw; i++) xs.push(xs[i] + tU(i) * u);
  for (let i = 0; i < m.th; i++) ys.push(ys[i] + tU(i) * u);
  const tX = t => (xs[t] + xs[t + 1]) / 2;
  const tY = t => (ys[t] + ys[t + 1]) / 2;
  const at = i => {
    const i0 = Math.max(0, Math.min(L - 1, Math.floor(i)));
    const i1 = Math.min(L - 1, i0 + 1), f = i - i0;
    const a = m.route[i0], b = m.route[i1];
    return [tX(a[0]) + (tX(b[0]) - tX(a[0])) * f, tY(a[1]) + (tY(b[1]) - tY(a[1])) * f];
  };

  // ── Walls: hard-edged blocks with an arcade bevel on top ───────────────────
  const WALL = '#233257', BEVEL = '#38508c';
  for (let tr = 0; tr < m.th; tr++) {
    let tc = 0;
    while (tc < m.tw) {
      if (mzOpen(m, tc, tr)) { tc++; continue; }
      let e = tc;
      while (e + 1 < m.tw && !mzOpen(m, e + 1, tr)) e++;
      const x = q(xs[tc]), y = q(ys[tr]);
      const w = q(xs[e + 1]) - x, h = q(ys[tr + 1]) - y;
      ctx.fillStyle = WALL;  ctx.fillRect(x, y, w, h);
      ctx.fillStyle = BEVEL; ctx.fillRect(x, y, w, Math.max(1, px));
      tc = e + 1;
    }
  }

  // ── Bot position first, so dots are eaten against the same value ───────────
  const tp = s * (L - 1);
  let [bx, by] = at(tp);
  const [nxp, nyp] = at(Math.min(L - 1, tp + 0.5));
  const dxh = nxp - bx, dyh = nyp - by;
  const facing = Math.abs(dxh) >= Math.abs(dyh) ? (dxh >= 0 ? 0 : 2) : (dyh >= 0 ? 1 : 3);

  // ── Dots: squares, eaten as the jaws arrive ────────────────────────────────
  const dSide = Math.max(2, Math.round(u * 0.26 / px)) * px;
  ctx.fillStyle = col;
  m.first.forEach((fi, k) => {
    if (tp >= fi - 0.45) return;
    const [c, r] = k.split(',').map(Number);
    ctx.fillRect(q(tX(2 * c + 1) - dSide / 2), q(tY(2 * r + 1) - dSide / 2), dSide, dSide);
  });

  // ── Drones, minus the ones currently eaten ─────────────────────────────────
  const ev = mzEvents(m);
  // One life: a caught drone is gone for the rest of the run. That's simpler
  // than respawning, not harder — it's still a pure function of elapsed time,
  // just "has it been caught at all" instead of "how long ago".
  const oneLife = !!st.mzNoRespawn;
  const respawn = Math.min(0.07, 5 / secs);          // ~5s, capped on short timers
  const burstS  = Math.min(0.035, 2.5 / secs);       // how long the munch shows
  const pal = {
    S: '#54688f', D: '#0b1120', P: lerpHex(col, '#f0f4ff', 0.45),
    B: lerpHex(col, '#f0f4ff', 0.32), L: col, W: '#f0f4ff',
  };
  // Bitmask rather than a count: the live sound needs to know WHICH one was
  // caught so it can play that character's pitch.
  let eatenMask = 0;
  MZ_DRONES.forEach((d, i) => {
    let lastEat = -1;
    for (const t of ev[i]) { if (t <= s) lastEat = t; else break; }
    const since = lastEat < 0 ? Infinity : s - lastEat;
    const gone  = oneLife ? lastEat >= 0 : since < respawn;
    if (gone) eatenMask |= 1 << i;
    const [dx, dy] = at(mzDroneIdx(m, d, s));

    if (gone) {
      // A skull marks the spot, rising and fading out.
      if (since < burstS) {
        const t = since / burstS;
        ctx.globalAlpha = 1 - t * t;
        pxBlit(ctx, MZ_SKULL, { S: '#f0f4ff', D: '#0b1120' },
               dx, dy - t * px * 5, px, 0);
        ctx.globalAlpha = 1;
      }
      return;
    }
    // Same speed, different bearing. The offsets below are cosmetic — catches are
    // computed from route position alone, so wobble can't affect the timing.
    const dpal = Object.assign({}, pal, { S: d.body });
    let ox2 = 0, oy2 = 0, dir = 0, rows;
    if (d.kind === 'sentry') {
      rows = MZ_SENTRY;
      oy2 = Math.sin(T * 2.1) * px * 0.7;                    // bobs on the spot
      if ((T % 2.6) < 0.12) dpal.P = '#0b1120';              // and blinks
    } else if (d.kind === 'roamer') {
      rows = MZ_ROAMER;
      dir = Math.floor(T * 0.8) % 4;                         // slow tumble
    } else {
      rows = (Math.floor(T * 7) % 2) ? MZ_TWITCH_A : MZ_TWITCH_B;
      ox2 = Math.sin(T * 13.7) * px * 0.45;                  // nervy jitter
      oy2 = Math.cos(T * 11.3) * px * 0.45;
    }
    pxBlit(ctx, rows, dpal, dx + ox2, dy + oy2, px, dir);
  });

  // ── The bot ────────────────────────────────────────────────────────────────
  // Two-frame jaw animation rather than a smooth rotation — that is what makes
  // it read as a sprite rather than vector art with square corners.
  const jaws = (Math.floor(NOW() / 110) % 2) ? MZ_BOT_OPEN : MZ_BOT_SHUT;
  if (ot > 0) {
    const k = 1 + ot * 0.6;
    pxBlit(ctx, jaws, pal, bx, by, px * k, Math.floor(ot * 8) % 4);
  } else {
    pxBlit(ctx, jaws, pal, bx, by, px, facing);
  }

  // ── Live sound ─────────────────────────────────────────────────────────────
  // Triggered off changes in what was just drawn, not off a clock, so it stays
  // in step with the picture. Gated on virtualNow === null: the exporter drives
  // this function thousands of times a second through a virtual clock, and
  // without that check a single export would fire every blip at once.
  if (virtualNow === null && soundCheck.checked) {
    if (running && !st.mzWasRunning) mzPlay('start');
    if (running && st.mzPrevMask !== undefined) {
      const fresh = eatenMask & ~st.mzPrevMask;
      MZ_DRONES.forEach((d, i) => { if (fresh & (1 << i)) mzPlay('munch', d.pitch); });
    }
    if (ot > 0 && !st.mzFin) { mzPlay('finale'); st.mzFin = true; }
  }
  if (ot <= 0) st.mzFin = false;
  st.mzWasRunning = running;
  st.mzPrevMask = eatenMask;

  // ── Finale: expanding square ring ──────────────────────────────────────────
  if (ot > 0) {
    ctx.fillStyle = col;
    for (let k = 0; k < 3; k++) {
      const t = Math.max(0, Math.min(1, ot * 1.5 - k * 0.22));
      if (t <= 0 || t >= 1) continue;
      const rr = Math.round(2 + t * 26) * px, th = Math.max(1, px);
      ctx.fillRect(q(bx - rr), q(by - rr), rr * 2, th);
      ctx.fillRect(q(bx - rr), q(by + rr), rr * 2, th);
      ctx.fillRect(q(bx - rr), q(by - rr), th, rr * 2);
      ctx.fillRect(q(bx + rr), q(by - rr), th, rr * 2);
    }
  }
}

// ── Render: Mushroom Wood ─────────────────────────────────────────────────────
// A side-scrolling trek: a sporeling walks a forest trail toward a lit hollow,
// and arrives exactly at 0:00. What this format gives that none of the other
// timers can is a VISIBLE DESTINATION — you can see the goal and watch it grow,
// which a bar or a ring cannot do.
//
// Countability comes from trail markers. The maze works because dots remaining
// IS time remaining; a single walking position loses that, so the remaining
// posts are laid out ahead in compressed perspective and you can count them.
//
// Stateless, like the maze: everything below is a function of pct and the clock.

// More markers for a longer walk, so the pace stays watchable.
const TK_MARKS = [[120, 6], [420, 10], [1200, 14], [Infinity, 18]];

// Walker: two-frame stride. L outline, B body, W eye.
const TK_WALK_A = [
  '  L  L  ',
  '  LLLL  ',
  ' LBBBBL ',
  'LBWWBBL ',
  'LBBBBBL ',
  ' LBBBBL ',
  '  L  L  ',
  ' L    L ',
];
const TK_WALK_B = [
  '  L  L  ',
  '  LLLL  ',
  ' LBBBBL ',
  'LBWWBBL ',
  'LBBBBBL ',
  ' LBBBBL ',
  '   LL   ',
  '   LL   ',
];
// Trail marker: a small capped post.
const TK_POST = [
  ' SSSS ',
  'SSDSSS',
  ' SSSS ',
  '  SS  ',
  '  SS  ',
  '  SS  ',
];
// Background toadstool.
const TK_SHROOM = [
  '  SSSS  ',
  ' SSDSSS ',
  'SSSSSDSS',
  ' SSSSSS ',
  '   SS   ',
  '   SS   ',
  '   SS   ',
  '   SS   ',
];
// The destination: a big toadstool with a lit doorway.
const TK_HOLLOW = [
  '    SSSS    ',
  '  SSSSSSSS  ',
  ' SSSDSSSDSS ',
  'SSSSSSSSSSSS',
  'SSDSSSSSSDSS',
  ' SSSSSSSSSS ',
  '   SSSSSS   ',
  '   SGGGGS   ',
  '   SGGGGS   ',
  '   SGGGGS   ',
  '   SGGGGS   ',
  '   SSSSSS   ',
];

function drawTrek(ctx, W, H, pct, col, state) {
  const secs  = Math.max(1, totalSeconds);
  const marks = TK_MARKS.find(z => secs <= z[0])[1];
  const st    = state || mzOrphan;
  const s     = Math.max(0, Math.min(1, 1 - pct));     // elapsed fraction
  const T     = NOW() / 1000;
  const ot    = outroT();

  // Sprite pixel sized so the walker is roughly a sixth of the frame tall. The
  // first pass used a much smaller unit and put the ground at 76% height, which
  // left the top three-quarters as empty sky and everything crammed into a strip
  // along the bottom — the same mistake the sheep timer had.
  const px = Math.max(1, Math.min(W / 110, H / 58));
  const q  = v => Math.round(v / px) * px;
  const groundY = q(H * 0.74);
  const walkX   = q(W * 0.22);

  // ── Perspective mapping ────────────────────────────────────────────────────
  // Everything still ahead has to be on screen at once, or you can't count the
  // markers or see the destination. An exponential squeeze puts the whole
  // remaining trail between the walker and the right edge: near things move at
  // full speed, distant ones bunch toward the horizon and creep.
  const SEG = W * 0.40;
  const total = marks * SEG;
  const cam = s * total;
  const K = SEG * 1.55;
  const far = W * 0.96;
  const depth = wx => Math.exp(-Math.max(0, wx - cam) / K);     // 1 near … 0 far
  const scrX = wx => {
    const d = wx - cam;
    return d >= 0 ? walkX + (far - walkX) * (1 - Math.exp(-d / K))
                  : walkX + d;                                  // behind: 1:1 off-screen
  };

  // ── Sky and drifting spores ────────────────────────────────────────────────
  ctx.fillStyle = '#0d1426';
  ctx.fillRect(0, 0, W, groundY);
  ctx.fillStyle = lerpHex(col, '#0d1426', 0.68);
  for (let i = 0; i < 30; i++) {
    const a = i * 2.399;
    const mx = ((a * 41 + T * (3 + i % 5) * 0.5) % (W + 20)) - 10;
    const my = (Math.sin(a) * 0.5 + 0.5) * groundY * 0.72 + Math.sin(T * 0.5 + i) * px;
    ctx.fillRect(q(mx), q(my), px, px);
  }

  // ── Far skyline: a low ridge with small toadstool silhouettes ─────────────
  // Two background layers, not three. The first attempt added a fast foreground
  // row as well and the bottom of the frame turned into overlapping dark blocks
  // with no readable shape — depth cues are worth nothing if they bury the thing
  // you're meant to be watching.
  const ridgeY = q(groundY - H * 0.14);
  for (let i = -1; i < 16; i++) {
    const wx = (Math.floor(cam * 0.10 / (SEG * 0.45)) + i) * (SEG * 0.45);
    const x = walkX + (wx - cam * 0.10) * 0.5;
    if (x < -px * 12 || x > W + px * 12) continue;
    const k = 0.55 + 0.30 * Math.abs(Math.sin(wx * 0.017));
    pxBlit(ctx, TK_SHROOM, { S: '#141c33', D: '#141c33' },
           q(x), q(ridgeY - px * 3.4 * k), px * k, 0);
  }
  ctx.fillStyle = '#141c33';
  ctx.fillRect(0, ridgeY, W, groundY - ridgeY);

  // ── Mid toadstools, spaced so the trail stays legible between them ────────
  for (let i = -1; i < 12; i++) {
    const wx = (Math.floor(cam * 0.55 / (SEG * 0.62)) + i) * (SEG * 0.62);
    const x = walkX + (wx - cam * 0.55) * 0.72;
    if (x < -px * 12 || x > W + px * 12) continue;
    const k = 0.9 + 0.5 * Math.abs(Math.sin(wx * 0.031));
    pxBlit(ctx, TK_SHROOM, { S: '#1e2b50', D: '#16203c' },
           q(x), q(groundY - px * 3.5 * k), px * 1.15 * k, 0);
  }

  // ── Ground ─────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#1b2540';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#33456f';
  ctx.fillRect(0, groundY, W, Math.max(1, px));
  ctx.fillStyle = '#243357';
  for (let i = -2; i < 46; i++) {
    const wx = (Math.floor(cam / (SEG * 0.16)) + i) * (SEG * 0.16);
    const x = scrX(wx);
    if (x < -px * 4 || x > W) continue;
    const d = depth(wx);
    ctx.fillRect(q(x), q(groundY + px * 2.5 + (1 - d) * px * 0.5),
                 Math.max(px, q(px * 5 * (0.25 + d))), px);
  }

  // ── Trail markers still ahead, far to near so they overlap correctly ───────
  const passed = Math.floor(s * marks + 1e-9);
  for (let i = marks; i >= 0; i--) {
    const wx = i * SEG;
    const x = scrX(wx);
    if (x < -px * 8 || x > W + px * 8) continue;
    const d = depth(wx);
    const sc = px * (0.45 + 0.75 * d);      // kept under the toadstools so the
    const done = i <= passed;                //  posts read as trail, not scenery
    pxBlit(ctx, TK_POST,
           { S: done ? '#3a4a6d' : lerpHex(col, '#f0f4ff', 0.10), D: '#0d1426' },
           q(x), q(groundY - sc * 3), sc, 0);
  }

  // ── The destination, a landmark from the very start ────────────────────────
  {
    const wx = total;
    const d = depth(wx);
    // Big enough to be a landmark from the first second, capped so it never
    // outgrows the frame — at 2.6x it was taller than the canvas at arrival.
    const sc = px * (0.8 + 1.6 * d);
    const glow = 0.5 + 0.5 * Math.sin(T * 1.6);
    pxBlit(ctx, TK_HOLLOW, {
      S: lerpHex(col, '#f0f4ff', 0.10),
      D: '#0d1426',
      G: lerpHex('#241a0d', '#ffd772', glow),
    }, q(scrX(wx)), q(groundY - sc * 6), sc, 0);
  }

  // ── The walker ─────────────────────────────────────────────────────────────
  const pal = {
    L: lerpHex(col, '#0b1120', 0.25),
    B: lerpHex(col, '#f0f4ff', 0.22),
    W: '#ffffff',
  };
  const stride = (Math.floor(T * 5.5) % 2) ? TK_WALK_A : TK_WALK_B;
  const bob = (Math.floor(T * 5.5) % 2) ? 0 : px;
  if (ot > 0) {
    // Arrives, then steps into the hollow: walks the last gap, shrinks, fades.
    const k = 1 - ot;
    ctx.globalAlpha = Math.max(0, k);
    pxBlit(ctx, stride, pal, q(walkX + (scrX(total) - walkX) * ot),
           q(groundY - px * 4 - bob), Math.max(1, px * k), 0);
    ctx.globalAlpha = 1;
  } else {
    pxBlit(ctx, stride, pal, walkX, q(groundY - px * 4 - bob), px, 0);
  }

  // ── Live sound ─────────────────────────────────────────────────────────────
  // Same gate as the maze: the exporter drives this through a virtual clock, so
  // without the virtualNow check one export would fire every cue at once.
  if (virtualNow === null && soundCheck.checked) {
    if (running && !st.tkRunning) mzPlay('start');
    if (running && st.tkPassed !== undefined && passed > st.tkPassed) mzPlay('mark');
    if (ot > 0 && !st.tkFin) { mzPlay('finale'); st.tkFin = true; }
  }
  if (ot <= 0) st.tkFin = false;
  st.tkRunning = running;
  st.tkPassed = passed;
}

// A cue per herd member, for the timers that count something down.
// No arpeggio at the end of these: the last animal call already lands on zero,
// and stacking a flourish on top of it plus the end chime is a pile-up.
function sheepSoundTrack(secs) {
  const ev = [{ t: 0, name: 'bark1', pitch: 1 }];
  for (let i = 0; i < SHEEP_COUNT; i++) {
    ev.push({ t: ((i + 1) / SHEEP_COUNT) * secs, name: 'baa', pitch: 1,
              variant: mzVariant('baa', i) });
  }
  ev.push({ t: secs, name: 'bark2', pitch: 1 });
  return ev;
}

// The beam is a sustained cue: `until` marks the window it fills rather than a
// single hit. Each cow's beam runs from TRAVEL through the end of its interval.
function ufoSoundTrack(secs) {
  const ev = [{ t: 0, name: 'start', pitch: 1 }];
  for (let i = 0; i < UFO_COWS; i++) {
    const b0 = ((i + UFO_TRAVEL) / UFO_COWS) * secs;
    const b1 = ((i + 1) / UFO_COWS) * secs;
    ev.push({ t: b0, name: 'beam', pitch: 1, until: b1 });
    ev.push({ t: b0 + 0.15, name: 'moo', pitch: 1, variant: mzVariant('moo', i) });
  }
  return ev;
}

// The exporter asks here rather than knowing about each timer itself, so the
// cue list lives next to the timer it belongs to. Returns null for silent ones.
function timerSoundTrack(type, secs, opts) {
  const o = opts || {};
  if (type === 'maze')  return mzSoundTrack(
    mzBuild(...MZ_SIZES.find(z => secs <= z[0]).slice(1), o.seed || 1), secs, o.oneLife);
  if (type === 'trek')  return tkSoundTrack(secs);
  if (type === 'sheep') return sheepSoundTrack(secs);
  if (type === 'ufo')   return ufoSoundTrack(secs);
  if (type === 'asteroid') return astSoundTrack(secs, o.seed || 1, o.w, o.h);
  return null;
}

// Every sound in a trek, for the exported track.
function tkSoundTrack(secs) {
  const marks = TK_MARKS.find(z => secs <= z[0])[1];
  const ev = [{ t: 0, name: 'start', pitch: 1 }];
  for (let i = 1; i <= marks; i++) ev.push({ t: (i / marks) * secs, name: 'mark', pitch: 1 });
  ev.push({ t: secs, name: 'finale', pitch: 1 });
  return ev;
}

// One dispatch table for every timer, shared by the live RAF loop and the
// offscreen video exporter. Keeping it in one place means a timer added here
// shows up in exports automatically instead of silently rendering nothing.
function drawTimer(type, ctx, W, H, pct, col, state) {
  switch (type) {
    case 'circle':    drawCircle(ctx,W,H,pct,col);          break;
    case 'bar':       drawBar(ctx,W,H,pct,col);             break;
    case 'blocks':    drawBlocks(ctx,W,H,pct,col);          break;
    case 'dots':      drawDots(ctx,W,H,pct,col);            break;
    case 'digital':   drawDigital(ctx,W,H,pct,col);         break;
    case 'clock':     drawClock(ctx,W,H,pct,col);           break;
    case 'liquid':    drawLiquid(ctx,W,H,pct,col,state);    break;
    case 'hourglass': drawHourglass(ctx,W,H,pct,col,state); break;
    case 'ufo':       drawUFOTimer(ctx,W,H,pct,col,state);  break;
    case 'candle':    drawCandle(ctx,W,H,pct,col,state);    break;
    case 'sheep':     drawSheep(ctx,W,H,pct,col,state);     break;
    case 'maze':      drawMaze(ctx,W,H,pct,col,state);      break;
    case 'trek':      drawTrek(ctx,W,H,pct,col,state);      break;
    case 'asteroid':  drawAsteroid(ctx,W,H,pct,col,state);  break;
  }
}

// ── Render: Circle ────────────────────────────────────────────────────────────
function drawCircle(ctx, W, H, pct, col) {
  const cx=W/2, cy=H/2, half=Math.min(W,H)/2;
  // A stroke straddles its own path, so the ring actually reaches r + lw/2 —
  // and lw scales with r while the 26px margin below does not. Past r ≈ 400
  // (a circle about 800px across, i.e. a classroom display or fullscreen) the
  // stroke outgrew the margin and the ring was clipped by the canvas edge.
  // Solve for the largest r whose stroke still fits: r + (0.13r + pulse)/2 + 4 ≤ half.
  const PULSE = 2;                                   // max urgency wobble, added below
  const r = Math.min(half - 26, (half - 4 - PULSE/2) / 1.065);
  if (r < 10) return;
  // Pulse ring thickness in final 10% for urgency
  const urgencyPulse = pct < 0.1 ? Math.sin(NOW()/120)*2 : 0;
  const lw = Math.max(10, r*0.13) + urgencyPulse;

  // Track ring
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#1a2844'; ctx.lineWidth=lw; ctx.stroke();

  if (pct > 0) {
    const hand=-Math.PI/2+(1-pct)*Math.PI*2, end=Math.PI*3/2;
    // Flat pie fill
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r-1,hand,end); ctx.closePath();
    ctx.fillStyle=col+'22'; ctx.fill();
    // Flat arc
    ctx.beginPath(); ctx.arc(cx,cy,r,hand,end);
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  }

  // Time text — flat
  const fs=Math.max(16,Math.min(r*0.52,90));
  ctx.fillStyle=col; fitFont(ctx, fmt(remaining), r*1.55, fs);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(remaining),cx,cy);
}

// ── Render: Bar ───────────────────────────────────────────────────────────────
function drawBar(ctx, W, H, pct, col) {
  const pad=16, bh=Math.min(70,H*0.28), bw=W-pad*2, r=bh/2;
  const tall=H>bh*3.5, by=tall?H*0.38-bh/2:(H-bh)/2;

  // Track — flat
  rrect(ctx,pad,by,bw,bh,r); ctx.fillStyle='#1a2844'; ctx.fill();

  // Fill — flat colour, clipped to the track.
  // The fill is anchored to the right edge, so in the last seconds it is only a
  // few pixels wide while the track's cap is still bh/2 across — its square
  // corners would sit outside the track's curve. Clipping makes that impossible
  // at any width, so the fill can never escape the bar it's inside.
  const fw=bw*pct;
  if (fw>0.5) {
    ctx.save();
    rrect(ctx,pad,by,bw,bh,r); ctx.clip();
    rrect(ctx,pad+bw-fw,by,fw,bh,r); ctx.fillStyle=col; ctx.fill();
    ctx.restore();
  }

  // Time label
  if (tall) {
    const fs=Math.min(W*0.28,H*0.22,80);
    ctx.fillStyle=col; fitFont(ctx, fmt(remaining), W*0.90, fs);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmt(remaining),W/2,H*0.18);
  } else {
    ctx.fillStyle='#fff'; fitFont(ctx, fmt(remaining), W*0.80, Math.min(bh*.5,28), 800);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmt(remaining),W/2,by+bh/2);
  }
}

// ── Render: Blocks — each cell drains individually ────────────────────────────
function drawBlocks(ctx, W, H, pct, col) {
  const C=10, R=6, T=C*R, pad=16, gap=5;
  const cell=Math.min((W-pad*2-gap*(C-1))/C,(H-pad*2-gap*(R-1))/R,48);
  const gw=C*cell+(C-1)*gap, gh=R*cell+(R-1)*gap;
  const ox=(W-gw)/2, oy=(H-gh)/2;
  const rc=Math.min(10, cell*0.28);
  const elapsed=(1-pct)*T; // fractional blocks consumed

  for (let i=0; i<T; i++) {
    const bx=ox+(i%C)*(cell+gap), by=oy+Math.floor(i/C)*(cell+gap);

    // Dark base
    rrect(ctx,bx,by,cell,cell,rc);
    ctx.fillStyle='#1a2844'; ctx.globalAlpha=0.4; ctx.fill();
    ctx.globalAlpha=1;

    if (elapsed <= i) {
      // Fully remaining — solid fill
      rrect(ctx,bx,by,cell,cell,rc); ctx.fillStyle=col; ctx.fill();
    } else if (elapsed < i+1) {
      // Currently draining — liquid surface ripples as level drops
      const t = NOW()/1000;
      const fillH = cell * (1-(elapsed-i));
      const surfY = by + cell - fillH;
      // Urgency: wave gets faster + bigger in final 10%
      const urgency = pct < 0.1 ? 2.5 : 1;
      const amp  = Math.min(fillH*0.3, 2.5) * urgency;
      const freq = pct < 0.1 ? 6 : 4;
      const spd  = pct < 0.1 ? 5 : 3;

      ctx.save();
      rrect(ctx,bx,by,cell,cell,rc); ctx.clip();
      ctx.fillStyle = col;
      ctx.beginPath();
      // Wavy surface
      for (let s=0; s<=16; s++) {
        const wx = bx + s*(cell/16);
        const wy = surfY + Math.sin(s/16*Math.PI*freq + t*spd)*amp;
        s===0 ? ctx.moveTo(wx, wy) : ctx.lineTo(wx, wy);
      }
      ctx.lineTo(bx+cell, by+cell);
      ctx.lineTo(bx, by+cell);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    // else fully drained — dark base only
  }
}

// ── Render: Dots — each dot drains individually ────────────────────────────────
function drawDots(ctx, W, H, pct, col) {
  const C=10, R=6, T=C*R, pad=16, gap=6;
  const diam=Math.min((W-pad*2-gap*(C-1))/C,(H-pad*2-gap*(R-1))/R,44);
  const r=diam/2;
  const gw=C*diam+(C-1)*gap, gh=R*diam+(R-1)*gap;
  const ox=(W-gw)/2, oy=(H-gh)/2;
  const elapsed=(1-pct)*T;

  for (let i=0; i<T; i++) {
    const dcx=ox+(i%C)*(diam+gap)+r, dcy=oy+Math.floor(i/C)*(diam+gap)+r;

    // Dark base
    ctx.beginPath(); ctx.arc(dcx,dcy,r,0,Math.PI*2);
    ctx.fillStyle='#1a2844'; ctx.globalAlpha=0.4; ctx.fill();
    ctx.globalAlpha=1;

    if (elapsed <= i) {
      // Full
      ctx.beginPath(); ctx.arc(dcx,dcy,r,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
    } else if (elapsed < i+1) {
      // Draining — wavy liquid surface inside the circle
      const t = NOW()/1000;
      const fillH = diam * (1-(elapsed-i));
      const surfY = dcy + r - fillH;
      const urgency = pct < 0.1 ? 2.5 : 1;
      const amp  = Math.min(fillH*0.35, 2.2) * urgency;
      const spd  = pct < 0.1 ? 5 : 3;

      ctx.save();
      ctx.beginPath(); ctx.arc(dcx,dcy,r,0,Math.PI*2); ctx.clip();
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let s=0; s<=12; s++) {
        const wx = dcx - r + s*(diam/12);
        const wy = surfY + Math.sin(s/12*Math.PI*4 + t*spd)*amp;
        s===0 ? ctx.moveTo(wx,wy) : ctx.lineTo(wx,wy);
      }
      ctx.lineTo(dcx+r, dcy+r);
      ctx.lineTo(dcx-r, dcy+r);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}

// ── Render: Digital ───────────────────────────────────────────────────────────
function drawDigital(ctx, W, H, pct, col) {
  const fs=Math.min(W*.38,H*.58,110);
  ctx.fillStyle=col; fitFont(ctx, fmt(remaining), W*0.88, fs);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(remaining),W/2,H/2);
}

// ── Render: Clock ─────────────────────────────────────────────────────────────
function drawClock(ctx, W, H, pct, col) {
  const cx=W/2, cy=H/2, r=Math.min(W,H)/2-12;
  if (r<20) return;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#141e30'; ctx.fill();
  ctx.strokeStyle='#1a2844'; ctx.lineWidth=3; ctx.stroke();
  for (let i=0;i<60;i++) {
    const a=(i/60)*Math.PI*2-Math.PI/2, big=i%5===0;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(r-(big?14:8)),cy+Math.sin(a)*(r-(big?14:8)));
    ctx.lineTo(cx+Math.cos(a)*(r-3),cy+Math.sin(a)*(r-3));
    ctx.strokeStyle=big?'#3a5070':'#243354'; ctx.lineWidth=big?2:1; ctx.stroke();
  }
  if (pct>0) {
    const hand=-Math.PI/2+(1-pct)*Math.PI*2, end=Math.PI*3/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r-4,hand,end); ctx.closePath();
    ctx.fillStyle=col+'30'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(hand)*(r-12),cy+Math.sin(hand)*(r-12));
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
  const fs=Math.max(11,Math.min(r*.28,26));
  ctx.fillStyle='#f0f4ff'; fitFont(ctx, fmt(remaining), r*1.05, fs, 700);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(fmt(remaining),cx,cy+r*.45);
}

// ── Render: Liquid ────────────────────────────────────────────────────────────
function drawLiquid(ctx, W, H, pct, col, state) {
  const cw = Math.max(60, Math.min(W * 0.88, 300));
  const ch = H - 20;
  const cx = W / 2;
  const x0 = cx - cw/2, y0 = 10, pad = 9;
  const ix = x0+pad, iw = cw-pad*2, iy = y0+pad, ih = ch-pad*2;
  const elapsed = 1 - pct;
  const now = NOW();

  state.drops = state.drops || [];

  // Compact pools — the cascade is the star, not the reservoirs
  const maxPool  = ih * 0.12;
  const topH     = pct * maxPool;
  const botH     = elapsed * maxPool;
  const topSurfY = iy + topH;
  const botSurfY = iy + ih - botH;

  // ── 5 alternating ramps forming the zig-zag ────────────────────────────────
  // Even: anchored to LEFT wall, open end on RIGHT  → drops roll rightward
  // Odd:  anchored to RIGHT wall, open end on LEFT  → drops roll leftward
  // Anchor extends past the wall so the clip cuts it flush (looks attached).
  const gapW  = iw * 0.26;
  const slope = iw * 0.10;
  const fracs = [0.20, 0.34, 0.48, 0.62, 0.76];

  const SHELVES = fracs.map((f, i) => {
    const my = iy + f * ih;
    return (i % 2 === 0)
      ? { ax: ix - 8,       ay: my, bx: ix + iw - gapW, by: my + slope, dir:  1 }
      : { ax: ix + iw + 8,  ay: my, bx: ix + gapW,      by: my + slope, dir: -1 };
  });

  // ── Glass body ─────────────────────────────────────────────────────────────
  rrect(ctx, x0, y0, cw, ch, 20);
  ctx.fillStyle = 'rgba(10,16,30,0.80)';
  ctx.fill();

  ctx.save();
  rrect(ctx, ix, iy, iw, ih, 14);
  ctx.clip();

  // ── Ramps — solid physical ledges ─────────────────────────────────────────
  SHELVES.forEach(s => {
    ctx.lineCap = 'round';
    // Body of the ramp
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by);
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();
    // Wet top edge — thin tint of the timer colour
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay - 3); ctx.lineTo(s.bx, s.by - 3);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.26)';
    ctx.stroke();
  });

  // ── Spawn a steady cascade ────────────────────────────────────────────────
  // Constant rate while running so the motion stays lively the whole time;
  // the pools carry the "how much is left" signal.
  const spawnGap = 170;
  // Gate on SECONDS, not on a fraction of the duration. This used to be
  // `pct < 0.995`, which scales with the timer: on a 10-minute timer nothing
  // dripped for the first 3 seconds (and it took ~8 for the cascade to look
  // alive), and on a 30-minute timer, 9. The matching `pct > 0.01` also stopped
  // the drops a full 6 seconds before zero. In seconds it behaves the same at
  // every duration — start immediately, run until just before the end.
  if (running && pct * totalSeconds > 1.2 &&
      now - state.lastSpawn > spawnGap && state.drops.length < 44) {
    state.lastSpawn = now;
    const r = 6 + Math.random() * 6;
    state.drops.push({
      x:  ix + iw * (0.16 + Math.random() * 0.44),
      y:  topSurfY + r,
      vx: 0, vy: 0.5 + Math.random() * 0.5, r,
      phase: 'fall',      // 'fall' | 'slide'
      si: 0,              // shelf index to test from
      sp: 0,              // current slide speed
    });
  }

  // ── Update + draw drops ───────────────────────────────────────────────────
  state.drops = state.drops.filter(d => {
    if (d.phase === 'fall') {
      d.vy = Math.min(d.vy + 0.22, 9);
      d.y += d.vy;

      // Land on the first ramp beneath us
      for (let i = d.si; i < SHELVES.length; i++) {
        const s = SHELVES[i];
        const lo = Math.min(s.ax, s.bx), hi = Math.max(s.ax, s.bx);
        if (d.x < lo || d.x > hi) continue;
        const t  = (d.x - s.ax) / (s.bx - s.ax);
        const sy = s.ay + (s.by - s.ay) * t;
        if (d.y + d.r >= sy) {
          d.y = sy - d.r;
          d.vy = 0;
          d.sp = 0.8 + Math.random() * 0.7;
          d.phase = 'slide';
          d.si = i;
          break;
        }
      }

    } else {
      const s = SHELVES[d.si];
      d.sp = Math.min(d.sp + 0.06, 4.2);   // accelerate down the ramp
      d.x += s.dir * d.sp;
      const t = Math.max(0, Math.min(1, (d.x - s.ax) / (s.bx - s.ax)));
      d.y = s.ay + (s.by - s.ay) * t - d.r;
      // Tip off the open end
      if (s.dir > 0 ? d.x >= s.bx : d.x <= s.bx) {
        d.phase = 'fall'; d.vy = 0.4; d.si++;
      }
    }

    // Merge into the bottom pool
    if (d.y - d.r > botSurfY + 2) return false;

    // Teardrop stretch when falling, squash when rolling
    const k  = d.phase === 'fall' ? 1 + Math.min(d.vy * 0.028, 0.32) : 0.86;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r / k, d.r * k, 0, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    // Specular dot
    ctx.beginPath();
    ctx.ellipse(d.x - d.r*0.26, d.y - d.r*0.28, d.r*0.20, d.r*0.24, -0.3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fill();
    return true;
  });

  // ── Pools drawn OVER drops so they emerge from / sink into the liquid ─────
  const tw = now / 620;

  if (topH > 1) {
    ctx.beginPath();
    ctx.moveTo(ix - 2, iy - 4);
    ctx.lineTo(ix + iw + 2, iy - 4);
    ctx.lineTo(ix + iw + 2, topSurfY);
    for (let x = iw; x >= 0; x -= 5) {
      ctx.lineTo(ix + x, topSurfY + Math.sin(x/19 + tw) * 1.7);
    }
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.24)'; ctx.lineWidth = 2; ctx.stroke();
  }

  if (botH > 1) {
    ctx.beginPath();
    ctx.moveTo(ix - 2, botSurfY);
    for (let x = 0; x <= iw; x += 5) {
      ctx.lineTo(ix + x, botSurfY + Math.sin(x/19 - tw) * 1.7);
    }
    ctx.lineTo(ix + iw + 2, iy + ih + 4);
    ctx.lineTo(ix - 2, iy + ih + 4);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 2; ctx.stroke();
  }

  ctx.restore();

  // ── Glass outline + edge shimmer ──────────────────────────────────────────
  rrect(ctx, x0, y0, cw, ch, 20);
  ctx.strokeStyle = 'rgba(255,255,255,0.26)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.save();
  rrect(ctx, x0, y0, cw, ch, 20); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(x0 + 11, y0 + 18); ctx.lineTo(x0 + 11, y0 + ch - 18);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
}

// ── Render: Cow Abduction ─────────────────────────────────────────────────────
// A discrete counter dressed up as a joke: the herd IS the time remaining, so it
// reads at a glance exactly like Blocks. Cows go left→right, matching the
// reading direction used by the other timers.
const UFO_COWS = 10;
// Share of each cow's interval the saucer spends flying over before the beam
// comes on. Module-level because the exported sound track needs it to work out
// when the beam is up.
const UFO_TRAVEL = 0.30;

// A chunky, readable cow facing right. (x, y) is the centre of its feet, and h
// is the full height including the head. Two details do the heavy lifting at
// small sizes: legs grouped in front/back pairs (evenly spaced legs read as a
// caterpillar), and a neck wedge tying the head to the shoulder (without it the
// head floats). Verified legible down to ~32px wide, the real in-widget size.
function drawCow(ctx, x, y, w, h, col, tilt) {
  const DARK    = '#0b1120';
  const bx      = x - w / 2;
  const bodyW   = w * 0.68;
  const bodyTop = y - h * 0.78;
  const bodyBot = y - h * 0.26;
  const bodyH   = bodyBot - bodyTop;
  const hw = w * 0.34, hh = h * 0.26;
  const hx = x + w * 0.06, hy = y - h * 0.95;
  const LEGS = [0.14, 0.30, 0.68, 0.84];

  ctx.save();
  if (tilt) { ctx.translate(x, y); ctx.rotate(tilt); ctx.translate(-x, -y); }

  // ── Legs + hooves (behind the body) ──
  const lw    = Math.max(2, w * 0.078);
  const hoofH = Math.max(1.2, h * 0.032);
  ctx.fillStyle = col;
  LEGS.forEach(f => ctx.fillRect(bx + bodyW * f - lw / 2, bodyBot - 1, lw, h * 0.26 + 1));
  ctx.fillStyle = DARK;
  LEGS.forEach(f => ctx.fillRect(bx + bodyW * f - lw / 2, y - hoofH, lw, hoofH));

  // ── Tail + tuft ──
  const tx = bx - w * 0.015, ty = bodyBot + h * 0.08;
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.6, w * 0.040);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx + bodyW * 0.06, bodyTop + bodyH * 0.14);
  ctx.quadraticCurveTo(bx - w * 0.07, bodyTop + bodyH * 0.60, tx, ty);
  ctx.stroke();
  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.ellipse(tx, ty + h * 0.012, w * 0.036, h * 0.046, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Neck wedge, then body ──
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(bx + bodyW * 0.70, bodyTop + bodyH * 0.08);
  ctx.lineTo(hx + hw * 0.10, hy + hh * 0.20);
  ctx.lineTo(hx + hw * 0.40, hy + hh * 1.05);
  ctx.lineTo(bx + bodyW * 0.88, bodyTop + bodyH * 0.60);
  ctx.closePath();
  ctx.fill();

  rrect(ctx, bx, bodyTop, bodyW, bodyH, Math.min(bodyH * 0.40, bodyW * 0.17));
  ctx.fill();

  // ── Head: a rounded skull plus a snout stepping forward and down.
  //    Both in the body colour — a dark muzzle patch reads as a beak, and a
  //    lone nose dot plus an eye reads as two eyes. Shape does the work here,
  //    leaving exactly one dark mark on the face. ──
  ctx.beginPath();                                   // ear, behind the skull
  ctx.ellipse(hx + hw * 0.12, hy + hh * 0.04, hw * 0.17, hh * 0.19, -0.5, 0, Math.PI * 2);
  ctx.fill();
  rrect(ctx, hx, hy, hw * 0.70, hh, hh * 0.40);      // skull
  ctx.fill();
  rrect(ctx, hx + hw * 0.40, hy + hh * 0.30, hw * 0.60, hh * 0.70, hh * 0.32); // snout
  ctx.fill();

  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.arc(hx + hw * 0.34, hy + hh * 0.36, Math.max(0.9, w * 0.024), 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();                                   // nostril, small enough to stay a detail
  ctx.ellipse(hx + hw * 0.88, hy + hh * 0.68, hw * 0.055, hh * 0.09, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Markings — small enough that the colour still dominates ──
  ctx.beginPath();
  ctx.ellipse(bx + bodyW * 0.30, bodyTop + bodyH * 0.36, bodyW * 0.10, bodyH * 0.19, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bx + bodyW * 0.57, bodyTop + bodyH * 0.66, bodyW * 0.072, bodyH * 0.135, 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawSaucer(ctx, cx, cy, w, col, phase, scale) {
  const s = scale === undefined ? 1 : scale;
  w *= s;
  const h = w * 0.30;
  const domePath = () => {
    ctx.beginPath();
    ctx.ellipse(cx, cy - h * 0.20, w * 0.27, h * 0.85, 0, Math.PI, 0);
  };
  const hullPath = () => {
    ctx.beginPath();
    ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  };

  // Dome
  domePath();
  ctx.fillStyle = '#3d5273'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.3; ctx.stroke();
  // Glint on the glass
  ctx.save();
  domePath(); ctx.clip();
  ctx.beginPath();
  ctx.ellipse(cx - w * 0.10, cy - h * 0.50, w * 0.05, h * 0.30, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.24)'; ctx.fill();
  ctx.restore();

  // Hull — neutral slate so the green stays the time signal
  hullPath();
  ctx.fillStyle = '#2b3d5e'; ctx.fill();
  // Darker underside gives the disc some thickness
  ctx.save();
  hullPath(); ctx.clip();
  ctx.fillStyle = '#1b2740';
  ctx.fillRect(cx - w / 2, cy + h * 0.05, w, h);
  ctx.restore();
  hullPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Chasing rim lights, in the timer colour
  const N = 5, lit = Math.floor(phase * 6) % N;
  for (let i = 0; i < N; i++) {
    const lx = cx - w * 0.34 + (w * 0.68) * (i / (N - 1));
    ctx.beginPath();
    ctx.arc(lx, cy + h * 0.12, Math.max(1.4, w * 0.032), 0, Math.PI * 2);
    ctx.fillStyle = i === lit ? col : 'rgba(255,255,255,0.16)';
    ctx.fill();
  }

  // Emitter the beam actually comes out of
  ctx.beginPath();
  ctx.ellipse(cx, cy + h * 0.40, w * 0.10, h * 0.17, 0, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();
}

function drawUFOTimer(ctx, W, H, pct, col, state) {
  if (W < 80 || H < 80) return;
  const now     = NOW();
  const elapsed = 1 - pct;
  const ot      = outroT();                       // 0 unless the finale is playing
  const groundY = H - Math.max(16, H * 0.12);

  // Stable starfield, regenerated only when the widget is resized
  if (!state.stars || state.starW !== W || state.starH !== H) {
    state.starW = W; state.starH = H;
    const n = Math.max(8, Math.round(W * H / 7000));
    state.stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * Math.max(10, groundY - 24),
      r: Math.random() * 1.1 + 0.4,
      a: Math.random() * 0.35 + 0.12,
    }));
  }
  state.stars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fill();
  });

  // Herd geometry
  const marginX = Math.max(14, W * 0.06);
  const spanW   = W - marginX * 2;
  const cowW    = Math.min(spanW / UFO_COWS * 0.90, Math.max(14, H * 0.20));
  const cowH    = cowW * 0.78;
  const cowX    = i => marginX + spanW * ((i + 0.5) / UFO_COWS);

  // Which cow is being taken, and how far along
  const prog   = Math.min(UFO_COWS, elapsed * UFO_COWS);
  const done   = Math.min(UFO_COWS, Math.floor(prog));
  const frac   = Math.min(1, prog - done);
  const active = done < UFO_COWS ? done : -1;

  const TRAVEL  = UFO_TRAVEL;
  const beaming = active >= 0 && frac >= TRAVEL;
  const riseT   = beaming ? (frac - TRAVEL) / (1 - TRAVEL) : 0;

  // Saucer position — glides to the next cow, then holds while it beams
  let ufoX;
  if (active < 0) {
    ufoX = cowX(UFO_COWS - 1);
  } else if (frac < TRAVEL) {
    const from = active === 0 ? cowX(0) : cowX(active - 1);
    const t = frac / TRAVEL;
    const e = t * t * (3 - 2 * t);                 // smoothstep
    ufoX = from + (cowX(active) - from) * e;
  } else {
    ufoX = cowX(active);
  }
  const hoverY = Math.max(24, groundY - Math.max(64, H * 0.54));
  let ufoY = hoverY + Math.sin(now / 620) * 3;
  let ufoScale = 1;

  // Outro: the saucer hangs a beat, then rockets away
  if (ot > 0) {
    const t = Math.max(0, (ot - 0.30) / 0.70);
    ufoY -= t * t * (hoverY + H * 0.5);
    ufoScale = Math.max(0.15, 1 - t * 0.7);
  }

  const ufoW = Math.max(38, Math.min(W * 0.26, cowW * 3.0));

  // ── Tractor beam ────────────────────────────────────────────────────────────
  if (beaming && ot === 0) {
    const halfTop = ufoW * 0.10, halfBot = cowW * 0.85;
    const beamTop = ufoY + ufoW * 0.12;   // matches the saucer's emitter
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(ufoX - halfTop, beamTop);
    ctx.lineTo(ufoX + halfTop, beamTop);
    ctx.lineTo(ufoX + halfBot, groundY);
    ctx.lineTo(ufoX - halfBot, groundY);
    ctx.closePath();
    ctx.fillStyle = col + '2b';
    ctx.fill();
    // Scan lines travelling up the beam
    ctx.clip();
    ctx.strokeStyle = col + '55';
    ctx.lineWidth = 2;
    const span = groundY - ufoY;
    for (let k = 0; k < 5; k++) {
      const p  = ((now / 700 + k / 5) % 1);
      const yy = groundY - p * span;
      const hw = halfTop + (halfBot - halfTop) * ((yy - ufoY) / span);
      ctx.beginPath(); ctx.moveTo(ufoX - hw, yy); ctx.lineTo(ufoX + hw, yy); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Ground ──────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#1a2844';
  ctx.fillRect(0, groundY, W, H - groundY);

  // Grass tufts, laid out once and reused so they don't shimmer between frames
  if (!state.tufts || state.tuftW !== W) {
    state.tuftW = W;
    const n = Math.max(8, Math.round(W / 24));
    state.tufts = Array.from({ length: n }, (_, i) => ({
      x: (i + 0.5) * (W / n) + (Math.random() - 0.5) * (W / n) * 0.7,
      h: 3 + Math.random() * 5,
      lean: (Math.random() - 0.5) * 2.4,
    }));
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  state.tufts.forEach(t => {
    ctx.moveTo(t.x, groundY + 1);
    ctx.lineTo(t.x + t.lean, groundY - t.h);
  });
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

  // ── The herd ────────────────────────────────────────────────────────────────
  for (let i = 0; i < UFO_COWS; i++) {
    if (i < done) continue;                        // already taken
    if (i === active && beaming) {
      // Rising up the beam: eases off the ground, tumbles, shrinks into the hull
      const lift = riseT * riseT * (3 - 2 * riseT);            // smoothstep
      const y  = groundY + (ufoY + ufoW * 0.12 - groundY) * lift;
      const x  = cowX(i) + (ufoX - cowX(i)) * lift;
      const sc = 1 - lift * 0.42;
      const wob = Math.sin(riseT * 13) * 0.5 * Math.min(1, riseT * 2.2);
      ctx.save();
      ctx.globalAlpha = riseT > 0.82 ? Math.max(0, (1 - riseT) / 0.18) : 1;
      drawCow(ctx, x, y, cowW * sc, cowH * sc, col, wob);
      ctx.restore();
    } else {
      // Grazing: a gentle idle bob keeps the herd alive
      const bob = Math.sin(now / 900 + i * 1.7) * (cowH * 0.02);
      drawCow(ctx, cowX(i), groundY + bob, cowW, cowH, col, 0);
    }
  }

  // ── Saucer ──────────────────────────────────────────────────────────────────
  drawSaucer(ctx, ufoX, ufoY, ufoW, col, now / 260, ufoScale);

  // ── Live sound ─────────────────────────────────────────────────────────────
  // One cue as each one goes. Gated on virtualNow: the exporter drives this
  // through a virtual clock, so without the check a single export would fire
  // every cue at once. The bookkeeping sits outside the gate so muting and
  // unmuting mid-run doesn't release a backlog.
  {
    const _st = state || mzOrphan, _ot = outroT();
    if (virtualNow === null && soundCheck.checked) {
      if (running && !_st.sndRun) mzPlay('start');
      // The cow protests when the beam catches it, not when it disappears.
      if (running && beaming && !_st.sndBeam) {
        mzPlay('moo', 1, mzVariant('moo', Math.max(0, active)));
      }
      // Hum follows the beam exactly, and stops if the timer is paused.
      if (running && beaming && ot === 0) mzHumOn('beam'); else mzHumOff();
    } else {
      mzHumOff();
    }
    _st.sndBeam = beaming;
    if (_ot <= 0) _st.sndFin = false;
    _st.sndRun = running;
    _st.sndDone = done;
  }
}

// ── Render: Sheep Herding ─────────────────────────────────────────────────────
// Same counting idea as Cow Abduction — the flock left in the field is the time
// remaining — but the motion is deliberately different: sheep walk horizontally
// into the barn with a leg cycle rather than being lifted straight up.
const SHEEP_COUNT = 10;

// A woolly sheep facing right. (x, y) is the centre of its feet. `step` drives
// the walk cycle; 0 means standing.
function drawSheepBody(ctx, x, y, w, h, col, step, stride = 1, graze = 0, flip = false) {
  // Head and legs take a darkened tint of the timer colour — near-black vanishes
  // against the night hills, and this keeps the whole animal on-palette.
  const DARK  = lerpHex(col, '#0b1120', 0.32);
  const bodyW = w * 0.64, bodyH = h * 0.46;
  const bx = x - w / 2, byTop = y - h * 0.80, byBot = byTop + bodyH;
  const legH = y - byBot;

  ctx.save();
  if (flip) { ctx.translate(x, 0); ctx.scale(-1, 1); ctx.translate(-x, 0); }

  // Short stubby legs — the shorter they are against the body, the cuter it reads
  const lw = Math.max(2.4, w * 0.098);
  ctx.fillStyle = DARK;
  [[0.20, 1], [0.38, -1], [0.64, -1], [0.82, 1]].forEach(([f, dir]) => {
    ctx.save();
    ctx.translate(bx + bodyW * f, byBot);
    ctx.rotate(Math.sin(step) * dir * 0.075 * stride);
    rrect(ctx, -lw / 2, -lw * 0.3, lw, legH + lw * 0.3, lw * 0.5);
    ctx.fill();
    ctx.restore();
  });

  // Fleece: a ring of small puffs around an ellipse, so the outline is bumpy all
  // the way round rather than a few big lobes.
  const cxp = bx + bodyW * 0.50, cyp = byTop + bodyH * 0.46;
  const rx = bodyW * 0.54, ry = bodyH * 0.50;
  ctx.fillStyle = col;
  const PUFFS = 13;
  for (let i = 0; i < PUFFS; i++) {
    const a = (i / PUFFS) * Math.PI * 2;
    const pr = (0.155 + 0.055 * Math.sin(i * 2.7)) * w * 0.5;
    ctx.beginPath();
    ctx.arc(cxp + Math.cos(a) * rx * 0.86, cyp + Math.sin(a) * ry * 0.80, pr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(cxp, cyp, rx * 0.92, ry * 0.92, 0, 0, Math.PI * 2);
  ctx.fill();

  const hw = w * 0.36, hh = h * 0.36;
  const hx = bx + bodyW * 0.72, hy = byTop + bodyH * 0.14;
  ctx.save();
  if (graze > 0.001) {
    // Mostly a drop with a slight tilt — a large rotation swings the muzzle out
    // past the body and the head reads as having fallen off.
    ctx.translate(graze * hw * 0.22, graze * h * 0.25);
    const px = hx + hw * 0.15, py = hy + hh * 0.5;
    ctx.translate(px, py); ctx.rotate(graze * 0.42); ctx.translate(-px, -py);
  }
  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.ellipse(hx + hw * 0.10, hy + hh * 0.16, hw * 0.26, hh * 0.20, -0.85, 0, Math.PI * 2);
  ctx.fill();                                                                  // ear
  rrect(ctx, hx + hw * 0.02, hy + hh * 0.06, hw * 0.92, hh * 0.80, hw * 0.42); ctx.fill(); // skull
  rrect(ctx, hx + hw * 0.44, hy + hh * 0.36, hw * 0.60, hh * 0.44, hh * 0.22); ctx.fill(); // muzzle
  // Fleecy forelock tufts over the brow
  ctx.fillStyle = col;
  [[0.16, -0.02, 0.20], [0.42, -0.09, 0.23], [0.68, -0.01, 0.18]].forEach(([dx, dy, r]) => {
    ctx.beginPath();
    ctx.arc(hx + hw * dx, hy + hh * dy, hw * r, 0, Math.PI * 2);
    ctx.fill();
  });
  // A bigger eye with a pupil does most of the work of making it look friendly
  ctx.fillStyle = '#f7faff';
  ctx.beginPath();
  ctx.arc(hx + hw * 0.50, hy + hh * 0.36, Math.max(1.2, w * 0.036), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#101a2e';
  ctx.beginPath();
  ctx.arc(hx + hw * 0.52, hy + hh * 0.37, Math.max(0.6, w * 0.018), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();   // head
  ctx.restore();   // facing
}

// The sheepdog: low, dark, pointed ears and a raised tail.
function drawDog(ctx, x, y, w, h, step) {
  // A border collie: four legs, a plumed tail, pricked ears and a small white
  // chest patch. The old one was a two-legged slab and read as a generic animal.
  const DK = '#4a5f8a', LT = '#dce6f5';
  const bodyW = w * 0.72, bodyH = h * 0.38;
  const bx = x - w / 2, byTop = y - h * 0.68, byBot = byTop + bodyH;
  const legH = y - byBot;

  ctx.fillStyle = DK;
  const lw = Math.max(1.8, w * 0.075);
  [[0.22, 1], [0.34, 1], [0.70, -1], [0.82, -1]].forEach(([f, dir]) => {
    ctx.save();
    ctx.translate(bx + bodyW * f, byBot);
    ctx.rotate(Math.sin(step) * dir * 0.34);
    rrect(ctx, -lw / 2, -lw * 0.3, lw, legH + lw * 0.3, lw * 0.5);
    ctx.fill();
    ctx.restore();
  });

  // Plumed tail, carried up
  ctx.strokeStyle = DK;
  ctx.lineWidth = Math.max(2.4, w * 0.095);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx + bodyW * 0.06, byTop + bodyH * 0.42);
  ctx.bezierCurveTo(bx - w * 0.07, byTop + bodyH * 0.28,
                    bx - w * 0.09, byTop - h * 0.08,
                    bx + w * 0.02, byTop - h * 0.20);
  ctx.stroke();

  rrect(ctx, bx, byTop, bodyW, bodyH, bodyH * 0.46);
  ctx.fill();
  // Small chest patch, low and forward — a marking rather than a badge
  ctx.fillStyle = LT;
  ctx.beginPath();
  ctx.ellipse(bx + bodyW * 0.84, byTop + bodyH * 0.80, bodyW * 0.10, bodyH * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  const hw = w * 0.30, hh = h * 0.26;
  const hx = bx + bodyW * 0.76, hy = byTop - hh * 0.40;
  ctx.fillStyle = DK;
  [[0.14, -0.34], [0.44, -0.06]].forEach(([ex, tilt]) => {   // pricked ears
    ctx.save();
    ctx.translate(hx + hw * ex, hy + hh * 0.18);
    ctx.rotate(tilt);
    ctx.beginPath();
    ctx.moveTo(-hw * 0.12, hh * 0.16);
    ctx.lineTo(0, -hh * 0.44);
    ctx.lineTo(hw * 0.14, hh * 0.14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  });
  rrect(ctx, hx, hy, hw * 0.82, hh, hw * 0.36); ctx.fill();                    // skull
  rrect(ctx, hx + hw * 0.58, hy + hh * 0.34, hw * 0.40, hh * 0.44, hh * 0.18); ctx.fill(); // snout
  ctx.fillStyle = LT;
  rrect(ctx, hx + hw * 0.72, hy + hh * 0.40, hw * 0.26, hh * 0.32, hh * 0.14); ctx.fill(); // muzzle tip
  ctx.fillStyle = '#101a2e';
  ctx.beginPath();
  ctx.ellipse(hx + hw * 0.94, hy + hh * 0.52, hw * 0.07, hh * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(hx + hw * 0.50, hy + hh * 0.40, Math.max(0.9, w * 0.030), 0, Math.PI * 2);
  ctx.fill();
}

function drawSheep(ctx, W, H, pct, col, state) {
  if (W < 120 || H < 110) return;
  const now = NOW();
  const elapsed = 1 - pct;
  const ot = outroT();

  // ── Three rolling hills, back to front. Each is a soft curve the animals
  //    stand on; drawing a nearer hill after its flock hides their feet, which
  //    is what gives the scene depth without any perspective maths.
  // Horizon sits high: the interest is all on the ground, and a 60% sky left
  // most of the widget empty. More pasture also spreads the hills further apart.
  const BANDS = [
    { base: 0.42, amp: 0.034, ph: 0.5, k: 1.5, s: 0.55, tone: '#232d4d' },
    { base: 0.65, amp: 0.046, ph: 2.3, k: 2.1, s: 0.76, tone: '#2a375a' },
    { base: 0.95, amp: 0.056, ph: 4.4, k: 1.7, s: 1.00, tone: '#324268' },
  ];
  const crest = (x, b) =>
    H * b.base - H * b.amp * (Math.sin(x / W * Math.PI * b.k + b.ph) * 0.65
                            + Math.sin(x / W * Math.PI * b.k * 2.3 + b.ph * 1.7) * 0.35);
  // Continuous band position so a sheep can walk from one hill to another
  const groundAt = (x, bi) => {
    const lo = Math.max(0, Math.min(BANDS.length - 1, Math.floor(bi)));
    const hi = Math.max(0, Math.min(BANDS.length - 1, lo + 1));
    const t = Math.max(0, Math.min(1, bi - lo));
    return {
      y: crest(x, BANDS[lo]) * (1 - t) + crest(x, BANDS[hi]) * t,
      s: BANDS[lo].s * (1 - t) + BANDS[hi].s * t,
    };
  };

  const BARN = { x: 0.74, b: 1.0 };

  if (!state.ready || state.sw !== W || state.sh !== H) {
    state.ready = true; state.sw = W; state.sh = H;
    state.stars = Array.from({ length: Math.max(10, Math.round(W * H / 9000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.40,
      r: Math.random() * 0.9 + 0.35, a: Math.random() * 0.35 + 0.15,
      tw: Math.random() * Math.PI * 2,
    }));
    state.trees = [
      { x: 0.10, b: 0 }, { x: 0.30, b: 0 }, { x: 0.90, b: 0 }, { x: 0.05, b: 1 },
    ];
    // Spread over the hills, then ordered by how near the barn each one is
    const spots = [
      [0.10, 2], [0.30, 2], [0.52, 2], [0.74, 2],
      [0.16, 1], [0.40, 1], [0.58, 1],
      [0.22, 0], [0.46, 0], [0.66, 0],
    ];
    state.flock = spots.map(([x, b]) => ({
      x: x + (Math.random() - 0.5) * 0.05,
      b,
      ph: Math.random() * Math.PI * 2,
      sp: 0.7 + Math.random() * 0.6,
      wx: 0.030 + Math.random() * 0.035,     // how far it mooches across
      wb: 0.28 + Math.random() * 0.17,       // and how far toward / away from us
    })).sort((p, q) =>
      ((p.x - BARN.x) ** 2 + ((p.b - BARN.b) * 0.30) ** 2) -
      ((q.x - BARN.x) ** 2 + ((q.b - BARN.b) * 0.30) ** 2));
  }

  // ── Sky ───────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#161c33';
  ctx.fillRect(0, 0, W, H);
  state.stars.forEach(st => {
    ctx.globalAlpha = st.a * (0.6 + 0.4 * Math.sin(now / 1600 + st.tw));
    ctx.fillStyle = '#ffeccd';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Who has gone in ───────────────────────────────────────────────────────
  const prog   = Math.min(SHEEP_COUNT, elapsed * SHEEP_COUNT);
