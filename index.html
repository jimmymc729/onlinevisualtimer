  const done   = Math.min(SHEEP_COUNT, Math.floor(prog));
  const frac   = Math.min(1, prog - done);
  const active = done < SHEEP_COUNT ? done : -1;
  const WAIT   = 0.20;
  const walking = active >= 0 && frac >= WAIT;
  const walkT  = walking ? (frac - WAIT) / (1 - WAIT) : 0;
  const shut   = ot > 0 ? Math.min(1, ot / 0.55) : 0;

  const bp = groundAt(BARN.x * W, BARN.b);
  const barnW = Math.min(W * 0.30, 210) * bp.s;
  const barnH = barnW * 1.00;
  const doorW = barnW * 0.40, doorH = barnH * 0.46;
  const barnX = BARN.x * W, barnBase = bp.y;
  const doorX = barnX - doorW / 2, doorY = barnBase - doorH;

  const drawBarn = () => {
    const bx = barnX - barnW / 2, by = barnBase - barnH;
    ctx.fillStyle = '#212a45';
    ctx.beginPath();
    ctx.moveTo(bx + barnW, by + barnH * 0.32);
    ctx.lineTo(bx + barnW * 1.22, by + barnH * 0.42);
    ctx.lineTo(bx + barnW * 1.22, barnBase - barnH * 0.03);
    ctx.lineTo(bx + barnW, barnBase);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#33406a';
    rrect(ctx, bx, by + barnH * 0.32, barnW, barnH * 0.68, 4); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx - barnW * 0.08, by + barnH * 0.35);
    ctx.lineTo(bx + barnW * 0.5, by);
    ctx.lineTo(bx + barnW * 1.08, by + barnH * 0.35);
    ctx.closePath();
    ctx.fillStyle = '#445280'; ctx.fill();
    // plain dark doorway — no lamplight
    ctx.fillStyle = '#12182a';
    rrect(ctx, doorX, doorY, doorW, doorH, 3); ctx.fill();
    ctx.fillStyle = '#12182a';
    rrect(ctx, bx + barnW * 0.42, by + barnH * 0.44, barnW * 0.16, barnH * 0.12, 2); ctx.fill();
    if (shut > 0) {
      ctx.fillStyle = '#445280';
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 1.2;
      [-1, 1].forEach(side => {
        const w = (doorW / 2) * shut;
        const x = side < 0 ? doorX : doorX + doorW - w;
        rrect(ctx, x, doorY, Math.max(0.5, w), doorH, 2);
        ctx.fill(); ctx.stroke();
      });
    }
  };

  // ── Everything that stands on the ground, grouped by which hill ───────────
  const buckets = [[], [], []];
  const baseSize = Math.min(W, H) * 0.17;

  // The sheep at the door is drawn separately, after the barn, clipped to the
  // opening — so it walks *into* the doorway instead of fading out on the wall.
  let entering = null;
  const atBarn = [];        // drawn after the barn, so the approach isn't hidden by it
  const ENTER = 0.72;                        // walkT at which it reaches the door

  for (let i = 0; i < SHEEP_COUNT; i++) {
    if (i < done) continue;
    const f = state.flock[i];
    // Two out-of-phase sines per axis so the path never looks like a metronome.
    // Sampling it twice gives velocity, and everything else follows from that:
    // which way it faces, how hard its legs swing, and whether it's grazing.
    const wander = t => ({
      x: f.x + Math.sin(t * 0.45 * f.sp + f.ph) * f.wx
             + Math.sin(t * 0.24 * f.sp + f.ph * 1.7) * f.wx * 0.55,
      b: f.b + Math.sin(t * 0.31 * f.sp + f.ph * 2.3) * f.wb,
    });
    const T = now / 1000;
    const p0 = wander(T), p1 = wander(T + 0.06);
    const vx = (p1.x - p0.x) / 0.06;                 // field-widths per second
    // Normalised against this sheep's own top speed — absolute thresholds left
    // every sheep permanently half-grazing instead of alternating.
    const vmax = f.wx * f.sp * (0.45 + 0.55 * 0.24) || 1e-6;
    const u = Math.min(1, Math.abs(vx) / vmax);
    let flip = vx < 0;                               // facing
    let stride = Math.min(1, u * 1.35);              // legs swing with real speed
    // Grazing runs on its own slow rhythm — sheep browse in bouts — but the head
    // comes up whenever it's actually moving off.
    const bout = 0.5 + 0.5 * Math.sin(T * 0.13 * f.sp + f.ph * 3.1);
    let graze = Math.max(0, Math.min(1, bout * 1.65 - u * 0.7));
    stride *= 1 - graze * 0.6;      // head down means a slow shuffle, not a stride
    let x = p0.x * W;
    let b = p0.b, step = now / 260 * f.sp + f.ph;

    if (i === active && walking && walkT >= ENTER) {
      // Through the door: step up into the dark and shrink away
      const t = (walkT - ENTER) / (1 - ENTER);
      const g = groundAt(barnX, BARN.b);
      const sw = baseSize * g.s;
      entering = () => {
        ctx.save();
        rrect(ctx, doorX, doorY, doorW, doorH, 3);
        ctx.clip();
        const sc = 1 - t * 0.42;
        ctx.globalAlpha = 1 - t * 0.30;
        drawSheepBody(ctx, barnX, barnBase - t * doorH * 0.62,
                      sw * sc, sw * 0.80 * sc, col, now / 110, 1, 0, false);
        ctx.restore();
      };
      continue;
    }

    if (i === active && walking) {
      // Crossing the field to the door
      const w = walkT / ENTER;
      const e = w * w * (3 - 2 * w);
      const nx = (f.x + (BARN.x - f.x) * e) * W;
      flip = nx < x;                         // face the way it set off
      x = nx;
      b = f.b + (BARN.b - f.b) * e;
      step = now / 150;                      // a purposeful trot, not a sprint
      stride = 1; graze = 0;                 // head up, properly walking
    }

    const g = groundAt(x, b);
    const sw = baseSize * g.s;
    const bob = Math.sin(now / 950 + f.ph) * sw * 0.02;
    const draw = () => drawSheepBody(ctx, x, g.y + bob, sw, sw * 0.80, col, step, stride, graze, flip);
    // Once it overlaps the barn it has to paint after it, or it disappears
    // behind the wall for the last stretch before the door.
    if (i === active && walking && Math.abs(x - barnX) < barnW * 0.8) atBarn.push(draw);
    else buckets[Math.max(0, Math.min(2, Math.round(b)))].push({ x, draw });
  }

  // Dog trots to whichever sheep is next
  if (ot === 0 && active >= 0) {
    const f = state.flock[active];
    const tx = (walking ? f.x + (BARN.x - f.x) * walkT : f.x) - 0.085;
    const tb = walking ? f.b + (BARN.b - f.b) * walkT : f.b;
    if (state.dogX === undefined) { state.dogX = tx; state.dogB = tb; }
    const px = state.dogX;
    state.dogX += (tx - state.dogX) * 0.055;
    state.dogB += (tb - state.dogB) * 0.055;
    const moving = Math.abs(state.dogX - px) > 0.0012;
    const dg = groundAt(state.dogX * W, state.dogB);
    const dw = baseSize * 0.78 * dg.s;
    buckets[Math.max(0, Math.min(2, Math.round(state.dogB)))].push({ x: state.dogX * W,
      draw: () => drawDog(ctx, state.dogX * W, dg.y, dw, dw * 0.72, moving ? now / 70 : 0) });
  }



  // ── Paint back to front: hill, then what stands on it ─────────────────────
  BANDS.forEach((band, bi) => {
    ctx.fillStyle = band.tone;
    ctx.beginPath();
    ctx.moveTo(0, crest(0, band));
    for (let x = 0; x <= W; x += 6) ctx.lineTo(x, crest(x, band));
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();

    if (bi === 0) {
      state.trees.forEach(t => {
        if (t.b !== 0) return;
        const g = groundAt(t.x * W, 0);
        const th = baseSize * 1.5 * g.s;
        ctx.fillStyle = '#1b2440';
        ctx.fillRect(t.x * W - th * 0.05, g.y - th * 0.44, th * 0.10, th * 0.45);
        [[0, -0.64, 0.30], [-0.20, -0.52, 0.23], [0.20, -0.53, 0.24]].forEach(([dx, dy, r]) => {
          ctx.beginPath(); ctx.arc(t.x * W + th * dx, g.y + th * dy, th * r, 0, Math.PI * 2); ctx.fill();
        });
      });
    }
    buckets[bi].sort((a, b) => a.x - b.x).forEach(it => it.draw());
    // The barn paints after everything standing on its hill, and the sheep in
    // the doorway after the barn — sorting these by x put an arriving sheep in
    // front of the wall instead of inside the opening.
    if (bi === Math.round(BARN.b)) {
      drawBarn();
      atBarn.forEach(d => d());
      if (entering) entering();
    }
  });

  // ── Live sound ─────────────────────────────────────────────────────────────
  // One cue as each one goes. Gated on virtualNow: the exporter drives this
  // through a virtual clock, so without the check a single export would fire
  // every cue at once. The bookkeeping sits outside the gate so muting and
  // unmuting mid-run doesn't release a backlog.
  {
    const _st = state || mzOrphan, _ot = outroT();
    if (virtualNow === null && soundCheck.checked) {
      if (running && !_st.sndRun) mzPlay('bark1');                 // dog sets off
      if (running && _st.sndDone !== undefined && done > _st.sndDone) {
        mzPlay('baa', 1, mzVariant('baa', _st.sndDone));           // a different baa each time
      }
      if (_ot > 0 && !_st.sndFin) { mzPlay('bark2'); _st.sndFin = true; }   // and again at the gate
    }
    if (_ot <= 0) _st.sndFin = false;
    _st.sndRun = running;
    _st.sndDone = done;
  }
}

// ── Render: Candle ────────────────────────────────────────────────────────────
// The wax column is the time: it burns down, so the amount of colour on screen
// is the amount of time left, same read as Blocks. The flame is warm rather than
// timer-coloured because fire reads as fire — it's a prop, not the signal, the
// same split used for the saucer in Cow Abduction. Flat fills throughout.
function drawCandle(ctx, W, H, pct, col, state) {
  if (W < 60 || H < 90) return;
  const now = NOW();
  const ot  = outroT();                 // >0 while the finale plays
  const cx  = W / 2;
  const PAD = Math.max(10, H * 0.045);

  // Holder
  const holderW = Math.min(W * 0.56, 170);
  const holderH = Math.max(9, H * 0.042);
  const holderY = H - PAD - holderH;

  // Wax column
  const candleW  = Math.min(W * 0.32, holderW * 0.58);
  const flameRoom = Math.max(42, H * 0.17);
  const maxH  = Math.max(20, holderY - (PAD + flameRoom));
  const stub  = Math.max(6, H * 0.022);
  const candleH  = stub + Math.max(0, maxH - stub) * pct;
  const candleTop = holderY - candleH;
  const left = cx - candleW / 2;

  // Stable drips + melt rim, laid out once per size
  if (!state.candleW || state.candleW !== W || state.candleH !== H) {
    state.candleW = W; state.candleH = H;
    // Spread down the column and varied in length — clustered equal-length
    // drips read as a symmetrical collar rather than running wax.
    state.drips = [
      { side: -1, off: 0.05, len: 0.55, w: 0.15 },
      { side:  1, off: 0.10, len: 0.30, w: 0.13 },
      { side:  1, off: 0.34, len: 0.62, w: 0.16 },
    ].map(d => ({ ...d,
      off: d.off + Math.random() * 0.05,
      len: d.len * (0.8 + Math.random() * 0.4) }));
  }

  // ── Melted wax pooling on the holder ───────────────────────────────────────
  const elapsed = 1 - pct;
  // Clamped to the holder — an unbounded pool spills off the dish at the end
  const poolW = Math.min(candleW * (0.62 + elapsed * 0.95), holderW * 0.88);
  const poolH = Math.max(3, candleW * 0.10 * (0.5 + elapsed));
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(cx, holderY + 1, poolW / 2, poolH, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Wax column ─────────────────────────────────────────────────────────────
  rrect(ctx, left, candleTop, candleW, candleH + 2, Math.min(candleW * 0.16, 10));
  ctx.fillStyle = col;
  ctx.fill();

  // Softly rounded, slightly uneven melt rim
  ctx.beginPath();
  ctx.moveTo(left, candleTop + candleW * 0.10);
  ctx.quadraticCurveTo(cx - candleW * 0.22, candleTop - candleW * 0.09, cx, candleTop - candleW * 0.04);
  ctx.quadraticCurveTo(cx + candleW * 0.26, candleTop - candleW * 0.11, left + candleW, candleTop + candleW * 0.12);
  ctx.closePath();
  ctx.fill();

  // Drips running from the rim
  state.drips.forEach(d => {
    const x = cx + d.side * candleW * 0.50;   // on the edge, so they run down the outside
    const y0 = candleTop + candleW * d.off;
    const w  = candleW * d.w;
    // Clamp to the holder, allowing for the rounded end-cap — otherwise on a
    // burnt-down candle the cap alone still pokes out below the dish.
    const len = Math.min(
      candleW * d.len * (0.7 + 0.3 * Math.sin(now / 1400 + d.off * 9)),
      holderY - y0 - w / 2 - candleW * 0.06);
    if (len <= 0) return;
    rrect(ctx, x - w / 2, y0, w, len, w / 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y0 + len, w / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Shading down one side gives the column some roundness (flat tone, no gradient)
  ctx.save();
  rrect(ctx, left, candleTop, candleW, candleH + 2, Math.min(candleW * 0.16, 10));
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  ctx.fillRect(left + candleW * 0.72, candleTop - candleW, candleW * 0.28, candleH + candleW * 2);
  ctx.restore();

  // ── Wick ───────────────────────────────────────────────────────────────────
  const wickH = Math.max(4, candleW * 0.20);
  ctx.strokeStyle = '#2a1f18';
  ctx.lineWidth = Math.max(1.6, candleW * 0.055);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, candleTop - candleW * 0.03);
  ctx.lineTo(cx + Math.sin(now / 500) * wickH * 0.18, candleTop - wickH);
  ctx.stroke();

  const tipY = candleTop - wickH;

  // ── Flame, or the smoke that replaces it once time is up ──────────────────
  if (ot > 0 || pct <= 0) {
    // Outro: the flame is out; a wisp of smoke curls up and fades
    const t = ot > 0 ? ot : 1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.strokeStyle = '#8b95a8';
    ctx.lineWidth = Math.max(1.4, candleW * 0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    const rise = (Math.max(28, H * 0.16)) * (0.25 + t);
    ctx.moveTo(cx, tipY);
    for (let i = 1; i <= 12; i++) {
      const f = i / 12;
      ctx.lineTo(cx + Math.sin(f * 4.2 + now / 420) * candleW * 0.30 * f, tipY - rise * f);
    }
    ctx.stroke();
    ctx.restore();
  } else {
    // Two flat shapes: outer flame and a hotter core. Flicker is two sines at
    // different rates so it never settles into a visible loop.
    const flick = 1 + Math.sin(now / 88) * 0.07 + Math.sin(now / 31) * 0.035;
    const fh = Math.max(14, H * 0.095) * flick;
    const fw = fh * 0.50;
    const fx = cx + Math.sin(now / 240) * fw * 0.13;

    const teardrop = (w, h) => {
      ctx.beginPath();
      ctx.moveTo(fx, tipY - h);
      ctx.bezierCurveTo(fx + w, tipY - h * 0.46, fx + w * 0.74, tipY + h * 0.06, fx, tipY + h * 0.06);
      ctx.bezierCurveTo(fx - w * 0.74, tipY + h * 0.06, fx - w, tipY - h * 0.46, fx, tipY - h);
      ctx.closePath();
    };
    teardrop(fw, fh);               ctx.fillStyle = '#f0a027'; ctx.fill();
    teardrop(fw * 0.52, fh * 0.60); ctx.fillStyle = '#ffd772'; ctx.fill();
    teardrop(fw * 0.24, fh * 0.30); ctx.fillStyle = '#fff6d8'; ctx.fill();
  }

  // ── Holder ─────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#243354';
  rrect(ctx, cx - holderW / 2, holderY, holderW, holderH, holderH * 0.42);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.20)';
  ctx.lineWidth = 1.5;
  rrect(ctx, cx - holderW / 2, holderY, holderW, holderH, holderH * 0.42);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rrect(ctx, cx - holderW / 2 + 4, holderY + 2, holderW - 8, holderH * 0.40, 3);
  ctx.fill();
}

// ── Render: Hourglass — curved glass, dome sand pile, stream ─────────────────
function drawHourglass(ctx, W, H, pct, col, state) {
  const cx   = W / 2;
  const capH = 16;
  const PAD  = 32;
  const y0   = PAD;
  const bot  = H - PAD;
  const mid  = (y0 + bot) / 2;
  const topH = mid - y0;
  const botH = bot - mid;

  // Glass dimensions — wide bulges, very narrow neck for drama
  const halfW = Math.min(W * 0.46, 110);
  const neck  = 3.5;

  // ── Glass path — classic hourglass curves ─────────────────────────────────
  // Each half: stays wide, then sweeps sharply to the neck at the midpoint.
  // Two bezier segments per side. cp1 keeps the wall wide, cp2 arrives at neck.
  function glassPath() {
    ctx.beginPath();
    ctx.moveTo(cx - halfW, y0);
    ctx.lineTo(cx + halfW, y0);

    // Right: top → neck
    ctx.bezierCurveTo(
      cx + halfW,      y0 + topH * 0.50,   // stay wide through the upper half
      cx + neck + 10,  mid - topH * 0.05,  // curve hard to neck near the waist
      cx + neck,       mid
    );
    // Right: neck → bottom
    ctx.bezierCurveTo(
      cx + neck + 10,  mid + botH * 0.05,
      cx + halfW,      bot - botH * 0.50,
      cx + halfW,      bot
    );

    ctx.lineTo(cx - halfW, bot);

    // Left: bottom → neck
    ctx.bezierCurveTo(
      cx - halfW,      bot - botH * 0.50,
      cx - neck - 10,  mid + botH * 0.05,
      cx - neck,       mid
    );
    // Left: neck → top
    ctx.bezierCurveTo(
      cx - neck - 10,  mid - topH * 0.05,
      cx - halfW,      y0 + topH * 0.50,
      cx - halfW,      y0
    );

    ctx.closePath();
  }

  const elapsed = 1 - pct;

  // ── Glass interior (dark, semi-transparent) ───────────────────────────────
  glassPath();
  ctx.fillStyle = 'rgba(10, 16, 30, 0.88)';
  ctx.fill();

  // ── Clip sand to glass shape ──────────────────────────────────────────────
  ctx.save();
  glassPath();
  ctx.clip();

  // Top sand — level drops as time runs out
  // pct=1 → surface at y0 (full); pct=0 → surface at mid (empty)
  const y_top = y0 + elapsed * topH;
  if (pct > 0.003) {
    ctx.fillStyle = col;
    ctx.fillRect(cx - halfW - 2, y_top, halfW * 2 + 4, mid - y_top + 2);
    // Crisp surface highlight
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.fillRect(cx - halfW + 6, y_top, halfW * 2 - 12, 2.5);
  }

  // Bottom sand pile — grows upward as elapsed increases
  const pile_h    = elapsed * botH * 0.90;
  const y_pile    = bot - pile_h;
  const dome_rise = Math.min(pile_h * 0.22, 16);

  if (elapsed > 0.003) {
    ctx.fillStyle = col;
    ctx.fillRect(cx - halfW - 2, y_pile, halfW * 2 + 4, bot - y_pile + 2);
    // Domed top surface — sand settles in a natural mound
    ctx.beginPath();
    ctx.moveTo(cx - halfW - 2, y_pile);
    ctx.quadraticCurveTo(cx, y_pile - dome_rise, cx + halfW + 2, y_pile);
    ctx.fill();
    // Subtle ridge along the dome crest
    ctx.beginPath();
    ctx.moveTo(cx - halfW * 0.45, y_pile - dome_rise * 0.38);
    ctx.quadraticCurveTo(cx, y_pile - dome_rise - 1, cx + halfW * 0.45, y_pile - dome_rise * 0.38);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // ── Sand stream through the neck ─────────────────────────────────────────
  // Seconds, not a fraction of the duration — see the note in drawLiquid. At
  // 10 minutes this held the sand stream back for 6 seconds and cut it 7 short.
  if (running && pct * totalSeconds > 0.8) {
    const streamEnd = elapsed > 0.003 ? y_pile - dome_rise : bot - 4;
    // Solid continuous stream — no dash
    ctx.beginPath();
    ctx.moveTo(cx, mid + 1);
    ctx.lineTo(cx, streamEnd);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.setLineDash([]);
    ctx.stroke();
  }

  // ── Falling sand grains ───────────────────────────────────────────────────
  const now = NOW();
  if (running && pct * totalSeconds > 0.8) {
    if (now - state.lastSpawn > 55) {
      state.lastSpawn = now;
      for (let i = 0; i < 3; i++) {
        state.grains.push({
          x:  cx + (Math.random() - 0.5) * neck * 1.8,
          y:  mid + 3,
          vy: 1.8 + Math.random() * 2.2,
          r:  1.2 + Math.random() * 1.0,
        });
      }
    }
  }
  const grainStop = elapsed > 0.003 ? y_pile - dome_rise - 1 : bot - 2;
  state.grains = state.grains.filter(g => {
    g.vy += 0.32;
    g.y  += g.vy;
    if (g.y >= grainStop) return false;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    return true;
  });

  ctx.restore();

  // ── Glass walls — bright crisp outline ────────────────────────────────────
  glassPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // ── Left-edge highlight — makes the glass read as glassy ─────────────────
  ctx.save();
  glassPath();
  ctx.clip();
  // Left inner edge of top bulge
  ctx.beginPath();
  ctx.moveTo(cx - halfW + 9, y0 + 10);
  ctx.bezierCurveTo(
    cx - halfW + 9, y0 + topH * 0.48,
    cx - neck - 7,  mid - topH * 0.05,
    cx - neck + 1,  mid
  );
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();
  // Right-edge secondary highlight (fainter)
  ctx.beginPath();
  ctx.moveTo(cx + halfW - 6, y0 + 10);
  ctx.bezierCurveTo(
    cx + halfW - 6, y0 + topH * 0.40,
    cx + neck + 6,  mid - topH * 0.08,
    cx + neck - 1,  mid
  );
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 5;
  ctx.stroke();
  ctx.restore();

  // ── End caps ─────────────────────────────────────────────────────────────
  const capW = halfW * 2 + 16;
  const capX = cx - capW / 2;
  ctx.fillStyle = '#1e2e42';
  ctx.strokeStyle = 'rgba(255,255,255,0.24)';
  ctx.lineWidth = 1.5;
  rrect(ctx, capX, y0 - capH, capW, capH, 7); ctx.fill(); ctx.stroke();
  rrect(ctx, capX, bot,       capW, capH, 7); ctx.fill(); ctx.stroke();
  // Cap top highlights
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  rrect(ctx, capX + 4, y0 - capH + 2, capW - 8, capH * 0.45, 4); ctx.fill();
  rrect(ctx, capX + 4, bot + 2,        capW - 8, capH * 0.45, 4); ctx.fill();
}

// ── Render: Asteroid Blaster ──────────────────────────────────────────────────
// One idea holds this timer together: A SHOT IS A UNIT OF TIME.
//
// Asteroids split big → medium → small → chip, so clearing one large always
// costs exactly 1 + M + M² + M³ shots. That makes the total shot count known
// before the first frame, and every shot worth the same slice of the clock.
// Shot k lands at (k / S) of the duration, so the final shot lands on zero by
// construction rather than by tuning — and "shots left" and "time left" are the
// same number.
//
// Everything below is a closed-form function of elapsed time. Nothing
// accumulates, so seeking is exact and the video exporter renders the same run
// the screen showed. The seed is configuration, not state.
const AST_TRAVEL = 0.55;   // seconds a shot spends in flight
const AST_BOOM   = 0.55;   // seconds an explosion stays on screen
const AST_GAP    = 5;      // seconds a shot is worth: the field scales, the pace doesn't
const AST_TIERS  = 4;      // large, medium, small, chip
// Radius of each tier as a fraction of the large. Four tiers means the large has
// to be big for the chip to still be visible, which is the point — the field
// opens with rocks you can see from the back of a classroom.
const AST_TIER_R = [1, 0.64, 0.44, 0.30];
const AST_VAR    = 1.18;   // largest per-rock size variation
const AST_DRIFT  = 0.020;  // how fast a rock crosses the card, in widths per second
const AST_BURST  = 1.30;   // extra speed a fragment leaves its parent with, in radii/s

// How many asteroids and how finely they split. The shot count IS the clock, so
// a longer timer gets a DEEPER field, never a slower gun. Keeping L small is
// what keeps the opening rocks big; the shot budget comes from the depth of the
// cascade instead of from the number of starting rocks.
function astPlan(secs) {
  let frag = 2, per = 15;                       // 1 + M + M² + M³
  let L = Math.max(1, Math.round(secs / (AST_GAP * per)));
  if (L > 8) {
    frag = 3; per = 40;
    L = Math.max(1, Math.round(secs / (AST_GAP * per)));
  }
  L = Math.min(10, L);
  const S = L * per;
  // A shot cannot be fired before the timer starts, so on a very short run the
  // flight time has to come down with the cadence.
  return { L, M: frag, per, S, travel: Math.min(AST_TRAVEL, (secs / S) * 0.6) };
}

function astHash(seed, a, b, c, d) {
  let h = (seed * 2654435761 + a * 374761393 + b * 668265263
           + c * 2246822519 + d * 3266489917) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 3266489917) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ── The field ────────────────────────────────────────────────────────────────
// Built once per (plan, seed, card size) and cached, like the maze is.
//
// Two things are decided here. First the KILL ORDER: which rock each shot
// destroys. Strict depth-first — finish one large completely, then start the
// next — was the first version and it made the screen feel dead, because all
// the other rocks just sat there for minutes waiting their turn. Instead the
// order is a seeded random walk over the tree, weighted towards deeper rocks so
// that a big one cracking open stays an occasional event rather than the first
// thing that happens to all of them.
//
// Second, each rock's MOTION: a start point and a velocity. Rocks drift across
// the card and pass over one another, which is what an asteroid field does.
// Letting them overlap is also what lets them be big — the previous version
// spent its whole size budget guaranteeing no two rocks ever touched.
// How strongly the order prefers finishing off small rocks. High values make the
// run predictable — it just grinds the smallest thing available every time. Low
// values leave fragments lying around and the rock count creeps up. 2.2 mixes
// mediums and smalls into the sequence without letting it pile up.
const AST_DEPTH_BIAS = 1.8;
// How much less likely the order is to shoot the same asteroid's family twice
// running, when something else is available.
const AST_SAME_FAMILY = 0.18;
// How many large-openings ahead of consumption the schedule runs.
const AST_LOOKAHEAD = 0.8;
const astCache = new Map();

function astField(p, seed, W, H, secs) {
  // Rounded coarsely: the stations are the expensive part of this build and a
  // resize drag would otherwise rebuild them every couple of pixels.
  const key = seed + '#' + Math.round(W / 8) + 'x' + Math.round(H / 8)
            + '#' + p.L + '#' + p.M + '#' + Math.round(secs);
  if (astCache.has(key)) return astCache.get(key);
  if (astCache.size > 8) astCache.clear();

  // The rocks get the whole card. There used to be a reserved lane along the
  // bottom for the ship, which is why the ship looked parked down there — now it
  // flies out to meet each target instead, so it needs no lane and the rocks get
  // the space back.
  const lane = H;
  // Big. A lone large fills a good part of the card; ten of them still read
  // clearly because they are allowed to overlap. The tier ladder above falls off
  // steeply so that buying a bigger opening rock doesn't also clog the middle of
  // the run with fragments.
  const r = Math.min(W, H) * 0.155 / (1 + 0.048 * (p.L - 1));

  // Build the tree of rocks. id 0..n-1, parent -1 for a large.
  const nodes = [], roots = [];
  const build = (lv, i, parent) => {
    const id = nodes.length;
    nodes.push({ lv, i, parent, kids: [], kill: 0 });
    if (parent < 0) roots.push(id); else nodes[parent].kids.push(id);
    if (lv < AST_TIERS - 1) for (let c = 0; c < p.M; c++) build(lv + 1, i, id);
    return id;
  };
  for (let i = 0; i < p.L; i++) build(0, i, -1);

  // Weighted topological shuffle: a rock only becomes a candidate once its
  // parent has been destroyed, so the cascade still makes sense, but which
  // candidate goes next is seeded chance biased towards the small ones.
  //
  // The larges are NOT left to that chance. Cracking one open is the headline
  // event of this timer, and pure weighted choice opened every one of them in
  // the first third of a short run and then left nothing big on screen for the
  // rest of it. So the larges are paced: by shot k, exactly ceil(k·L/S) of them
  // have been opened. That spreads the big moments evenly over the run and, as a
  // side effect, keeps the rock count steady — one subtree is worth exactly the
  // gap between two large openings.
  const nShots = nodes.length;
  let rng = (seed * 2654435761) >>> 0;
  const rand = () => { rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0; return rng / 4294967296; };

  // When each large opens. Evenly spaced would be metronomic — you can feel the
  // beat and predict the next one — so each slot is nudged by up to a third of
  // the gap, kept strictly increasing so the order still makes sense.
  // AST_LOOKAHEAD runs the schedule early so that two or three larges are open
  // at once. Without it each large opened only as the previous one's fragments
  // ran out, so there was never a second family to cut to — the order ground
  // one subtree to dust, in one corner of the screen, then moved on. Opening a
  // large does not remove a big rock from the field, it converts one, so the
  // opening screen is still almost all larges.
  // Capped against the field size: a fixed 0.8 out of only two larges opens both
  // in the first few shots and leaves a short timer with no big rocks at all.
  const look = Math.min(AST_LOOKAHEAD, (p.L - 1) * 0.35);
  const gap = nShots / p.L, slot = [];
  for (let j = 0; j < p.L; j++) {
    const want = Math.round((j - look) * gap + 1 + (rand() - 0.5) * gap * 0.66);
    slot.push(Math.max(j + 1, Math.min(nShots, want)));
  }
  for (let j = 1; j < p.L; j++) if (slot[j] <= slot[j - 1]) slot[j] = slot[j - 1] + 1;

  const bigLeft = roots.slice(), avail = [];
  let opened = 0, lastFam = -1;
  for (let k = 1; k <= nShots; k++) {
    let quota = 0;
    while (quota < p.L && slot[quota] <= k) quota++;
    let id;
    if ((opened < quota || avail.length === 0) && bigLeft.length) {
      id = bigLeft.splice(Math.floor(rand() * bigLeft.length), 1)[0];
      opened++;
    } else {
      // Weight by depth, but penalise the family that was just shot. Without
      // this the order grinds one large's subtree all the way down before
      // touching another, which is the pattern you can see coming: same corner
      // of the screen, same sequence of sizes, over and over. Skipping between
      // families also means the ship crosses the card between shots instead of
      // nibbling away at one spot.
      const wt = (c) => Math.pow(AST_DEPTH_BIAS, nodes[c].lv)
                        * (nodes[c].i === lastFam ? AST_SAME_FAMILY : 1);
      let total = 0;
      for (const c of avail) total += wt(c);
      let pick = rand() * total, at = 0;
      for (; at < avail.length - 1; at++) {
        pick -= wt(avail[at]);
        if (pick <= 0) break;
      }
      id = avail[at];
      avail[at] = avail[avail.length - 1]; avail.pop();
    }
    lastFam = nodes[id].i;
    nodes[id].kill = k;
    for (const c of nodes[id].kids) avail.push(c);
  }

  // Kill order as a lookup, so astTargetOf is O(1).
  const order = new Array(nodes.length);
  nodes.forEach((n, id) => { order[n.kill - 1] = id; });

  // Motion. Larges start scattered and drift; a fragment inherits its parent's
  // velocity plus a push away from the split, so a break scatters outward and
  // keeps travelling instead of stopping dead.
  const speed = Math.min(W, H) * AST_DRIFT;
  nodes.forEach((n, id) => {
    if (n.parent < 0) {
      // Best-candidate placement: throw a handful of darts and keep the one
      // furthest from the larges already placed. Plain uniform random clumps —
      // it put all eight opening rocks in one corner and left half the card
      // empty. Distance is measured around the wrap, since the card is a
      // cylinder and two rocks either side of the seam are neighbours.
      let best = null, bestD = -1;
      for (let c = 0; c < 24; c++) {
        const x = astHash(seed, id, 100 + c, 0, 0) * W;
        const y = astHash(seed, id, 200 + c, 0, 0) * lane;
        let d = 1e9;
        for (const q of nodes) {
          if (q.parent >= 0 || q.x0 === undefined) continue;
          const dx = Math.min(Math.abs(x - q.x0), W - Math.abs(x - q.x0));
          d = Math.min(d, Math.hypot(dx, y - q.y0));
        }
        if (d > bestD) { bestD = d; best = { x, y }; }
      }
      n.x0 = best.x; n.y0 = best.y;
      const a = astHash(seed, id, 3, 0, 0) * 6.283185;
      const sp = speed * (0.55 + 0.9 * astHash(seed, id, 4, 0, 0));
      n.vx = Math.cos(a) * sp; n.vy = Math.sin(a) * sp * 0.6;
    } else {
      const par = nodes[n.parent];
      // Fan the siblings evenly and rotate the fan by a seeded amount, so no two
      // fragments of one rock leave along the same line.
      const sibs = par.kids;
      const idx = sibs.indexOf(id);
      const a = (idx / sibs.length + astHash(seed, n.parent, 5, 0, 0)) * 6.283185;
      // Sized to the CHILD, and the inherited velocity is damped. Adding an
      // undamped burst to the parent's velocity compounds over four
      // generations: chips ended up crossing the card in under four seconds
      // while being the smallest thing on it.
      const burst = r * AST_TIER_R[n.lv] * AST_BURST;
      n.vx = par.vx * 0.7 + Math.cos(a) * burst;
      n.vy = par.vy * 0.7 + Math.sin(a) * burst * 0.75;
    }
  });

  const F = { lane, r, nodes, order, roots, W, H, seed };
  F.station = astStations(F, p, secs, W, H);
  astCache.set(key, F);
  return F;
}

// Shot k (1-based) destroys this rock.
function astTargetOf(F, k) { return F.order[k - 1]; }
// Shot k lands at exactly (k / S) of the duration. Shot S lands on zero.
function astHitAt(p, secs, k) { return (k / p.S) * secs; }
// A rock exists from the moment its parent was destroyed.
function astBorn(F, p, secs, id) {
  const par = F.nodes[id].parent;
  return par < 0 ? 0 : astHitAt(p, secs, F.nodes[par].kill);
}

function astRadius(F, id) {
  const n = F.nodes[id];
  const v = 0.86 + (AST_VAR - 0.86) * astHash(F.seed, n.i, 80, 0, 0);
  return F.r * v * AST_TIER_R[n.lv];
}

// Unwrapped position: where the rock would be if the card were infinite. A
// fragment starts exactly where its parent died, so a split emerges from the
// explosion rather than appearing beside it.
function astRaw(F, p, secs, t, id) {
  const n = F.nodes[id];
  if (n.parent < 0) return { x: n.x0 + n.vx * t, y: n.y0 + n.vy * t };
  const born = astBorn(F, p, secs, id);
  const at = astRaw(F, p, secs, born, n.parent);
  const dt = Math.max(0, t - born);
  return { x: at.x + n.vx * dt, y: at.y + n.vy * dt };
}

// Wrap horizontally — a rock leaving one side comes back on the other, which is
// what makes the field feel like space rather than a box. Vertically it folds
// instead: a wrap there would either pop the rock across the card or drop it
// through the ship's lane, and a reflection has neither problem.
function astWrapX(x, W) { const m = x % W; return m < 0 ? m + W : m; }
function astFoldY(y, lo, hi) {
  const s = Math.max(1, hi - lo);
  let u = (y - lo) % (2 * s);
  if (u < 0) u += 2 * s;
  return lo + (u <= s ? u : 2 * s - u);
}
function astPos(F, p, secs, t, id) {
  const q = astRaw(F, p, secs, t, id);
  const r = astRadius(F, id);
  return { x: astWrapX(q.x, F.W), y: astFoldY(q.y, r, F.lane - r) };
}

// Every rock on screen at elapsed time t: born (its parent is gone) and not yet
// destroyed itself.
function astAlive(F, p, secs, t) {
  const landed = astLanded(p, secs, t);
  const out = [];
  for (let id = 0; id < F.nodes.length; id++) {
    const n = F.nodes[id];
    if (n.kill <= landed) continue;
    if (n.parent >= 0 && F.nodes[n.parent].kill > landed) continue;
    out.push(id);
  }
  return out;
}
function astLanded(p, secs, t) {
  return Math.max(0, Math.min(p.S, Math.floor(t / secs * p.S)));
}

// The ship flies out to whatever it is about to shoot, and it flies AROUND the
// rocks on the way.
//
// Two things were wrong before. It moved by straight-line lerp with an ease at
// each end, which is exactly how a cursor moves: dead stop, straight line, dead
// stop. And a straight line goes through whatever happens to be in the way.
//
// Now each shot has a FIRING STATION chosen for clearance (astStations, below),
// and the ship threads those stations on a Catmull-Rom spline. The spline is
// what makes it read as a ship rather than a pointer: it passes THROUGH each
// station without stopping, so velocity is continuous across the whole run, and
// the path curves instead of dog-legging.
function astShipR(W, H) { return Math.max(7, Math.min(W, H) * 0.058); }

// Where the ship is when it fires shot k. Chosen at field-build time by trying a
// ring of candidate positions and keeping whichever stays furthest from every
// other rock — both at the station itself and at points along the way there.
// Avoiding the rocks is most of the drama; a ship that drifts through them
// looks like a bug, not like flying.
const AST_TENSION  = 0.46;  // how far the flight path bows away from the chord
const AST_MIN_TAN  = 0.45;  // shortest tangent allowed, as a fraction of the chord
const AST_MAX_TURN = 0.45;  // cos of the sharpest turn the route should ask for

function astStations(F, p, secs, W, H) {
  const m = astShipR(W, H) * 3.2;         // keeps spline overshoot on the card
  const shipR = astShipR(W, H);
  const fireAt = (k) => (k < 1 ? 0 : astHitAt(p, secs, k) - p.travel);

  // ── Snapshots ─────────────────────────────────────────────────────────────
  // Every rock that is up, sampled at NS instants across each leg, flattened to
  // [x, y, r, ...]. Built ONCE. The first version called astAlive inside the
  // candidate loop, which is O(shots) per candidate per pass — for a long timer
  // that was twenty million list walks and it simply hung.
  const NS = 5;
  const snap = new Array(p.S + 1), snapT = new Array(p.S + 1);
  for (let k = 1; k <= p.S; k++) {
    const t0 = fireAt(k - 1), t1 = fireAt(k), skip = astTargetOf(F, k);
    const rows = [], times = [];
    for (let n = 0; n <= NS; n++) {
      const tt = t0 + (t1 - t0) * n / NS;
      const flat = [];
      for (const id of astAlive(F, p, secs, tt)) {
        if (id === skip) continue;
        const q = astPos(F, p, secs, tt, id);
        flat.push(q.x, q.y, astRadius(F, id));
      }
      rows.push(flat); times.push(tt);
    }
    snap[k] = rows; snapT[k] = times;
  }

  // Clearance from the rock EDGE to the ship's CENTRE, around the wrap, in ship
  // radii. A graze — hulls overlapping at the rim — is the good kind of close;
  // what looks broken is the ship sitting inside a rock. Optimising hull to hull
  // spends the whole budget preventing near misses that were never the problem.
  const clear = (x, y, flat) => {
    let worst = 1e9;
    for (let i2 = 0; i2 < flat.length; i2 += 3) {
      let dx = Math.abs(flat[i2] - x);
      if (dx > W / 2) dx = W - dx;
      const dy = flat[i2 + 1] - y;
      const gap = Math.sqrt(dx * dx + dy * dy) - flat[i2 + 2] - shipR * 0.45;
      if (gap < worst) worst = gap;
    }
    return worst / shipR;
  };

  // ── First pass: a ring of candidates around each target ───────────────────
  const st = [{ x: W * 0.5, y: H * 0.72 }];
  for (let k = 1; k <= p.S; k++) {
    const prev = st[k - 1];
    const tgt = astPos(F, p, secs, astHitAt(p, secs, k), astTargetOf(F, k));
    const apart = Math.min(W, H) * 0.20;
    let best = null, bestScore = -1e9;
    for (let c = 0; c < 16; c++) {
      const a = (c / 16 + astHash(F.seed, k, 30, 0, 0)) * 6.283185;
      const d = Math.min(W, H) * (0.22 + 0.42 * astHash(F.seed, k, 31 + c, 0, 0));
      const x = Math.max(m, Math.min(W - m, tgt.x + Math.cos(a) * d));
      const y = Math.max(m, Math.min(H - m, tgt.y + Math.sin(a) * d));
      let score = clear(x, y, snap[k][NS]);
      // The trip there, straight-line for now — the curve is not known until
      // the neighbours are, which is what the relaxation below is for.
      for (let n = 1; n < NS; n++) {
        const u = n / NS;
        score = Math.min(score, clear(prev.x + (x - prev.x) * u,
                                      prev.y + (y - prev.y) * u, snap[k][n]));
      }
      // A station too near the last one makes a stub leg, and a stub leg makes
      // a near-zero tangent, which stops the ship dead on the waypoint.
      const hop = Math.hypot(x - prev.x, y - prev.y);
      if (hop < apart) score -= 6 * (apart - hop) / apart;
      if (score > bestScore) { bestScore = score; best = { x, y }; }
    }
    st.push(best);
  }

  // A virtual station beyond the last, so the final leg has somewhere to go and
  // the ship coasts away rather than stopping on the last rock.
  const last = st[p.S], prev2 = st[Math.max(0, p.S - 1)];
  st.push({ x: Math.max(m, Math.min(W - m, last.x + (last.x - prev2.x) * 0.7)),
            y: Math.max(m, Math.min(H - m, last.y + (last.y - prev2.y) * 0.7)) });

  // ── Weave ─────────────────────────────────────────────────────────────────
  // One free waypoint halfway along each leg. Without it the only choice the
  // ship has is where to END UP: it cannot steer round anything in between, so
  // a leg across a crowded field goes straight through whatever is there. The
  // midpoint is what turns the route into flying rather than pointing.
  //
  // The array is interleaved from here on — even index k*2 is the firing
  // station for shot k, odd index is the waypoint between two of them — so
  // every half-leg is a spline segment of its own.
  const path = [];
  for (let k = 0; k < st.length; k++) {
    path.push(st[k]);
    if (k < st.length - 1) {
      const A = st[k], B = st[k + 1];
      const mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
      // Candidates pushed sideways off the midpoint of the chord.
      const nx = -(B.y - A.y), ny = B.x - A.x;
      const nl = Math.hypot(nx, ny) || 1;
      let best = mid, bestScore = -1e9;
      const half = snap[Math.min(p.S, k + 1)];
      const flat = half ? half[Math.round(NS / 2)] : [];
      for (let c = 0; c < 11; c++) {
        const off = ((c - 5) / 5) * Math.min(W, H) * 0.30;
        const x = Math.max(m, Math.min(W - m, mid.x + nx / nl * off));
        const y = Math.max(m, Math.min(H - m, mid.y + ny / nl * off));
        // Prefer clear air, and prefer not to detour further than needed.
        const sep = Math.min(Math.hypot(x - A.x, y - A.y), Math.hypot(x - B.x, y - B.y));
        const score = clear(x, y, flat) - 0.6 * Math.abs(off) / Math.min(W, H)
                    - (sep < Math.min(W, H) * 0.11 ? 50 : 0);
        if (score > bestScore) { bestScore = score; best = { x, y }; }
      }
      path.push(best);
    }
  }

  // ── Relaxation ────────────────────────────────────────────────────────────
  // Re-pick each station against the ACTUAL spline either side of it. The first
  // pass scored a straight line; the ship flies a curve, and scoring a path it
  // never takes optimises the wrong thing.
  // Clearance along segment `seg` of the interleaved path. Segment s runs from
  // path[s] to path[s+1], which is half of shot (s>>1)+1's leg.
  const segClear = (seg, arr) => {
    const k = Math.max(1, Math.min(p.S, (seg >> 1) + 1));
    const firstHalf = (seg % 2) === 0;
    let worst = 1e9;
    for (let n = 1; n < NS; n++) {
      const u = n / NS;
      const q = astPathAt(arr, seg, u);
      if (q.x < m || q.x > W - m || q.y < m || q.y > H - m) worst = Math.min(worst, -3);
      // Which snapshot of the field this moment corresponds to.
      const gi = Math.round((firstHalf ? u / 2 : 0.5 + u / 2) * NS);
      worst = Math.min(worst, clear(q.x, q.y, snap[k][Math.max(0, Math.min(NS, gi))]));
    }
    return worst;
  };

  // The shape of the route through a station, as opposed to where it is. Two
  // things wreck the flying: stations on top of each other, and hairpins. The
  // hairpin is the subtle one — the maths stays valid, but the ship decelerates
  // to a near stop in the turn, reverses, and accelerates away, which on screen
  // is a dead stop at a waypoint. Ships make sweeping turns.
  const shape = (k, stations) => {
    const n = stations.length - 1;
    const P = (i2) => stations[Math.max(0, Math.min(n, i2))];
    const ax = P(k).x - P(k - 1).x, ay = P(k).y - P(k - 1).y;
    const bx = P(k + 1).x - P(k).x, by = P(k + 1).y - P(k).y;
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
    const want = Math.min(W, H) * 0.20;
    let pen = 0;
    const near = Math.min(la, lb);
    if (near < want) pen -= 8 * (want - near) / want;
    if (la > 1 && lb > 1) {
      const turn = (ax * bx + ay * by) / (la * lb);   // 1 straight on, -1 reversal
      if (turn < AST_MAX_TURN) pen -= 7 * (AST_MAX_TURN - turn);
    }
    return pen;
  };

  // Score for moving path[i], covering the two segments it touches.
  // Clearance dominates; shape only breaks ties between routes that are
  // similarly clear. Weighted evenly the shape penalty outvoted clearance
  // and the ship flew beautiful smooth lines straight through the rocks.
  const around = (i) => Math.min(segClear(Math.max(0, i - 1), path), segClear(i, path))
                      + 0.30 * shape(i, path);

  // Hard floor on how close a point may sit to its neighbours. This was a soft
  // term inside shape() and kept getting outvoted: a point landing on top of a
  // neighbour leaves both chords near zero, which leaves the tangent near zero
  // however high its floor is set, and the ship stops dead on that waypoint.
  const minSep = Math.min(W, H) * 0.11;
  const separated = (i, q) => {
    const n = path.length - 1;
    const A = path[Math.max(0, i - 1)], B = path[Math.min(n, i + 1)];
    return Math.hypot(q.x - A.x, q.y - A.y) >= minSep
        && Math.hypot(q.x - B.x, q.y - B.y) >= minSep;
  };

  // Pass 0 moves everything; the later passes only move the free waypoints. The
  // firing stations settle quickly because they are pinned near their target,
  // and re-searching them every pass was most of the build time — which matters,
  // because this runs again whenever the card is resized.
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 1; i < path.length - 1; i++) {
      const keep = path[i];
      let best = keep, bestScore = -1e9;
      if (i % 2 === 0 && pass > 0) continue;
      if (i % 2 === 0) {
        // A firing station: has to stay in range of its target.
        const k = i / 2;
        if (k < 1 || k > p.S) continue;
        const tgt = astPos(F, p, secs, astHitAt(p, secs, k), astTargetOf(F, k));
        for (let c = 0; c < 12; c++) {
          const a = (c / 12 + astHash(F.seed, k, 40 + pass, 0, 0)) * 6.283185;
          const d = Math.min(W, H) * (0.22 + 0.42 * astHash(F.seed, k, 60 + c, 0, 0));
          path[i] = { x: Math.max(m, Math.min(W - m, tgt.x + Math.cos(a) * d)),
                      y: Math.max(m, Math.min(H - m, tgt.y + Math.sin(a) * d)) };
          const sc = Math.min(around(i), clear(path[i].x, path[i].y, snap[k][NS]))
                   - (separated(i, path[i]) ? 0 : 50);
          if (sc > bestScore) { bestScore = sc; best = path[i]; }
        }
      } else {
        // A waypoint: free to go anywhere between its neighbours.
        const A = path[i - 1], B = path[i + 1];
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        for (let c = 0; c < 12; c++) {
          const a = (c / 12 + astHash(F.seed, i, 70 + pass, 0, 0)) * 6.283185;
          const d = Math.min(W, H) * 0.34 * astHash(F.seed, i, 90 + c, 0, 0);
          path[i] = { x: Math.max(m, Math.min(W - m, mx + Math.cos(a) * d)),
                      y: Math.max(m, Math.min(H - m, my + Math.sin(a) * d)) };
          const sc = around(i) - 0.4 * d / Math.min(W, H)
                   - (separated(i, path[i]) ? 0 : 50);
          if (sc > bestScore) { bestScore = sc; best = path[i]; }
        }
      }
      path[i] = best;
    }
  }
  return path;
}

// Tangent at b, given its neighbours. The centred difference (c - a) is the
// usual choice and it VANISHES whenever the route doubles back — c lands near
// a, the tangent goes to zero, and the ship stops dead on the waypoint. Which
// is the cursor behaviour this whole path exists to get rid of. So the tangent
// has a floor, measured against the outgoing chord.
function astTangent(a, b, c) {
  let mx = AST_TENSION * (c.x - a.x), my = AST_TENSION * (c.y - a.y);
  const ox = c.x - b.x, oy = c.y - b.y;          // outgoing chord
  const ix = b.x - a.x, iy = b.y - a.y;          // incoming chord
  // Floored against the LONGER of the two chords. Flooring against the outgoing
  // one alone leaves the tangent tiny whenever the next leg is short, and since
  // the speed at the end of a leg is exactly this tangent, the ship crawled to a
  // halt just before arriving — which is what the stall at u ≈ 0.92 was.
  const chord = Math.max(Math.hypot(ox, oy), Math.hypot(ix, iy));
  const mag = Math.hypot(mx, my);
  if (mag < AST_MIN_TAN * chord) {
    const dx = (ox || ix), dy = (oy || iy), dl = Math.hypot(dx, dy) || 1;
    mx = AST_MIN_TAN * chord * dx / dl;
    my = AST_MIN_TAN * chord * dy / dl;
  }
  return { x: mx, y: my };
}

// Cubic Hermite between p1 and p2. Plain Catmull-Rom bulged well outside the
// line between two stations and walked the ship off the card; the tension above
// keeps it near the chord.
function astHermite(p1, p2, m1, m2, u) {
  const u2 = u * u, u3 = u2 * u;
  const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u;
  const h01 = -2 * u3 + 3 * u2,    h11 = u3 - u2;
  return { x: h00 * p1.x + h10 * m1.x + h01 * p2.x + h11 * m2.x,
           y: h00 * p1.y + h10 * m1.y + h01 * p2.y + h11 * m2.y };
}
function astHermiteD(p1, p2, m1, m2, u) {
  const u2 = u * u;
  const d00 = 6 * u2 - 6 * u, d10 = 3 * u2 - 4 * u + 1;
  const d01 = -6 * u2 + 6 * u, d11 = 3 * u2 - 2 * u;
  return { x: d00 * p1.x + d10 * m1.x + d01 * p2.x + d11 * m2.x,
           y: d00 * p1.y + d10 * m1.y + d01 * p2.y + d11 * m2.y };
}

// The four control points and two tangents for the leg starting at station k.
// Takes the stations ARRAY, not the field, so that the station search can score
// the exact curve the ship will fly — an earlier version scored a separate
// scalar approximation, which quietly optimised a path that was never flown.
function astLegPts(S, k) {
  const n = S.length - 1;
  const P = (i) => S[Math.max(0, Math.min(n, i))];
  const p1 = P(k), p2 = P(k + 1);
  return [p1, p2, astTangent(P(k - 1), p1, p2), astTangent(p1, p2, P(k + 2))];
}
function astPathAt(S, k, u) {
  const [p1, p2, m1, m2] = astLegPts(S, k);
  return astHermite(p1, p2, m1, m2, u);
}

// Which leg of the route the ship is on at time t, as [k, u]: travelling from
// station k to station k+1, fraction u along. Keyed on FIRING times, not impact
// times — keyed on impacts, the ship sat still for the whole flight of every
// shot, which put the dead stop back in.
// Which segment of the interleaved route the ship is on at time t, as [seg, u].
// Segments are HALF a shot apart, because the route carries a free waypoint
// between every pair of firing stations. Keyed on firing times, not impact
// times — keyed on impacts, the ship sat still for the whole flight of every
// shot, which put the dead stop back in.
function astLeg(p, secs, t) {
  const half = secs / p.S / 2;
  const at = (i) => Math.max(0, i * half - p.travel);
  const n = 2 * (p.S + 1);
  let i = Math.floor((t + p.travel) / half);
  i = Math.max(0, Math.min(n - 1, i));
  const a = at(i), b = at(i + 1);
  return [i, Math.max(0, Math.min(1, (t - a) / Math.max(1e-3, b - a)))];
}

function astShipAt(F, p, secs, W, H, t) {
  const [k, u] = astLeg(p, secs, t);
  // Deliberately NOT clamped to the card. Clamping was the obvious safety net
  // and it is exactly the wrong one: while the ship is pinned against an edge
  // its speed is zero, which puts back the dead stop the whole spline exists to
  // remove. The station margin and the tension are what keep it on the card,
  // and ast-sim.js checks that they do.
  return astPathAt(F.station, k, u);
}

// Heading: along its own velocity while cruising, swinging onto the target to
// fire and back off again afterwards. A ship that always points at its target
// looks like a turret; one that never does cannot fire from the nose.
function astShipAngle(F, p, secs, W, H, t, aimAt) {
  const [i, u] = astLeg(p, secs, t);
  const [p1, p2, m1, m2] = astLegPts(F.station, i);
  const v = astHermiteD(p1, p2, m1, m2, u);
  const head = (Math.abs(v.x) + Math.abs(v.y)) < 1e-6 ? -Math.PI / 2 : Math.atan2(v.y, v.x);
  const sm = (z) => z * z * (3 - 2 * z);
  // Only the half-legs that END on a firing station do the aiming swing; the
  // ones ending on a free waypoint just fly.
  const justFired = (i % 2) === 0 && i >= 2;     // this segment started at a station
  const aboutToFire = (i % 2) === 1;             // ...and this one ends at one
  if (justFired && u < 0.36) return astLerpAng(aimAt(i / 2), head, sm(u / 0.36));
  if (aboutToFire && u > 0.60)
    return astLerpAng(head, aimAt((i + 1) / 2), sm((u - 0.60) / 0.40));
  return head;
}

// Did the ship touch a rock at time t? The stations are chosen to avoid this,
// but the spline bulges between them and the rocks are moving, so it still
// happens occasionally — and when it does it should read as a real event.
// Penetration, not contact: the nose clipping a rock's rim is flying close, and
// close is the point. This fires when the ship's centre crosses into the rock.
function astCollision(F, p, secs, W, H, t) {
  const sh = astShipAt(F, p, secs, W, H, t);
  for (const id of astAlive(F, p, secs, t)) {
    const q = astPos(F, p, secs, t, id);
    let dx = Math.abs(q.x - sh.x);
    if (dx > W / 2) dx = W - dx;
    const gap = Math.hypot(dx, q.y - sh.y) - astRadius(F, id);
    if (gap < 0) return { id, gap, x: sh.x, y: sh.y };
  }
  return null;
}

// Shortest-arc angle interpolation — a plain lerp spins the turret the long way
// round whenever consecutive targets straddle the -x axis.
function astLerpAng(a, b, u) {
  const two = Math.PI * 2;
  const d = ((b - a + Math.PI) % two + two) % two - Math.PI;
  return a + d * u;
}

// The target may be nearer around the side of the card than straight across it,
// and the shot should take the short way.
function astNearestX(tx, sx, W) {
  let best = tx, bd = Math.abs(tx - sx);
  for (const dx of [-W, W]) {
    const d = Math.abs(tx + dx - sx);
    if (d < bd) { bd = d; best = tx + dx; }
  }
  return best;
}

// Mix a hex colour towards black (amount < 0) or white (amount > 0).
function astShade(hex, amount) {
  const p = i => parseInt(hex.slice(i, i + 2), 16);
  const to = amount < 0 ? 0 : 255, k = Math.abs(amount);
  const mix = v => Math.round(v + (to - v) * k);
  return '#' + [mix(p(1)), mix(p(3)), mix(p(5))]
    .map(x => x.toString(16).padStart(2, '0')).join('');
}

// Flat radiating shards. No glow, no gradient — same rule as every other timer.
function astBlast(ctx, x, y, r, u, col, seed, k) {
  ctx.globalAlpha = Math.max(0, 1 - u * u);
  ctx.strokeStyle = col;
  // Thin. At r * 0.2 the shards were as wide as they were long and the whole
  // thing read as a cartoon sun rather than debris.
  ctx.lineWidth = Math.max(1, r * 0.055);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10 + astHash(seed, k, 50, 0, 0)) * 6.283185;
    const j = 0.75 + 0.5 * astHash(seed, k, 51 + i, 0, 0);
    const r0 = r * (0.30 + 1.15 * u) * j, r1 = r0 + r * 0.55 * (1 - u);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0);
    ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1);
    ctx.stroke();
  }
  // A ring for the first half, so a big rock going reads as an event
  if (u < 0.55) {
    ctx.globalAlpha = (1 - u / 0.55) * 0.7;
    ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath();
    ctx.arc(x, y, r * (0.35 + 1.05 * u), 0, 6.283185);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// One rock, drawn at x — and again shifted a card-width when it straddles the
// edge, so the wrap is seamless instead of a pop.
function astRock(ctx, F, id, x, y, r, t, tone) {
  const spin = (astHash(F.seed, id, 60, 0, 0) - 0.5) * 0.9;
  const rot = t * spin;
  for (const dx of [0, -F.W, F.W]) {
    if (dx !== 0 && (x + dx < -r || x + dx > F.W + r)) continue;
    const cx = x + dx;
    ctx.beginPath();
    for (let v = 0; v < 9; v++) {
      const a = rot + v / 9 * 6.283185;
      const rr = r * (0.76 + 0.36 * astHash(F.seed, id, 61 + v, 0, 0));
      const px = cx + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      v ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = tone.fill; ctx.fill();
    ctx.strokeStyle = tone.edge; ctx.lineWidth = Math.max(1, r * 0.1); ctx.stroke();
    if (r > 7) {
      ctx.fillStyle = tone.pit;
      const craters = 2 + (astHash(F.seed, id, 69, 0, 0) > 0.45 ? 1 : 0);
      for (let c = 0; c < craters; c++) {
        const ca = astHash(F.seed, id, 70 + c, 0, 0) * 6.283185 + rot;
        const cd = r * (0.12 + 0.42 * astHash(F.seed, id, 74 + c, 0, 0));
        const cr = r * (0.10 + 0.13 * astHash(F.seed, id, 78 + c, 0, 0));
        ctx.beginPath();
        ctx.arc(cx + Math.cos(ca) * cd, y + Math.sin(ca) * cd, cr, 0, 6.283185);
        ctx.fill();
      }
    }
  }
}

function drawAsteroid(ctx, W, H, pct, col, state) {
  if (W < 140 || H < 110) return;
  const secs = Math.max(1, totalSeconds);
  const st = state || mzOrphan;
  if (!st.astSeed) st.astSeed = (Math.random() * 0x7ffffff | 0) || 1;
  const seed = st.astSeed;
  const p = astPlan(secs);
  const F = astField(p, seed, W, H, secs);
  const ot = outroT();
  const clock = NOW() / 1000;                   // idle animation only (twinkle)
  // Elapsed seconds, carried past the end by the outro so the last blast and the
  // shock ring play out after zero.
  const t = Math.max(0, Math.min(1, 1 - pct)) * secs + ot * (OUTRO_MS / 1000);

  // ── Space ─────────────────────────────────────────────────────────────────
  ctx.fillStyle = '#0b1024';
  ctx.fillRect(0, 0, W, H);
  const stars = Math.max(20, Math.round(W * H / 4200));
  ctx.fillStyle = '#e8ecff';
  for (let i = 0; i < stars; i++) {
    const a = 0.14 + 0.38 * astHash(seed, i, 41, 0, 0);
    ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(clock * 1.5 + i * 1.7));
    ctx.fillRect(Math.round(astHash(seed, i, 42, 0, 0) * W),
                 Math.round(astHash(seed, i, 43, 0, 0) * H),
                 astHash(seed, i, 44, 0, 0) > 0.85 ? 2 : 1, 1);
  }
  ctx.globalAlpha = 1;

  // ── Asteroids ─────────────────────────────────────────────────────────────
  // The rocks carry the urgency colour like every other timer on the site: green
  // while there is time, red when there isn't. Each rock is shaded a little
  // differently so the field has depth, but they all move through the same hue
  // together, so the colour still reads as the clock and not as decoration.
  const alive = astAlive(F, p, secs, t);
  // Biggest first, so a chip is never hidden behind a large.
  alive.sort((a, b) => F.nodes[b].lv - F.nodes[a].lv);
  for (const id of alive) {
    const q = astPos(F, p, secs, t, id);
    const r = astRadius(F, id);
    const v = astHash(F.seed, id, 86, 0, 0);
    const tone = {
      fill: astShade(col, -0.62 + 0.14 * v),
      edge: astShade(col, -0.30 + 0.16 * v),
      pit:  astShade(col, -0.75 + 0.10 * v),
    };
    astRock(ctx, F, id, q.x, q.y, r, t, tone);
  }

  // ── Explosions ────────────────────────────────────────────────────────────
  // Derived from time-since-impact, not appended to a list. At any moment only a
  // shot or two can be inside the window, so a three-shot scan covers it.
  const landed = astLanded(p, secs, t);
  for (let k = Math.max(1, landed - 1); k <= Math.min(p.S, landed + 1); k++) {
    const hit = astHitAt(p, secs, k), age = t - hit;
    if (age < 0 || age > AST_BOOM) continue;
    const id = astTargetOf(F, k);
    const q = astPos(F, p, secs, hit, id);
    astBlast(ctx, q.x, q.y, astRadius(F, id) * 1.15, age / AST_BOOM, col, seed, k);
  }

  // ── Ship, and the shot in flight ──────────────────────────────────────────
  // The ship aims at where its target WILL BE when the shot arrives, and fires
  // at (impact time − flight time). Fire on a cadence instead and the last
  // explosion drifts off zero, which is the only thing this timer has to get
  // right.
  const next = Math.min(p.S, landed + 1);
  const hitT = astHitAt(p, secs, next);
  const fireT = hitT - p.travel;
  const aimAt = (k) => {
    const h = astHitAt(p, secs, k);
    const q = astPos(F, p, secs, h, astTargetOf(F, k));
    // From where the ship will be when it FIRES, not where it is at impact:
    // the shot leaves the barrel, so the two have to be measured from the
    // same instant or the projectile starts off to one side of the nose.
    const sh = astShipAt(F, p, secs, W, H, h - p.travel);
    return Math.atan2(q.y - sh.y, astNearestX(q.x, sh.x, W) - sh.x);
  };
  const ship = astShipAt(F, p, secs, W, H, t);
  const shipR = astShipR(W, H);
  let aim = -Math.PI / 2;
  if (t < secs) {
    aim = astShipAngle(F, p, secs, W, H, t, aimAt);
    if (t >= fireT) {
      const tgt = astPos(F, p, secs, hitT, astTargetOf(F, next));
      const src = astShipAt(F, p, secs, W, H, fireT);
      const a0 = aimAt(next);
      const nx = src.x + Math.cos(a0) * shipR * 1.05;
      const ny = src.y + Math.sin(a0) * shipR * 1.05;
      const u2 = (t - fireT) / p.travel;
      const ex = astNearestX(tgt.x, src.x, W);
      const bx = nx + (ex - nx) * u2, by = ny + (tgt.y - ny) * u2;
      const bl = Math.max(5, shipR * 0.6);
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, shipR * 0.14);
      ctx.beginPath();
      ctx.moveTo(bx - Math.cos(a0) * bl, by - Math.sin(a0) * bl);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
  }

  // ── Collision ─────────────────────────────────────────────────────────────
  // Rare by design — the stations are picked to keep clear — but when it does
  // happen it gets a reaction rather than the ship sliding silently through a
  // rock: a hard flash ring, and the hull blinks.
  const bump = t < secs ? astCollision(F, p, secs, W, H, t) : null;
  if (bump) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = Math.max(1.5, shipR * 0.16);
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, shipR * (1.35 + 0.25 * Math.sin(clock * 40)), 0, 6.283185);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(aim + Math.PI / 2);          // sprite is drawn nose-up
  ctx.beginPath();
  ctx.moveTo(0, -shipR);
  ctx.lineTo(shipR * 0.68, shipR * 0.62);
  ctx.lineTo(0, shipR * 0.28);
  ctx.lineTo(-shipR * 0.68, shipR * 0.62);
  ctx.closePath();
  // Outlined in the background colour first. The ship crosses in front of rocks
  // now, and without this it vanishes into any rock the same hue — which, since
  // the rocks are shaded from the same urgency colour, is all of them.
  ctx.strokeStyle = '#0b1024';
  ctx.lineWidth = Math.max(2, shipR * 0.22);
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.fillStyle = bump && Math.sin(clock * 40) > 0 ? '#ffffff' : col; ctx.fill();
  ctx.fillStyle = '#0b1024';
  ctx.beginPath(); ctx.arc(0, -shipR * 0.18, shipR * 0.18, 0, 6.283185); ctx.fill();
  // Thruster flicker — small, but it stops the ship reading as a cursor
  if (t < secs) {
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.55 + 0.4 * Math.sin(clock * 19);
    ctx.beginPath();
    ctx.moveTo(-shipR * 0.20, shipR * 0.56);
    ctx.lineTo(0, shipR * (0.80 + 0.18 * Math.sin(clock * 23)));
    ctx.lineTo(shipR * 0.20, shipR * 0.56);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // ── Finale: one shock ring, flat ──────────────────────────────────────────
  if (ot > 0) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = Math.max(0, 1 - ot);
    ctx.lineWidth = Math.max(2, Math.min(W, H) * 0.02 * (1 - ot));
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, Math.max(W, H) * 0.9 * ot, 0, 6.283185);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ── Live sound ────────────────────────────────────────────────────────────
  // Gated on virtualNow === null: the exporter drives this through a virtual
  // clock, and without the check a single export would fire every cue at once.
  // The bookkeeping sits outside the gate so muting and unmuting mid-run doesn't
  // release a backlog.
  const fired = Math.max(0, Math.min(p.S, Math.floor((t + p.travel) / secs * p.S)));
  if (virtualNow === null && soundCheck.checked) {
    if (running && !st.astRun) mzPlay('start');
    // Cap the catch-up on both: a tab left in the background shouldn't come
    // back and fire a hundred cues at once.
    if (running && st.astFired !== undefined && fired > st.astFired) {
      for (let k = Math.max(st.astFired + 1, fired - 2); k <= fired; k++) mzPlay('shoot');
    }
    if (running && st.astK !== undefined && landed > st.astK) {
      for (let k = Math.max(st.astK + 1, landed - 2); k <= landed; k++) {
        const cue = astImpactCue(F, k);
        mzPlay(cue.name, cue.pitch);
      }
    }
    if (running && bump && !st.astBump) mzPlay('clank');
    if (ot > 0 && !st.astFin) { mzPlay('finale'); st.astFin = true; }
  }
  st.astBump = !!bump;
  if (ot <= 0) st.astFin = false;
  st.astRun = running;
  st.astK = landed;
  st.astFired = fired;
}

// Which impact a shot makes, by the size of what it breaks. There are four
// tiers and only three cues, because the two smallest want the same short tick
// — but the chips get it pitched up, or a run with M = 3 would be thirty-six
// identical ticks per large and nothing else.
function astImpactCue(F, k) {
  const lv = F.nodes[astTargetOf(F, k)].lv;
  if (lv === 0) return { name: 'thud',  pitch: 1 };
  if (lv === 1) return { name: 'crack', pitch: 1 };
  return { name: 'tick', pitch: lv === 2 ? 1 : 1.4 };
}

// Every sound in a run, for the exported track. Two cues per shot: the ship
// firing, and the hit landing a flight-time later. The gap between them is the
// whole character of the sound — pew, then the rock going.
function astSoundTrack(secs, seed, W, H) {
  const p = astPlan(secs);
  // The cue list depends on the kill order AND on whether the ship clips a rock,
  // both of which come from the field — so the exporter has to build it with the
  // same seed and the same card it renders with.
  const w = W || 480, h = H || 320;
  const F = astField(p, seed || 1, w, h, secs);
  const ev = [{ t: 0, name: 'start', pitch: 1 }];
  for (let k = 1; k <= p.S; k++) {
    const hit = astHitAt(p, secs, k);
    ev.push({ t: Math.max(0, hit - p.travel), name: 'shoot', pitch: 1 });
    const cue = astImpactCue(F, k);
    ev.push({ t: hit, name: cue.name, pitch: cue.pitch });
  }
  // Scrape the run for collisions so the exported track has them too. Sampled
  // rather than solved: a contact lasts a good fraction of a second, and this
  // only runs once per export.
  const dt = Math.max(1 / 12, secs / 4000);
  let was = false;
  for (let tt = 0; tt < secs; tt += dt) {
    const hit = !!astCollision(F, p, secs, w, h, tt);
    if (hit && !was) ev.push({ t: tt, name: 'clank', pitch: 1 });
    was = hit;
  }
  ev.push({ t: secs, name: 'finale', pitch: 1 });
  ev.sort((a, b) => a.t - b.t);
  return ev;
}

const MAX_SECONDS = 99 * 3600 + 59 * 60 + 59; // 99:59:59

// ── Outro phase ───────────────────────────────────────────────────────────────
// Narrative widgets need a beat after zero to finish their story (the saucer
// flying off, etc). The chime still fires exactly at zero; only the done-banner
// waits. Timers with no narrative widget on the board are unaffected.
const OUTRO_MS    = 2500;
const OUTRO_TYPES = new Set(['ufo', 'candle', 'sheep', 'maze', 'trek', 'asteroid']);
let   outroStart  = 0;               // timestamp the outro began, 0 when idle

// 0 → 1 across the outro; 0 when no outro is playing.
function outroT() {
  if (!outroStart) return 0;
  return Math.min(1, (NOW() - outroStart) / OUTRO_MS);
}

function finishTimer() {
  outroStart = 0;
  doneBanner.style.display = 'block';
  setInputsDisabled(false);
  startBtn.textContent = '▶ Start';
}

let _lastDigitSec = -1;
function updateDigits(secs) {
  // When called without an argument, show the set duration (edit mode)
  const val = (secs !== undefined) ? secs : totalSeconds;
  const h = Math.floor(val / 3600);
  const m = Math.floor(val / 60) % 60;
  const s = val % 60;
  dgtEls[0].textContent = Math.floor(h / 10);
  dgtEls[1].textContent = h % 10;
  dgtEls[2].textContent = Math.floor(m / 10);
  dgtEls[3].textContent = m % 10;
  dgtEls[4].textContent = Math.floor(s / 10);
  dgtEls[5].textContent = s % 10;

  // Dim leading zeros so the active units read first: 00:05:00
  const lead = [h < 10, h === 0, h === 0 && m < 10, false, false, false];
  dgtEls.forEach((el, i) => el.classList.toggle('leading', lead[i]));
}

function stopTimer() {
  pausedElapsed = getElapsed(); // save where we paused
  running = false; startStamp = null;
  _lastDigitSec = -1;
}

function setDuration(secs) {
  running = false; startStamp = null; pausedElapsed = 0; outroStart = 0;
  totalSeconds = Math.max(1, Math.min(secs, MAX_SECONDS));
  remaining = totalSeconds;
  doneBanner.style.display = 'none';
  startBtn.textContent = '▶ Start';
  updateDigits();
}

// Wire up each +/− button
document.querySelectorAll('.dbt').forEach(btn => {
  btn.addEventListener('click', () => setDuration(totalSeconds + parseInt(btn.dataset.delta)));
});
// ── Sound library ─────────────────────────────────────────────────────────────
const SOUNDS = {
  // Soft two-note bleat — a wobbling sawtooth through a lowpass reads as "baa"
  baa(ac) {
    const t = ac.currentTime;
    [[0, 0.34, 415, 350], [0.30, 0.42, 392, 330]].forEach(([s, d, f0, f1]) => {
      const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
      const vib = ac.createOscillator(), vg = ac.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 1100;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0, t + s);
      o.frequency.linearRampToValueAtTime(f1, t + s + d);
      vib.type = 'sine'; vib.frequency.value = 22;      // the characteristic waver
      vg.gain.value = 13;
      vib.connect(vg); vg.connect(o.frequency);
      o.connect(lp); lp.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0, t + s);
      g.gain.linearRampToValueAtTime(0.5, t + s + 0.05);
      g.gain.setValueAtTime(0.42, t + s + d * 0.6);
      g.gain.exponentialRampToValueAtTime(0.001, t + s + d);
      vib.start(t + s); o.start(t + s);
      o.stop(t + s + d + 0.05); vib.stop(t + s + d + 0.05);
    });
  },

  // Friendly ascending chime — good for primary classrooms
  chime(ac) {
    const t = ac.currentTime;
    [[523,0,.5],[659,.28,.55],[784,.56,.7],[1046,.85,.9]].forEach(([f,s,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+s);
      g.gain.linearRampToValueAtTime(.9,t+s+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.start(t+s); o.stop(t+s+d+.1);
    });
  },

  // Rich school bell with harmonics + long sustain
  bell(ac) {
    const t=ac.currentTime;
    [[440,1],[880,.5],[1320,.25],[1760,.12],[2200,.06]].forEach(([f,amp])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(amp,t+.01);
      g.gain.exponentialRampToValueAtTime(.001,t+3.0);
      o.start(t); o.stop(t+3.1);
    });
  },

  // Single crisp high ding
  ding(ac) {
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sine'; o.frequency.value=1318; // E6
    g.gain.setValueAtTime(1.0,t);
    g.gain.exponentialRampToValueAtTime(.001,t+2.2);
    o.start(t); o.stop(t+2.3);
  },

  // Urgent repeating alarm beeps
  alarm(ac) {
    const t=ac.currentTime;
    for(let i=0;i<6;i++){
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(.8,t+i*.22);
      g.gain.setValueAtTime(0,t+i*.22+.16);
      o.start(t+i*.22); o.stop(t+i*.22+.18);
    }
  },

  // Triumphant fanfare — great for celebrations
  fanfare(ac) {
    const t=ac.currentTime;
    [[523,.0,.14],[523,.15,.14],[523,.3,.14],[659,.44,.32],[523,.76,.14],
     [659,.91,.32],[784,1.24,1.0]].forEach(([f,s,d])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.85,t+s);
      g.gain.exponentialRampToValueAtTime(.001,t+s+d);
      o.start(t+s); o.stop(t+s+d+.05);
    });
  },

  // Game-show style buzzer
  buzzer(ac) {
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type='sawtooth'; o.frequency.value=180;
    g.gain.setValueAtTime(.9,t);
    g.gain.setValueAtTime(.9,t+.85);
    g.gain.exponentialRampToValueAtTime(.001,t+1.1);
    o.start(t); o.stop(t+1.2);
  },
};

function playSound(name) {
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    SOUNDS[name]?.(ac);
  } catch(e) {}
}

function playDone() {
  // Deliberately NOT gated on soundCheck. That toggle silences the cues during
  // the run; the sound that tells a room the timer is finished is the one thing
  // you don't want disappearing with them. Choose "End: off" to silence it.
  if (soundSelect.value === 'off') return;
  playSound(soundSelect.value);
}

startBtn.addEventListener('click', () => {
  // Resume from inside the click. Browsers only let an AudioContext start on a
  // real user gesture, and resume() called from the RAF loop is too late.
  try { mzCtx(); } catch (e) {}
  if (getPreciseRemaining() <= 0) return;
  if (running) {
    stopTimer(); // saves pausedElapsed
    startBtn.textContent = '▶ Resume';

  } else {

// ── Fullscreen / presentation mode ───────────────────────────────────────────
// Hides the header and control bar so the timers own the whole display. The
// floating bar keeps start/reset/exit reachable without leaving fullscreen.
const presentBar   = document.getElementById('present-bar');
const presentTime  = document.getElementById('present-time');
const presentStart = document.getElementById('present-start');
let presentHideTimer = null, idleTimer = null;

const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

function revealPresentBar() {
  if (!document.body.classList.contains('presenting')) return;
  presentBar.classList.add('show');
  document.body.classList.remove('idle');
  clearTimeout(presentHideTimer);
  clearTimeout(idleTimer);
  presentHideTimer = setTimeout(() => presentBar.classList.remove('show'), 2800);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3200);
}

async function enterPresent() {
  document.body.classList.add('presenting');
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch (e) {
    // Fullscreen can be refused (iOS Safari has no element fullscreen).
    // The chrome is still hidden, which is most of the benefit.
  }
  revealPresentBar();
}

function exitPresent() {
  document.body.classList.remove('presenting', 'idle');
  presentBar.classList.remove('show');
  clearTimeout(presentHideTimer);
  clearTimeout(idleTimer);
  if (inFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}

document.getElementById('present-btn').addEventListener('click', e => {
  e.currentTarget.blur();   // the bar is about to be hidden; don't strand focus
  enterPresent();
});
document.getElementById('present-exit').addEventListener('click', exitPresent);
presentStart.addEventListener('click', () => { startBtn.click(); revealPresentBar(); });
document.getElementById('present-reset').addEventListener('click', () => {
  document.getElementById('reset-btn').click(); revealPresentBar();
});

// Leaving fullscreen by any route (Esc, browser UI) must drop presentation mode
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    if (!inFullscreen() && document.body.classList.contains('presenting')) exitPresent();
  }));

['mousemove', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, revealPresentBar, { passive: true }));

// Keyboard: F toggles fullscreen, Esc leaves it, Space starts/pauses.
// Ignored while typing so the background search box still works.
document.addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if (typing) return;                       // never steal keys from a text field
  const presenting = document.body.classList.contains('presenting');

  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    presenting ? exitPresent() : enterPresent();
  } else if (e.key === 'Escape' && presenting) {
    exitPresent();
  } else if (e.code === 'Space' && tag !== 'BUTTON') {
    // Space is how a keyboard user activates a focused button, so only take it
    // when focus isn't on one.
    e.preventDefault();                     // otherwise the page scrolls
    startBtn.click();
    revealPresentBar();
  }
});
